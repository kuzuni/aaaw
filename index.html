<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>꼬마기사 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    --grass:#7FBF52; --lobby-bg:#3E7B33; --lobby-bg-d:#2E5F26;
    --panel:#232327; --panel2:#2E2E34; --panel3:#3A3A42;
    --gold:#FFB92E; --hp:#E8483F; --shield:#38A6E8; --exp:#8BC93F;
    --ink:#FFFFFF; --ink-dim:#B9BDC4;
    --rare:#4FA3E8; --legend:#FFB92E; --common:#9EA3AC; --myth:#FF5E6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  body{
    margin:0; background:#141418; color:var(--ink);
    font-family:'Jua','Malgun Gothic',sans-serif;
    display:flex; justify-content:center; align-items:center; min-height:100vh;
    min-height:100dvh; /* 모바일 주소창 표시/숨김에 따라 실제 보이는 높이로 (T40) */
  }
  #frame{
    position:relative; aspect-ratio:9/19;
    height:100vh; max-height:100vh; max-width:100vw;
    width:min(100vw, calc(100vh * 9 / 19));
    /* T40 — dvh 지원 브라우저(모바일 크롬 108+)에서는 주소창을 뺀 실제 높이 기준.
       100vh 는 «주소창 숨김» 높이라 하단 5탭이 화면 밖으로 잘린다. */
    height:100dvh; max-height:100dvh;
    width:min(100vw, calc(100dvh * 9 / 19));
    /* ⚑ T116 U01 — «프레임 높이» 를 값으로 쓸 수 있게 변수로 둔다. 레이아웃을 레퍼런스와 같은 **비례**로
       맞추려면 세로 여백·높이를 «프레임 높이의 %» 로 적어야 하는데, CSS 의 margin/padding % 는 컨테이너
       «폭» 기준이라 그대로는 못 쓴다. #frame 의 실제 높이 = min(100dvh, 100vw*19/9) 이므로 그것을 그대로
       변수에 담아 calc(var(--fh)*.412) 처럼 쓴다 — 기기 폭이 달라져도 비례가 유지된다(ref-layout.md 의 자). */
    --fh:min(100vh, calc(100vw * 19 / 9));
    --fh:min(100dvh, calc(100vw * 19 / 9));
    background:var(--panel); overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  .screen.on{display:flex;}
  button{font-family:inherit; border:none; cursor:pointer; color:var(--ink); background:none;}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .pill{background:rgba(20,20,24,.72); border-radius:999px; padding:5px 13px; font-size:15px; display:flex; gap:7px; align-items:center;}

  /* ---------- LOBBY ---------- */
  #lobby{
    background:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><text x="18" y="70" font-size="44" opacity="0.05" transform="rotate(-20 60 60)">⚔</text></svg>'),
      radial-gradient(120% 80% at 50% 0%, #4A8C3D, var(--lobby-bg) 55%, var(--lobby-bg-d));
    align-items:center;
  }
  /* T54 — 축약 표기(최대 8자)를 담도록 상단 줄을 좁혔다. 구 값(gap 8 · padding 12 · pill 15px/13px · 전투력 18px)은
     골드가 «8.26M» 만 돼도 줄이 417px 로 부풀어 390/360 프레임 밖으로 나갔다(🔊 가 화면 밖). 여백·서체만 줄인 것으로는
     360px 를 못 맞춰서, 🔊 는 참고 스크린샷(메인로비.jpg)이 ☰ 를 놓은 자리 그대로 pill 줄 아래 오른쪽으로 뺐다.
     min-width:0 + 말줄임은 마지막 안전망이다 — 실제 도달 최대(챕터 300 «1.96No» · 10년 무과금 «9.13M»)에서는 걸리지 않는다. */
  /* ⚑ T64 — `--tf` 는 상단 줄 «전체» 배율이다(글자·여백·아바타·버튼을 한꺼번에 줄인다).
     T54 의 프레임 연동 글자는 clamp 하한 11px 에서 축소가 멈추는데 아바타 52px·여백은 처음부터 고정이라,
     프레임이 316px 아래로 내려가면(SE 375×667 + 주소창 = 278px · 320×568 = 269px) 줄이 넘쳐
     말줄임 안전망이 «수치» 를 갉아먹었다 — 전투력 «338» 이 «…» 로 떴다. 숫자는 잘리면 거짓이 되므로
     그 앞단에서 줄 전체를 비율로 줄인다. 값은 JS `fitTopRow()` 가 실측으로 정하고,
     ≥390px 프레임·평범한 값에서는 1 이라 종전과 픽셀 단위로 같다. */
  /* ⚑ T116 U01 — 레퍼런스(메인로비.jpg)의 상단 바는 프레임 맨 위에 붙지 않고 y 3.7% 에서 시작해
     높이 4.5% 를 차지한다(ref-layout.md ①). 종전은 y 0 · h 7.6% 였다. */
  .lobby-top{--tf:1; width:100%; display:flex; align-items:center;
    gap:calc(6px * var(--tf)); padding:calc(var(--fh)*.037) calc(10px * var(--tf)) 0;}
  /* 프레임 폭은 min(100vw, 100vh*9/19) 라 기기마다 다르다(390 · 360 · SE 는 316px — T40 이 «9:19 를 16:9 에
     넣을 수 없어 정상» 으로 판정한 값). 고정 14px 는 316px 프레임에서 세 수치를 못 담아 글자가 잘렸다 —
     프레임과 같은 식으로 글자를 함께 줄인다(316 → 11.4px · 360 → 13.0px · 390 이상 → 14px 로 고정). */
  .lobby-top .pill{font-size:calc(clamp(11px, calc(min(100vw, 100vh * 9 / 19) * .036), 14px) * var(--tf));
    padding:calc(5px * var(--tf)) calc(9px * var(--tf)); gap:calc(5px * var(--tf)); min-width:0;}
  .lobby-top .pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* 아바타 — 레퍼런스는 프레임 폭 10.2% · 높이 4.4% 의 정사각(390 프레임에서 ≈38px). 종전 52px 은 h 6.2% 였다. */
  #avatar{width:calc(var(--fh)*.045 * var(--tf)); height:calc(var(--fh)*.045 * var(--tf));
    border-radius:12px; background:#5B87C7; border:3px solid #F2D34B; flex:none;}
  /* ⚑ T116 U02 — 레퍼런스는 **모든 탭**의 상단 바가 «아바타 + 재화 pill 줄(x13.2 w85.4)» 로 같은 모양이다.
     로비에만 아바타가 있고 장비·상점은 pill 이 전폭(w94.9)이라 «탭마다 상단 바가 다르다» 로 깎였다(공통 1점). */
  .top-bar .avatar-box{width:calc(var(--fh)*.045 * var(--tf)); height:calc(var(--fh)*.045 * var(--tf));
    border-radius:12px; background:#5B87C7; border:3px solid #F2D34B; flex:none;}
  .lobby-top .pill{flex:1;}   /* pill 줄이 오른쪽 끝까지 차야 ref 의 w85.4 가 된다(종전 w64.9) */
  #powerPill{font-size:calc(clamp(12px, calc(min(100vw, 100vh * 9 / 19) * .041), 16px) * var(--tf)); color:var(--gold);}
  #sndBtnL,#sndBtnG{width:42px; height:42px; border-radius:12px; background:rgba(20,20,24,.72); font-size:17px; flex:none;}
  /* T54 — 상단 줄에서 빼 참고 스크린샷의 ☰ 자리로. ⚑ T116 U01 — 그 자리를 레퍼런스 % 로 맞췄다(x 88.3 · y 9.2 · 9.0×4.1). */
  #sndBtnL{position:absolute; right:2.7%; top:9.2%; width:35px; height:35px; z-index:5;}
  /* 챕터 500 대응(T36 · ⚑ T102 로 300 → 500): 제목을 눌러 «챕터 이동» 팝업. 로비 구도(메인로비.jpg)는 그대로 — 크기·위치·서체 동일. */
  /* ⚑ T116 U01 — 레퍼런스는 제목이 y 27.2% 에 있고 글자 블록 폭이 프레임의 31.3% 다(종전 y 11.6% · 폭 58.7%).
     24px 은 그 비례에서 나온 값이고 **프레임 폭에 연동하지 않는 고정값**이라 T40/T3 의 «좁은 폰에서 글씨가
     축소되지 않는다» 규약은 그대로다(T3 boot 의 실측 단언도 24px 로 같이 갱신). */
  /* ⚑ T116 U02 — 레퍼런스 챕터 제목은 «x34.7 w31.3 h2.3» 이다(종전 x31.6 w36.8 h3.0 — 폭이 5.5%p 넓었다).
     글자 크기는 여전히 «프레임에 연동하지 않는 고정 px» 이다(T40 규약 — 좁은 폰에서 줄지 않는다). */
  #lobbyChapName{margin-top:calc(var(--fh)*.195); font-size:20px; line-height:1.0; letter-spacing:1.1px;
    text-shadow:0 3px 0 rgba(0,0,0,.35); padding:0; background:none; color:var(--ink); font-family:inherit;}
  /* 이벤트 배너·좌우 사이드 아이콘 열 — 레퍼런스에 있는 «형태» 만 재현하고 기능은 잠금(🔒)이다(T116 ②·④ⓑ).
     흐름 밖(absolute)이라 로비 세로 배치를 건드리지 않는다. */
  .lobby-banner{position:absolute; left:24.5%; top:9.2%; width:51.6%; height:5.6%; border-radius:13px;
    background:linear-gradient(#6C4FA8,#4A3378); border:2.5px solid #8E77C8; display:flex; align-items:center;
    justify-content:center; gap:7px; font-size:13px; color:rgba(255,255,255,.72); box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .side-col{position:absolute; top:16%; width:16.4%; height:21.5%; display:flex; flex-direction:column;
    justify-content:space-between; pointer-events:none;}
  .side-col.l{left:1.4%} .side-col.r{right:1.4%}
  .side-ic{height:30.5%; border-radius:11px; background:rgba(20,20,24,.42); border:2px solid rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:15px; color:rgba(255,255,255,.5);}
  /* 카드와 START 사이의 보조 버튼 2개 줄 — 레퍼런스 y 60.2 · h 7.0 · 폭 37.2 (형태만 · 기능 잠금) */
  .lobby-subrow{display:flex; gap:7px; width:37.2%; height:7%; margin-top:calc(var(--fh)*.055);}
  .lobby-subrow .sb{flex:1; border-radius:12px; background:rgba(20,20,24,.42); border:2px solid rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:rgba(255,255,255,.5);}
  .jump-row{display:flex; gap:8px; width:100%; margin-top:10px;}
  .jump-row button{flex:1; padding:12px 4px; border-radius:14px; background:var(--panel3); font-size:15px;}
  .jump-row button.gold{background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00;}
  .jump-row button:disabled{opacity:.4;}
  #jumpVal{width:100%; margin-top:12px; padding:12px; border-radius:14px; border:2px solid #3E3E48;
    background:#141418; color:var(--ink); font-family:inherit; font-size:26px; text-align:center;
    user-select:text; -webkit-user-select:text;}
  /* ⚑ T116 U01 — 밑줄은 레퍼런스에서 제목 «바로 아래»(y 30.0) 폭 41% 다(종전 190px = 48.7% · 아래 여백 2vh). */
  .chap-underline{width:41%; height:3px; margin:5px 0 0; background:rgba(255,255,255,.35); border-radius:9px; position:relative;}
  .chap-underline::after{content:''; position:absolute; left:50%; top:0; transform:translateX(-50%) rotate(45deg); width:10px; height:10px; border-right:3px solid rgba(255,255,255,.35); border-bottom:3px solid rgba(255,255,255,.35); background:transparent; margin-top:2px;}
  /* ⚑ T116 U01 — 카드 줄은 레퍼런스에서 y 41.0 에서 시작한다(밑줄 아래 10%p). 화살표는 카드 «바깥» 의
     작은 삼각(6.7×4.3%)이라 52×64px 은 두 배 넘게 컸다. */
  .dio-row{display:flex; align-items:center; gap:14px; width:100%; justify-content:center; margin-top:calc(var(--fh)*.098);}
  .dio-arrow{width:26px; height:36px; font-size:22px; color:rgba(255,255,255,.85); text-shadow:0 2px 2px rgba(0,0,0,.3);}
  .dio-arrow:disabled{opacity:.22; cursor:default;}
  /* ⚑ T116 U01 — 레퍼런스 카드는 폭 44.5% · 높이 13.7%(가로가 세로의 1.5배 — 390×844 프레임 기준).
     종전 62% · 정사각(1.05)은 카드 하나가 화면의 27% 를 먹어 제목·START 를 밀어냈다. */
  #dioCard{
    width:44.5%; aspect-ratio:1.5; border-radius:18px; position:relative;
    background:#57964A; border:5px solid #7FB964; border-bottom:14px solid #4A3B2E;
    box-shadow:0 10px 24px rgba(0,0,0,.35); overflow:hidden;
  }
  #dioCv{position:absolute; inset:0; width:100%; height:100%;}
  /* ⚑ T116 U01 — START 는 레퍼런스에서 «카드와 같은 폭·같은 x»(44.5%) 이고 y 70.7 · h 7.0 이다.
     화면 맨 아래가 아니라 그 위이고, 아래 14.9%p 는 비워 둔다(margin-top:auto 폐기 — 그 자리는 탭바가 잡는다). */
  #startBtn{
    margin-top:calc(var(--fh)*.035); margin-bottom:0; padding:calc(var(--fh)*.0155) 0; width:44.5%; border-radius:16px; font-size:26px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00;
    box-shadow:0 6px 0 #C77E12, 0 10px 18px rgba(0,0,0,.3); letter-spacing:4px;
  }
  #startBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #C77E12;}
  /* ⚑ T116 U01 — 레퍼런스 탭바는 프레임의 7.4%(y 92.6~100)다. 종전 9.4% 는 두 칸 더 두꺼웠다.
     `margin-top:auto` 로 «화면 맨 아래» 를 탭바가 잡는다(START 가 auto 를 놓았으므로). */
  .bottomNav{width:100%; margin-top:auto; display:flex; background:var(--panel);
    padding:5px 8px calc(5px + env(safe-area-inset-bottom)); gap:6px; flex:none;}
  .nav-tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 5px; border-radius:12px; font-size:10.5px; color:var(--ink-dim); background:var(--panel2);}
  .nav-tab .nic{font-size:20px; line-height:0; display:block;}   /* 인라인 SVG(UI_SVG) — T2 7단계 */
  .nav-tab.mid{background:linear-gradient(#4A4A54,#3A3A42); color:var(--ink); transform:translateY(-6px); border:2px solid #5A5A66;}
  .nav-tab.locked{opacity:.5;}
  .nav-tab.sel{background:linear-gradient(#4A4A54,#3A3A42); color:var(--ink); border:2px solid #6A6A78;}

  /* ---------- 장비 / 상점 (참고: docs/ref 캐릭터 장비.jpg · 장비 세부팝업.jpg · 상점 (1)(2).jpg) ---------- */
  #gear,#shop{background:radial-gradient(120% 70% at 50% 0%, #35353E, #1E1E24 60%, #17171B);}
  /* ⚑ T64 — 장비·대장간·상점 상단 줄도 로비·인게임과 같은 병이다. `flex:1` 인데 min-width 가 무제한이라
     칸이 못 줄고, `justify-content:center` 라 넘친 만큼 «좌우로 반씩» 삐져나갔다(실측 269px 프레임에서 ±14.9px).
     같은 --tf 배율로 줄 전체를 줄인다 — 값은 JS `renderTopBars()` 가 실측으로 정한다. */
  /* ⚑ T116 U01 — 로비와 같은 자리로 통일했다(레퍼런스는 모든 탭에서 상단 바가 y 3.7 · h 4.5).
     종전은 로비 y0 h7.6 · 나머지 탭 y0 h5.0 으로 «같은 게임 안에서도» 달랐다. */
  .top-bar{--tf:1; display:flex; gap:calc(6px * var(--tf)); padding:calc(var(--fh)*.037) calc(10px * var(--tf)) 6px;
    flex:none; justify-content:center;}
  .top-bar .pill{font-size:calc(13px * var(--tf)); flex:1; justify-content:center; min-width:0;
    padding:calc(4px * var(--tf)) calc(11px * var(--tf)); gap:calc(6px * var(--tf));}
  .top-bar .pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* ⚑ T116 U01 — 레퍼런스(캐릭터 장비.jpg)의 장비 무대는 화면의 26.5%(y 8.5~35)를 쓰고,
     슬롯은 «폭 14% 의 정사각» 3칸이 좌우 끝(x 8.5 / 77.5)에 붙고 가운데 캐릭터가 30% 다.
     종전은 무대 19.5% · 슬롯이 폭 27.8% 의 넓은 가로 카드라 좌우 슬롯열이 화면을 반씩 먹었다. */
  #gearHero{flex:none; display:flex; align-items:center; justify-content:space-between;
    height:calc(var(--fh)*.275); padding:calc(var(--fh)*.013) 8.5% 0;
    background:linear-gradient(#4A8C3D,#3E7B33); border-bottom:3px solid #2A5520;}
  /* ⚑ T116 U02 — 슬롯열은 레퍼런스에서 «무대 위쪽에 붙어»(y9.5 · 무대 y8.5) 칸 폭 14% · 피치 7.3% 다.
     종전은 세로 가운데 정렬이라 무대 안에서 4.4%p 내려앉았고 칸도 11.6% 로 작았다. */
  .hero-col{display:flex; flex-direction:column; gap:calc(var(--fh)*.0085); width:16.9%; align-self:flex-start;}
  #gearAvatar{flex:none; width:36%; height:78%; min-width:0; border-radius:14px; background:rgba(0,0,0,.12);}
  /* ⚑⚑⚑ T140 (주인 2026-09-05 14:3X «장비 아이콘들 너무 작아서 잘 안 보임») — 아이콘 크기 노브는 칸의
     font-size 하나뿐이다(`.gicon` 이 1em). 칸 자리·크기는 T116 레퍼런스 값이라 건드리지 않고 **글자 크기만** 키운다.
     22 → 39px = 1.77배 · 정사각 칸(54.7px @390) 폭의 71% (주인 ② «약 1.6배 · 칸 폭 70% 이상»). */
  .slot-card{position:relative; aspect-ratio:1; border-radius:11px; background:rgba(20,20,24,.55);
    border:2.5px solid #6A6A78; display:flex; align-items:center; justify-content:center; font-size:39px; padding:0;}
  .slot-card .lv{position:absolute; top:-6px; right:-2px; font-size:11px; background:#1C1C22; border-radius:99px; padding:1px 5px; color:var(--gold);}
  .slot-card .plus{position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-size:11.5px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; border-radius:99px; padding:0 5px;}
  /* ⚑ T125 ①-c — «인벤에 더 좋은 장비가 있다» 표시. 자동 장착이 없어졌으니 눈에 띄되 조용해야 한다. */
  .slot-card .upmark{position:absolute; top:-6px; left:-4px; font-size:12px; line-height:1.3; z-index:2;
    background:#3FBF6A; color:#08240F; border-radius:99px; padding:0 4px; font-weight:700;}
  .slot-card .pt{position:absolute; top:2px; left:4px; font-size:10px; color:var(--ink-dim);}
  .slot-card.empty{opacity:.6; border-style:dashed;}
  /* ⚑ T116 U01 — 스탯 요약줄 y 36.5 · h 4.0 · 좌우 10% 여백 (종전 h 6.6 · 여백 2.6) */
  #gearStats{flex:none; display:flex; gap:6px; padding:calc(var(--fh)*.022) 10.5% 0; justify-content:center;}
  #gearStats .gs{flex:1; background:rgba(20,20,24,.6); border-radius:10px; padding:3px 4px; text-align:center; font-size:13px; line-height:1.15;}
  #gearStats .gs small{display:block; font-size:9.5px; color:var(--ink-dim);}
  /* 액션바 — 레퍼런스는 y 42.3 에서 «오른쪽 끝» 에만 버튼(x 70 · w 27)이 있다 */
  .gear-actionbar{flex:none; display:flex; align-items:center; gap:8px; padding:calc(var(--fh)*.015) 3% calc(var(--fh)*.01);}
  .even-note{flex:1; font-size:11px; color:var(--ink-dim); line-height:1.25;}
  /* T60 — `position:relative` 필수. `.bang`(!) 뱃지가 absolute 라 이게 없으면 버튼이 아니라
     조상 `#gear` 에 걸려 화면 우상단(top:-6·right:-4)으로 날아가 프레임 밖으로 잘린다. */
  #fuseBtn{position:relative; width:27%; padding:8px 4px; border-radius:12px; font-size:14px; background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; box-shadow:0 3px 0 #C77E12;}
  #fuseBtn:disabled{filter:grayscale(.8); opacity:.55; box-shadow:none;}
  /* ⚑ T116 U01 — 인벤 그리드는 장비 탭·대장간 모두 y 47.5 · x 3 · w 94 · 5열이고 칸은 «가로가 세로의 1.18배» 다. */
  /* ⚑ T116 U03 — 칸의 부위 태그(`.ptag`)는 `top:-6px` 로 칸 «위» 로 삐져나오는데 이 상자가 `overflow-y:auto` 라
     **첫 행의 라벨이 통째로 잘려 나갔다**. 위 여백 8px 을 주고 같은 값만큼 상자를 끌어올려
     칸의 자리(y47.9 · ref 47.5)는 그대로 두면서 라벨만 살린다. */
  #invGrid{flex:1 1 auto; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(5,1fr);
    gap:6px; padding:8px 3% 10px; margin-top:-8px; align-content:start;}
  /* 인벤 칸 — `docs/ref/캐릭터 장비.jpg`·`장비 합성 업글창.jpg` 구도: 등급색 타일 + 좌상단 부위 태그 + 하단 «장착» 띠 + 금색 +N */
  /* ⚑⚑⚑ T140 — 22 → 41px = 1.86배. 이 칸은 «가로가 세로의 1.18배» 라 짧은 변(높이 58.1px @390)이 한계다:
     41px = 높이의 71% · 폭의 60%. 주인 ② 의 «칸 폭 70%» 를 폭 기준으로 맞추려면 48px 이 되어 칸 높이(테두리 안 53px)를
     넘어 «장착» 띠를 덮으므로, **짧은 변 70%** 로 읽었다(칸 자체는 T116 레퍼런스 값이라 못 키운다 — 위임 판단). */
  .inv-cell{position:relative; aspect-ratio:1.18; border-radius:11px; overflow:visible;
    border:2.5px solid #55555F; display:flex; align-items:center; justify-content:center; font-size:41px; padding:0;
    background:linear-gradient(#4A4A56,#2C2C34);}
  .inv-cell .plus{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); font-size:11.5px; z-index:2;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; border-radius:99px; padding:0 4px;}
  .inv-cell .eqm{position:absolute; inset:auto 0 0 0; font-size:10.5px; background:rgba(10,10,14,.72); border-radius:0 0 8px 8px;}
  .inv-cell .fus{position:absolute; top:-5px; right:-4px; font-size:11px; background:#E8483F; border-radius:99px; padding:0 4px; z-index:2;}
  /* ⚑ T125 ①-c — 새로 뽑은 장비 표시(세부 팝업을 한 번 열면 지워진다) */
  .inv-cell .nwm{position:absolute; top:-5px; left:50%; transform:translateX(-50%); font-size:9.5px; z-index:2;
    background:#3FBF6A; color:#08240F; border-radius:99px; padding:0 4px; font-weight:700; letter-spacing:.3px;}
  /* 부위 태그 — 스크린샷의 좌상단 마름모 라벨 */
  /* ⚑ T140 — 뱃지·라벨은 아이콘에 «비례해» 키우되 1.2~1.25배에 멈춘다: 칸 크기는 T116 레퍼런스 값이라
     못 키우는데 라벨을 1.6배로 하면 부위 태그가 옆 칸(합성 재료 44px)을 덮고 «NEW» 가 부위 태그와 겹친다(실측).
     위임 판단 — 주인이 더 키우라 하면 이 여덟 줄만 바꾼다. */
  .inv-cell .ptag,.fg-cell .ptag{position:absolute; top:-6px; left:-5px; font-size:9.5px; line-height:1.35; z-index:2;
    padding:1px 4px; border-radius:5px 5px 5px 0; color:#12121A; font-family:inherit;
    box-shadow:0 1px 0 rgba(0,0,0,.35);}
  /* 장비 아이콘(인라인 SVG) — 크기는 담는 칸의 font-size 를 그대로 따른다(1em). T2 6단계 */
  .gicon{display:inline-block; width:1em; height:1em; vertical-align:-.14em; flex:none;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));}
  .inv-empty{grid-column:1/-1; text-align:center; color:var(--ink-dim); font-size:13px; padding:26px 10px; line-height:1.5;}
  /* ---------- 합성(대장간) 화면 — 참고: docs/ref/장비 합성 업글창.jpg ---------- */
  #forge{background:radial-gradient(120% 70% at 50% 0%, #35353E, #1E1E24 60%, #17171B);}
  /* ⚑ T116 U01 — 레퍼런스(장비 합성 업글창.jpg)의 대장간은 **재화 줄 없이** 무대가 y 0 에서 41% 까지다
     (재화는 이 화면으로 들어오는 장비 탭이 이미 보여 준다). 마크업은 그대로 두고 표시만 끈다 —
     `renderTopBars` 는 «숨은 줄은 폭 0» 을 이미 전제하고 있어 T64 의 맞춤 로직에 영향이 없다. */
  #forge .top-bar{display:none;}
  /* ⚑ T116 U02 — 무대 h41 · 결과 슬롯 y11.5 w22 h10 · 화살표 y22 w8 h4 · 안내 문구 y15 h6 (ref ⑥).
     («--fh 는 프레임보다 2.45% 작다» 보정 — 프레임 % ÷ 0.9755 를 쓴다) */
  #forgeStage{flex:none; position:relative; display:flex; align-items:center; gap:10px;
    height:calc(var(--fh)*.42); padding:calc(var(--fh)*.118) 3% 12px;
    background:linear-gradient(#5B4636,#3E2F24); border-bottom:3px solid #241A13;}
  /* T62 — 재료 줄(`#fgMats`)은 «칸 3개 + 간격 2개» 로 폭이 고정이라 33% 열보다 넓어질 수 있다.
     `align-items:center` 라 넘치는 폭이 좌우로 반씩 삐져나가고, 왼쪽 초과분이 스테이지 패딩(12px)을
     넘기면 `#frame`(overflow:hidden) 에 잘렸다 — 좁은 폰(프레임 <382px)에서만 보이던 결함.
     세 값을 변수 한 곳에 묶어 두면 칸 크기를 바꿔도 하한이 따라 움직인다(㉚ 이 상시 감시). */
  :root{--fgCell:44px; --fgGap:5px;}
  #forgeCol{display:flex; flex-direction:column; align-items:center; gap:calc(var(--fh)*.012); width:33%;
    align-self:flex-start; min-width:calc(var(--fgCell)*3 + var(--fgGap)*2);}
  .fg-slot{position:relative; width:calc(var(--fh)*.1025); height:calc(var(--fh)*.1025); border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-size:60px; background:rgba(16,16,20,.55); border:3px solid #6A6A78;}   /* ⚑ T140 34 → 60px = 1.76배 · 칸(84.4px) 폭의 71% */
  .fg-slot.empty{border-style:dashed; color:#8A8A96;}
  .fg-slot .plus{position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); font-size:13px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; border-radius:99px; padding:0 5px;}
  .fg-up{font-size:30px; color:#5CD65C; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.4);}   /* ref w8 h4 */
  #fgMats{display:flex; gap:var(--fgGap);}
  .fg-cell{position:relative; width:var(--fgCell); height:var(--fgCell); border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:32px; background:rgba(16,16,20,.5); border:2.5px solid #6A6A78; padding:0;}   /* ⚑ T140 19 → 32px = 1.68배 · 칸(44px) 폭의 73% */
  .fg-cell.empty{border-style:dashed; color:#8A8A96; font-size:28px;}
  /* 안내 문구 — 레퍼런스는 무대 «오른쪽 위»(x45 · y15 · 45×6)에 두 줄로 놓인다(종전은 무대 전체 높이를 채웠다). */
  #fgBanner{flex:none; width:48%; margin:calc(var(--fh)*.0359) 7% 0 auto; align-self:flex-start;
    height:calc(var(--fh)*.0631); overflow:hidden;      /* ⚑ U02 — ref y15 h6 (종전 y9.3 h9.0) */
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:12px; line-height:1.3; background:rgba(10,10,14,.55); border-radius:12px; padding:2px 6px;}
  #fgBanner b{color:var(--gold);}
  /* ⚑ T116 U01 — 레퍼런스의 두 버튼은 «왼쪽 끝 28% · 오른쪽 끝 27.5%» 이고 가운데는 비어 있다(종전 46/46 반씩). */
  .forge-actionbar{flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:calc(var(--fh)*.005) 2% calc(var(--fh)*.008);
    background:linear-gradient(#4A3A2C,#3A2C21); border-bottom:2px solid #241A13;}
  .forge-actionbar button{position:relative; flex:none; width:28%; padding:9px 4px; border-radius:12px; font-size:15px;}
  #fgAuto{background:linear-gradient(#5AA8E8,#3B7FC4); color:#08243D; box-shadow:0 3px 0 #285C93;}
  #fgFuse{background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; box-shadow:0 3px 0 #C77E12;}
  .forge-actionbar button:disabled{filter:grayscale(.8); opacity:.55; box-shadow:none;}
  .bang{position:absolute; top:-6px; right:-4px; width:16px; height:16px; border-radius:99px; background:#E8483F;
    font-size:11px; line-height:16px; color:#fff;}
  /* ⚑ T116 U03 — 장비 탭 `#invGrid` 와 같은 잘림(부위 태그 `top:-6px` ↔ `overflow-y:auto`). 같은 방식으로 고친다. */
  #fgGrid{flex:1 1 auto; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(5,1fr);
    gap:6px; padding:8px 3% 10px; margin-top:-8px; align-content:start;}
  #fgGrid .inv-cell.sel{border-color:#5CD65C; box-shadow:0 0 12px rgba(92,214,92,.55);}
  #fgGrid .inv-cell.off{opacity:.32; filter:grayscale(.7);}
  /* 뒤로 버튼 — 레퍼런스는 좌하단의 폭 17% 짜리 작은 버튼이다(종전 전폭). */
  .forge-back{flex:none; padding:5px 3% calc(5px + env(safe-area-inset-bottom)); background:var(--panel);}
  #fgBack{width:17%; padding:8px 4px; border-radius:12px; font-size:14px; background:var(--panel3);}
  /* ⚑ T116 U01 — 레퍼런스 상점은 «광고/무료 줄(y12.5 · h6.5) → 섹션 헤더(y22.5) → 3열 상품 그리드» 순이다.
     맨 위 헤더는 레퍼런스에 없어서 접고, 무료 보급 카드는 세로로 쌓인 카드가 아니라 한 줄짜리 띠로 만든다. */
  /* ⚑ T116 U02 — 레퍼런스 상점(1) 의 세로 리듬을 그대로 재현한다:
     무료 줄 y12.5 h6.5(**좌우 2칸**) → 헤더 y22.5 → 3열 그리드 1행 y27 · 2행 y47.5(각 h18.5 · 피치 20.5)
     → 두 번째 헤더 y66 → 두 번째 카드행 y70.5 h18.5. 상품이 1종뿐이라 나머지 칸은 «형태만 · 기능 🔒»
     (ROUTINE T116 ④ⓑ — 비평가의 «칸을 채우라» 는 형태로만 받고 상품을 새로 만들지 않는다). */
  #shopBody{flex:1 1 auto; min-height:0; overflow-y:auto; padding:calc(var(--fh)*.039) 3% 12px;}
  .shop-sec{font-size:15px; color:var(--ink-dim); margin:calc(var(--fh)*.035) 0 0;
    height:calc(var(--fh)*.025); line-height:calc(var(--fh)*.025); text-align:center;}
  .shop-sec:first-child{display:none;}
  .shop-sec.tight{margin-top:0;}
  .free-row{display:flex; gap:2%; height:calc(var(--fh)*.065);}
  .free-row .gem-card{flex:1; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px;
    height:100%; padding:0 9px; font-size:12px;}
  .free-row .gem-card .amt{font-size:15px;}
  .free-row .gem-card button{margin:0; width:38%; font-size:11.5px;}
  .gacha-card{border-radius:18px; padding:12px; background:linear-gradient(150deg,#5A3E8C,#8A4FA8 60%,#C05C9E);
    box-shadow:0 5px 0 rgba(0,0,0,.28);
    margin-top:calc(var(--fh)*.018); min-height:calc(var(--fh)*.155);  /* ⚑ U02 h18.5 → ⚑ T153 로 3칸이라 살짝 낮췄다 */
    display:flex; flex-direction:column; justify-content:center;}
  /* ⚑⚑⚑ T153 — 상자 3종. 등급색(GT.rarColor 의 희귀 파랑 · 전설 금색 · 신화 분홍)과 결을 맞춘 배경이고,
     세 칸이 세로로 쌓이므로 높이를 «한 칸» 기준(U02 h18.5)보다 줄여 상점이 한 화면에 남게 한다. */
  .gacha-card.gb-rare  {background:linear-gradient(150deg,#2C4A70,#3E7FB8 60%,#4FA3E3);}
  .gacha-card.gb-legend{background:linear-gradient(150deg,#6B4E12,#B58A22 60%,#F2C14E);}
  .gacha-card.gb-myth  {background:linear-gradient(150deg,#5A3E8C,#8A4FA8 60%,#C05C9E);}
  .gacha-card .ttl{font-size:20px; text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .gacha-card .pity{font-size:12px; background:rgba(10,10,14,.42); border-radius:10px; padding:5px 8px; margin:6px 0; line-height:1.45;}
  .gacha-btns{display:flex; gap:8px;}
  .gacha-btns button{flex:1; padding:11px 4px; border-radius:13px; font-size:15px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; box-shadow:0 3px 0 #C77E12;}
  .gacha-btns button:disabled{filter:grayscale(.85); opacity:.6; box-shadow:none;}
  /* ⚑ T116 U01 — 레퍼런스 상품 그리드는 **3열**이고 카드 하나가 «폭 30% · 높이 18.5%»(세로가 긴 0.75 비율)다. */
  .gem-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:calc(var(--fh)*.02) 2%;
    margin-top:calc(var(--fh)*.02);}   /* ⚑ U02 — 1행 y27 · 행 피치 20.5 · 가로 간격 2 → 칸 폭 30 */
  .gem-card{border-radius:15px; padding:9px 6px; text-align:center; background:linear-gradient(#6E3B8E,#4A2A66);
    font-size:11.5px; line-height:1.25; display:flex; flex-direction:column; justify-content:space-between;}
  .gem-grid .gem-card{height:calc(var(--fh)*.185);}   /* = 프레임 18.5% (폭 30% 와 함께 0.62:1 비례) */
  .gem-card.lock{background:linear-gradient(#3A3A44,#2A2A32); color:var(--ink-dim); opacity:.72;}
  .gem-card .amt{font-size:16px; color:#FFD9F0;}
  .gem-card button{margin-top:5px; width:100%; padding:6px 3px; border-radius:10px; font-size:12px; background:var(--panel3);}
  .gem-card button:disabled{opacity:.5;}
  .pull-list{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%; margin:6px 0 12px;}
  .pull-list .inv-cell{font-size:35px;}   /* ⚑ T140 20 → 35px = 1.75배 · 칸(57.5×48.7 @390) 짧은 변의 72% (10연차 11칸 포함) */
  .gd-opt{display:flex; gap:7px; align-items:flex-start; font-size:12.5px; text-align:left; padding:5px 7px;
    background:rgba(20,20,24,.5); border-radius:9px; margin-bottom:4px; line-height:1.3;}
  .gd-opt.lock{opacity:.42;}
  .gd-stat{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 7px; background:rgba(20,20,24,.5); border-radius:9px; margin-bottom:4px;}
  /* ⚑ T116 U02 — 세부팝업 5블록 (레퍼런스 `장비 세부팝업.jpg` · 값은 전부 프레임 % 목표를 역산한 것):
     배지 y27.5 w22 h2.3(윗변에 걸침) · 아이콘 x11 y30.5 w15 h7 · 이름줄 x28 w50 h3 · 메타줄 x29 w60 h3
     · 스탯 y39.5 h9.5 · 옵션 y48 h14(안에서만 스크롤) · 비용 y62.5 h3 · 버튼 x15.5 y66 w69 h6 */
  .gd-badge{position:absolute; top:calc(var(--fh)*-.005); left:50%; transform:translateX(-50%);
    width:27.9%; height:calc(var(--fh)*.023); display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#1c1c20; border-radius:8px; box-shadow:0 2px 0 rgba(0,0,0,.35);}
  .gd-head{display:flex; gap:3.4%; align-items:flex-start; width:100%; text-align:left;}
  .gd-ic{width:19%; height:calc(var(--fh)*.0718); flex:none; display:flex; align-items:center; justify-content:center;
    font-size:50px; background:rgba(20,20,24,.5); border-radius:13px;}
  /* ⚑⚑⚑ T140 — 38 → 50px = 1.32배. 여기만 1.6배가 아닌 이유: 이 칸(`.gd-ic`)은 이미 레퍼런스
     (`장비 세부팝업.jpg` 아이템 아이콘 w15 h7)와 같은 크기라 칸을 더 키우면 주인 ③ «레퍼런스 비율에 맞춘다» 와
     어긋난다. 대신 **칸 채움을 66% → 87%** 로 올려 «칸 폭 70% 이상» 을 넉넉히 넘긴다. */
  .gd-headtx{flex:1; min-width:0;}
  .gd-name{width:81%; font-size:18px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gd-meta{width:97%; display:flex; justify-content:space-between; gap:6px; margin-top:8px;
    font-size:12.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden;}
  .gd-stats{width:100%; margin-top:calc(var(--fh)*.0205);}
  .gd-opts{width:100%; height:calc(var(--fh)*.1435); overflow-y:auto; overflow-x:hidden; text-align:left;}
  /* 3줄이 «스탯 섹션 h9.5» 안에 들어가려면 한 줄 25px(=프레임 2.96%) — 종전 28px 은 10.7% 라 넘쳤다. */
  #overlay.ov-gear .gd-stat{padding:3px 7px; margin-bottom:3px;}
  .gd-secname{font-size:13px; color:var(--ink-dim); margin:4px 0 5px;}
  .gd-cost{width:100%;}
  .gd-row{display:flex; gap:8px; width:100%; margin-top:8px;}
  #overlay.ov-gear .gd-row{width:87.3%; margin-top:6px;}   /* = 프레임 x15.5 w69 */
  .gd-row button{flex:1; padding:12px 6px; border-radius:14px; font-size:15px; background:var(--panel3);}
  .gd-row button.gold{background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00;}
  .gd-row button:disabled{opacity:.5;}
  #toast{position:absolute; left:50%; bottom:16%; transform:translateX(-50%); background:rgba(10,10,14,.9); padding:10px 20px; border-radius:99px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:60; white-space:nowrap;}
  #toast.on{opacity:1;}

  /* ---------- GAME ---------- */
  #game{background:var(--grass);}
  #cvWrap{position:relative; flex:1 1 auto; min-height:0;}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block;}
  /* ⚑ T64 — 인게임 상단 줄도 같은 병을 앓았다. 이쪽은 T54 의 손이 안 닿아 고정 14px·min-width 무제한이라
     칸이 줄지 못하고 «넘친 만큼 오른쪽으로 밀려» ☰ 가 프레임(overflow:hidden) 밖으로 나갔다 —
     실측 269px 프레임에서 ☰ 오른쪽 끝이 프레임 밖 +25.9px(골드 «120.00Dc» 면 +32.9px)라
     일시정지·포기가 아예 눌리지 않았다. 로비와 같은 `--tf` 배율 + min-width:0 안전망으로 맞춘다. */
  /* ⚑ T116 U01 — 레퍼런스 인게임 HUD 는 pill 줄 y 5.2 · 챕터 제목 y 11.0 · 진행 바 y 14.2 다(종전 1.2/7.6/11.5). */
  #topbar{--tf:1; position:absolute; top:calc(var(--fh)*.052); left:calc(12px * var(--tf)); right:calc(12px * var(--tf));
    display:flex; gap:calc(8px * var(--tf)); align-items:center;}
  #topbar .pill{font-size:calc(14px * var(--tf)); padding:calc(4px * var(--tf)) calc(12px * var(--tf));
    gap:calc(7px * var(--tf)); min-width:0;}
  #topbar .pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #menuBtn{width:42px; height:42px; border-radius:12px; background:rgba(20,20,24,.8); font-size:18px;}
  #topbar #menuBtn,#topbar #sndBtnG{width:calc(42px * var(--tf)); height:calc(42px * var(--tf));}
  #topbar #menuBtn{font-size:calc(18px * var(--tf));}    /* 배율만 얹는다 — tf=1 이면 종전 값 그대로 */
  #topbar #sndBtnG{font-size:calc(17px * var(--tf));}
  #topbar #sndBtnG{margin-left:auto;}
  #chapHud{position:absolute; top:calc(var(--fh)*.108); left:0; right:0; text-align:center; pointer-events:none;}
  /* ⚑ T116 U02 — 인게임 제목도 ref 는 «x36 w28 h2.6» 이다(종전 x30.1 w39.5 — 자간 2px 이 폭을 벌렸다). */
  /* ⚑ T116 U03 — 블록이라 상자가 늘 «x0 w100»(부모 폭) 이었다. `inline-block` 으로 글자를 감싸야
     자(ref ② 챕터 제목 x36 w28)가 재는 대상과 실제 상자가 같아진다. 가운데 정렬은 부모 `text-align` 이 준다. */
  #chapHud .nm{display:inline-block; font-size:17px; line-height:1.25; letter-spacing:1px; text-shadow:0 2px 3px rgba(0,0,0,.5);}
  #progOut{width:56%; height:9px; margin:5px auto 0; background:rgba(20,20,24,.8); border-radius:99px; overflow:hidden;}
  #progIn{height:100%; width:0%; background:var(--gold); border-radius:99px; transition:width .3s;}
  /* ⚑ T116 U01 — 배속 버튼은 레퍼런스에서 하단 패널 «바로 위»(y 65 · 11×4)다. 종전은 패널에서 12px 띄워 y 59 였다. */
  #speedBtn{position:absolute; left:12px; bottom:4px; padding:6px 12px; border-radius:12px; background:rgba(60,20,20,.85); font-size:15px; border:2px solid rgba(255,255,255,.25);}
  /* ⚑ T116 U02 — 우하단 원형 버튼 «형태만»(ref x85 y63 w13 h6.5 · 기능 잠금). #cvWrap 은 y0~69.4 이므로
     프레임 63% = 래퍼 높이의 90.8% 자리다. pointer-events 를 끊어 전투 조작을 가리지 않는다. */
  #hudRound{position:absolute; left:85%; top:90.8%; width:13%; height:9.4%; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:17px; pointer-events:none;
    background:rgba(20,20,24,.55); border:2.5px solid rgba(255,255,255,.22); color:var(--ink-dim);}
  /* 레퍼런스 우하단의 원형 버튼 — 형태만(기능 잠금 · 캔버스 조작을 막지 않게 pointer-events 없음) */
  #lockRound{position:absolute; right:2%; bottom:1.5%; width:13%; aspect-ratio:1; border-radius:50%;
    background:rgba(20,20,24,.45); border:2.5px solid rgba(255,255,255,.22); display:flex; align-items:center;
    justify-content:center; font-size:17px; color:rgba(255,255,255,.5); pointer-events:none;}

  /* 발동 중 버프 아이콘 (주인 지시 07:0X — 챕터 아래, 왼쪽, 오래된 것이 위) */
  /* top 은 #chapHud 아래로 — 챕터 블록(제목+진행 바)의 실측 높이가 42px 이라 46px 을 띄운다.
     ⚑ T116 U01 로 #chapHud 가 고정 64px 에서 «프레임 높이의 10.8%» 로 바뀌었으므로 여기도 같은 식에 얹는다
     (안 그러면 프레임이 커질 때 버프 아이콘이 챕터 표시를 파고든다 — 게이트 ⑬ 이 그 차이를 본다). */
  #buffBar{position:absolute; top:calc(var(--fh)*.108 + 46px); left:10px; display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:5;}
  .buff-ic{
    position:relative; width:34px; height:34px; border-radius:11px; border:2.5px solid var(--bc,#9EA3AC);
    background:rgba(20,20,24,.78); display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 0 9px var(--bg,rgba(0,0,0,.4)); animation:popIn .18s ease-out;
  }
  .buff-ic .cnt{
    position:absolute; right:-5px; top:-5px; min-width:16px; height:16px; padding:0 3px; border-radius:99px;
    background:var(--bc,#9EA3AC); color:#141418; font-size:11px; line-height:16px; text-align:center;
  }

  /* 얻은 특전 미리보기 줄 (주인 지시 07:0X — Info 버튼 행 왼쪽 끝부터 획득 순서대로) */
  #perkStrip{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:4px; overflow:hidden; height:34px;}
  .pv-ic{
    position:relative; flex:none; width:28px; height:28px; border-radius:9px; border:2px solid var(--bc,#9EA3AC);
    background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .pv-ic .cnt{
    position:absolute; right:-4px; top:-4px; min-width:14px; height:14px; padding:0 3px; border-radius:99px;
    background:var(--bc,#9EA3AC); color:#141418; font-size:10px; line-height:14px; text-align:center;
  }
  .pv-more{flex:none; height:28px; padding:0 7px; border-radius:9px; background:var(--panel2); border:2px solid #3E3E48;
    color:var(--ink-dim); font-size:12px; display:flex; align-items:center;}

  /* ⚑ T116 U01 — 레퍼런스 하단 패널은 화면의 30.5%(y 69.5~100)다. 종전 34.9% 는 전투 그림을 4%p 더 잡아먹었다.
     바 줄은 두께 3.7%(≈30px · 종전 24px) · 스탯칸은 높이 5.2%(≈44px) 라 칸을 키우고 여백을 줄여 맞춘다. */
  #hud{flex:0 0 auto; background:var(--panel); padding:4px 12px; border-top:3px solid #17171a;}
  .bars{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .bar{position:relative; flex:1; height:28px; background:#141418; border-radius:99px; overflow:hidden;}
  .bar .fill{position:absolute; inset:0; width:100%; border-radius:99px; transition:width .15s;}
  .bar .txt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; text-shadow:0 1px 2px rgba(0,0,0,.6); font-variant-numeric:tabular-nums;}
  /* ⚑ 경험치 바 (주인 지시 2026-09-03 — 캡은 «레벨» 이 아니라 «EXP»). 캡이 ❤️·🛡️ 한 글자보다 넓어서
     «절대배치 캡 + 바 전체 가운데 숫자» 로는 둘이 겹친다 — 이 바만 가로 flex(캡 → 남은 폭 가운데 숫자)로 깐다.
     글자는 T54 선례대로 프레임 폭에 연동해 좁은 기기에서 줄이고, 캡·숫자에 z-index 를 줘
     absolute 인 채움 막대(.fill) 위로 올린다(안 그러면 숫자가 막대에 먹힌다). */
  #expBar{flex:.62; display:flex; align-items:center; gap:2px; padding:0 5px;}
  #expBar .fill{background:var(--exp);}
  #expBar .cap{position:relative; inset:auto; transform:none; flex:none; z-index:1;
    font-size:clamp(8px, min(100vw,100vh*9/19)*.027, 11px);}
  #expBar .txt{position:relative; inset:auto; flex:1 1 auto; min-width:0; overflow:hidden; z-index:1;
    font-size:clamp(8px, min(100vw,100vh*9/19)*.032, 12.5px);}
  #hpBar .fill{background:linear-gradient(#F2766E,var(--hp));}
  #shBar .fill{background:linear-gradient(#6CC0F0,var(--shield));}
  .bar .cap{position:absolute; left:7px; top:50%; transform:translateY(-50%); font-size:11px; z-index:1; text-shadow:0 1px 2px rgba(0,0,0,.7);}
  /* 참고 스크린샷(docs/ref/메인 게임화면.jpg)의 «EXP» 뱃지 글꼴 — 크기는 위 #expBar .cap 이 프레임에 연동한다. */
  .bar .cap-exp{font-weight:800; letter-spacing:.6px; color:#fff;}
  #stats{display:grid; grid-template-columns:1fr 1fr; gap:3px;}
  .st{display:flex; align-items:center; gap:9px; background:var(--panel2); border-radius:12px; padding:6px 11px;}
  /* 스탯 아이콘 — 인라인 SVG(UI_SVG). 크기 노브는 이 font-size 하나뿐이다(.gicon 이 1em). T2 7단계 */
  .st .ic{font-size:24px; line-height:0; flex:none; display:block;}
  .st .lb{font-size:11px; color:var(--ink-dim); line-height:1.1;}
  .st .vl{font-size:15px; line-height:1.15; font-variant-numeric:tabular-nums;}
  .st .vl.up{color:#7ED957;}
  #hudFoot{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:5px;}
  /* ⚑ T116 U01 — 레퍼런스의 인포 버튼은 우하단의 **작은 정사각**(폭 10% · 높이 4.0%)이다.
     종전은 «📘 Info» 글자까지 넣은 폭 22.4% 짜리 알약이었다. 글자는 `font-size:0` 으로 지우고
     아이콘만 남긴다 — 마크업·클릭 대상(#infoBtn)은 그대로라 T3 battle 실측 4항목이 그대로 통과한다. */
  #infoBtn{
    display:flex; align-items:center; justify-content:center; gap:0; background:var(--panel2); border-radius:12px;
    width:10%; height:34px; padding:0; font-size:0; color:var(--ink-dim); border:2px solid #3E3E48;
  }
  #infoBtn .bk{font-size:20px;}

  /* ---------- OVERLAY ---------- */
  /* ⚑ T116 U01 — 레퍼런스의 팝업은 «화면 가운데 떠 있는 상자» 다: 폭 87% · 좌우 여백 6.5% 대칭 ·
     윗변이 화면의 23~28% 에서 시작한다(장비 세부팝업 y28 h44 · 특전 인포 y23 h52.5).
     종전은 상자 없이 세로 가운데 정렬이라 «팝업 규격» 자체가 없었다. */
  #overlay{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:flex-start;
    background:rgba(10,10,14,.87); padding:calc(var(--fh)*.25) 6.5% calc(var(--fh)*.06); z-index:50; text-align:center; overflow:hidden;}
  #overlay.on{display:flex; animation:fadeIn .2s ease-out;}
  .ov-inner{width:100%; display:flex; flex-direction:column; align-items:center; animation:popIn .34s cubic-bezier(.2,1.6,.4,1);
    position:relative; min-height:calc(var(--fh)*.43); max-height:calc(var(--fh)*.48); overflow-y:auto; overflow-x:hidden;
    background:#25252B; border:3px solid #45454F; border-radius:20px; padding:13px 11px;}
  /* ⚑ T116 U02 — U01 은 «팝업 = 상자 하나» 로 눌렀는데, 레퍼런스의 팝업은 규격이 **세 벌**이다:
     ⓐ 상자가 아예 없는 «전면» — 특전 획득창(`perks.jpg`: 카드가 화면에 바로 놓인다 · 하단 버튼 y79)
     ⓑ 상자 y28 h44 — 장비 세부팝업(내용이 상자 안에 다 담긴다 · 버튼 y66 · 닫기는 상자 «밖» y91.5)
     ⓒ 상자 y23 h52.5 — 특전 인포(제목 리본이 윗변에 걸치고 목록이 y26.5 에서 시작)
     하나로 누른 탓에 U02 채점에서 특전 묶음이 0/13, 장비 팝업이 0/10 이었다(버튼줄 y83.7 = 상자 밖 → 안 보임).
     `openOverlay(html,{cls})` 가 #overlay 에 이 세 클래스 중 하나를 걸고, 나머지 팝업은 종전 규격 그대로다. */
  #overlay > .ov-out{margin-top:auto;}                       /* 상자 «밖» 아래 줄 (레퍼런스 닫기 안내 y91.5) */
  /* ⚑⚑ T154 — 특전 선택창 «상단 스탯 줄» 8칸 (주인 지시 2026-09-05 18:3X · ref-layout ⑦ x0 y4 w100 h6).
     흐름 밖(절대 배치)이라 배너 y26.5·카드 y36.5 를 밀지 않는다. 칸은 8등분(`flex:1 1 0`)이라
     390·360px 둘 다 한 줄에 들고 서로 겹치지 않는다. 아이콘은 전투 하단 패널과 같은 UI_SVG 그림이다. */
  .ov-stats{position:absolute; left:0; top:4%; width:100%; height:6%; z-index:3; pointer-events:none;
    display:flex; align-items:center;}   /* 좌우 안여백 0 — 레퍼런스는 8칸이 프레임 폭을 그대로 8등분한다 */
  .ov-stats .sc{flex:1 1 0; min-width:0; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
  .ov-stats .sc .ic{font-size:16px; line-height:0; display:block; flex:none;}
  .ov-stats .sc .vl{font-size:11px; line-height:1.1; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .ov-stats .sc .vl.up{color:#7ED957;}   /* 전투 하단 패널(.st .vl.up)과 같은 초록 규칙 */
  /* ⓐ 전면 — 상자·테두리 없음. 좌우 여백 5.5% 라 카드가 x5.5 w89 로 앉는다. */
  #overlay.ov-full{padding:calc(var(--fh)*.25) 5.5% calc(var(--fh)*.135);}
  #overlay.ov-full .ov-inner{flex:1 1 auto; min-height:0; max-height:none; overflow:visible;
    background:none; border:0; border-radius:0; padding:0;}
  /* ⓑ 장비 세부팝업 — 상자 y28 h44 고정. 안쪽 여백 4.6% 라 본문이 x11 w79(ref x11 w78). */
  /* ⚠ `--fh` 는 «프레임 높이» 가 아니라 `min(100dvh, 100vw*19/9)` 라 9:19.5 폰(390×844)에서 프레임보다
     **2.45% 작다**(823.3px ↔ 844px). 그래서 «프레임 %» 목표를 CSS 에 적을 때는 0.9755 로 나눈 값을 쓴다
     (예: 프레임 28% → `calc(var(--fh)*.287)`). U03 이 볼 것 — ref-layout.md 의 «⚑ U02 정정» 참조. */
  #overlay.ov-gear{padding:calc(var(--fh)*.287) 6.5% calc(var(--fh)*.06);}
  #overlay.ov-gear .ov-inner{min-height:calc(var(--fh)*.451); max-height:calc(var(--fh)*.451);
    overflow:visible; padding:calc(var(--fh)*.0256) 4.6% 0;}
  #overlay.ov-gear .ov-inner > *{flex:none;}   /* 상자 높이가 고정이라 안 눌리게 (안 그러면 목록이 쭈그러든다) */
  /* ⓒ 특전 인포 — 상자 y23 h52.5 · 제목 리본이 윗변에 걸친다(ref x25 y21.5 w50 h4). */
  #overlay.ov-book{padding:calc(var(--fh)*.2358) 6.5% calc(var(--fh)*.06);}
  #overlay.ov-book .ov-inner{min-height:calc(var(--fh)*.5382); max-height:calc(var(--fh)*.5382);}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{transform:scale(.78); opacity:0}to{transform:scale(1); opacity:1}}
  @keyframes slideUp{from{transform:translateY(26px); opacity:0}to{transform:translateY(0); opacity:1}}
  @keyframes raySpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes bannerDrop{0%{transform:translateY(-40px) scale(.7); opacity:0}60%{transform:translateY(4px) scale(1.05)}100%{transform:translateY(0) scale(1); opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .rays{
    position:absolute; top:-70px; left:50%; width:340px; height:340px; margin-left:-170px;
    background:conic-gradient(rgba(255,213,79,.28) 0 14deg, transparent 14deg 40deg,

<script>
'use strict';
const $ = id => document.getElementById(id);
/* ── T54: 대형 수치 표기 (docs/ref 스크린샷 기준) ──────────────────────────────
   구 구현은 `toLocaleString('ko-KR')` 콤마 전체 표기였다. 골드는 챕터당 1.22 배로 자라
   챕터 300 에서 41자(«1,790,412,642,764,378,700,000,000,000,000»)가 되는데, 로비 상단
   줄은 그 폭을 감당하지 못해 골드 1,000,000(≈챕터 30~39) 부터 화면 밖으로 밀려났다.
   주인이 넣은 참고 스크린샷 4장이 표기 규약을 그대로 못박아 준다:
     ① 보유 골드   «10.54K» «11.54K»          → 1만 이상은 축약 (메인로비·캐릭터 장비·상점)
     ② 원화 가격   «₩1,700» «₩170,000»        → 콤마 전체 표기 (상점 (1))
     ③ 상품 수량   «12000» «25000» «1800»     → 콤마 없는 정수 (상점 (1))
     ④ 그 외 수치  «6122» «1055» «2258» «543» → 콤마 없는 정수 (전투력·스탯·보유 젬·적 HP)
   ①과 ④는 «1만» 을 경계로 갈리는 같은 함수다 — 관측 표본 9개가 전부 일치한다
   (10540·11540 은 축약 / 6122·1055·2258·543·4801·7845 은 평문).
   접미사 사다리는 1e36(Dc)까지 두고 그 밖은 지수 표기로 떨어뜨린다 — 슬롯 강화 비용이
   Lv150 에서 2.45e84 라 사다리만으로는 못 덮는다(위임 판단). 어느 쪽이든 최대 9자로 묶인다. */
const NUM_SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
const FMT_MIN = 1e4;                       /* 이 값 미만은 평문 정수 (스크린샷 ③④) */
const fmt = n => {
  n = Math.round(n);
  if(!Number.isFinite(n)) return n>0?'∞':'-∞';
  const a = Math.abs(n);
  if(a < FMT_MIN) return String(n);
  let i = Math.floor(Math.log10(a)/3), v = n/Math.pow(1000,i);
  if(Math.abs(v) >= 999.995){ i++; v = n/Math.pow(1000,i); }   /* 999,999 → «1000.00K» 이 아니라 «1.00M» */
  if(i >= NUM_SUF.length) return n.toExponential(2).replace('e+','e');
  return v.toFixed(2) + NUM_SUF[i];

/* ---- 뽑기 (PLAN §11.2) ---- */
function newGacha(){ return {p50:0,p10:0,pulls:0}; }
/* ⚑⚑⚑ T125 (주인 확정 2026-09-04 · 21:0X) — 뽑기 천장 겹침은 «이월» 이 아니라 **둘 다 지급**이다.
   신화 천장(누적 50회째)과 전설 피티(10회째)가 같은 회차에 걸리면 그 한 번이 **신화 1 + 전설 1 = 2개**를
   주고(비용은 1회분), 두 카운터는 각자 0 으로 리셋된다. 10연차 안에서 겹치면 결과가 **11개**로 뜬다.
   그래서 이 함수는 **배열**을 돌려준다(보통 1개 · 겹칠 때만 2개) — 호출부는 전부 배열로 받는다.
   위임 기본값: 그 회차의 자연 굴림은 종전대로 신화가 대체하고, **추가 1개는 전설 등급 고정**이다
   (피티의 «전설 이상» 은 신화가 이미 채웠으므로 보너스는 전설). 추가분의 종류도 일반 굴림과 같이 무작위다.
   종전 조항(«겹치면 신화 우선 · 전설 확정은 다음 뽑기로 이월»)은 폐지됐다. */
/* ⚑⚑⚑ T153 (주인 확정 2026-09-05 18:1X) — 상자가 3종이라 **어느 상자를 뽑았는지**를 받는다.
   `box` 는 `GT.boxes` 의 한 칸(기본 = 신화 상자 = 종전 «그 뽑기 상자»). 천장·피티는 상자마다 다르고
   피티 카운터(p50·p10)도 **상자별로 따로** 센다 — 호출부가 상자별 `newGacha()` 상태를 준다. sim.js 와 1:1. */
function gachaPull(st,box){
  box=box||GT.boxes.myth;
  st.pulls++; st.p50++; st.p10++;
  const pityM=box.pityM>0&&st.p50>=box.pityM, pityL=box.pityL>0&&st.p10>=box.pityL;
  let rar;
  if(pityM) rar=GT.RAR_MYTH;
  else{
    const r=grand()*100;
    rar = box.rarRoll(r);           /* 임계는 상자의 rate 에서 파생 — 리터럴로 되돌리지 말 것 (T65) */
    if(pityL&&rar<GT.RAR_LEGEND) rar=GT.RAR_LEGEND;
  }
  if(rar===GT.RAR_MYTH) st.p50=0;
  if(rar>=GT.RAR_LEGEND) st.p10=0;  /* 신화든 전설이든 전설 피티는 채워졌다 (겹침도 여기서 리셋된다) */
  const mk=r=>{ const t=GT.allTypes[Math.floor(grand()*GT.allTypes.length)];   /* 뽑기 스트림 (R11) */
    return {part:t.part,type:t.type,rar:r,plus:0}; };
  const out=[mk(rar)];
  if(pityM&&pityL) out.push(mk(GT.RAR_LEGEND));  /* 겹침 = 전설 1개 추가 지급 */
  return out;
}

/* ---- 합성 (PLAN §11.3) ---- */
const gearKey=g=>`${g.part}|${g.type}|${g.rar}|${g.plus}`;
/* 합성 산출물 규칙 — 자동(fuseAll)·수동(합성 화면) 둘 다 **이 함수 하나만** 쓴다.
   규칙을 두 곳에 적으면 T8·T9·T11·T12 계열(«같은 수치를 손으로 두 번 옮기다 어긋남») 이 재발한다.
   base = 재료 3개 중 최고 강화품(호출부가 정렬해서 넘긴다). */
function fuseMake(base){
  /* ⚑ T153 — 영웅이 빠져 «희귀 3개 → 전설» 이다(등급 인덱스만 당겨졌고 규칙은 그대로). */
  if(base.rar<GT.RAR_LEGEND) return {part:base.part,type:base.type,rar:base.rar+1,plus:0};
  if(base.rar===GT.RAR_LEGEND){
    const np=base.plus+1;
    return np>=GT.legendToMythPlus
      ? {part:base.part,type:base.type,rar:GT.RAR_MYTH,plus:0}            /* +10강 도달 → 신화 0강 변환 */
      : {part:base.part,type:base.type,rar:GT.RAR_LEGEND,plus:np};
  }
  return {part:base.part,type:base.type,rar:GT.RAR_MYTH,plus:base.plus+1};   /* 신화 무한 강화 */
}
/* inv: 배열. equipped: Set(장착 중인 객체) — 재료에서 제외 */
function fuseAll(inv,equipped){
  let did=true,count=0;
  while(did){
    did=false;
    const groups=new Map();
    for(const g of inv){
      if(equipped.has(g))continue;
      const k=`${g.part}|${g.type}|${g.rar}`;
      if(!groups.has(k))groups.set(k,[]);
      groups.get(k).push(g);
    }
    for(const [k,arr] of groups){
      if(arr.length<3)continue;
      arr.sort((a,b)=>b.plus-a.plus);          /* 재료 중 최고 강화 기준 */
      const mats=arr.slice(0,3), base=mats[0];
      const made=fuseMake(base);
      for(const m of mats){const i=inv.indexOf(m);inv.splice(i,1);}
      inv.push(made);count++;did=true;
      break;                                    /* 인벤이 바뀌었으니 재그룹화 */
    }
  }
  return count;
}
const gearScore=g=>g.rar*1000+g.plus;           /* 등급 우선, 같은 등급이면 강화 (신화0>전설9 제약과 일관) */
function autoEquip(inv){
  const eq={};
  for(const g of inv){ const b=eq[g.part]; if(!b||gearScore(g)>gearScore(b))eq[g.part]=g; }
  return eq;                                    /* {part: gear|undefined} */
}

const evenBonus=b=>1+GT.evenStep*Math.floor(Math.min(...GT.parts.map(pt=>b.slots[pt]||0))/GT.evenPer);
function buildPower(b){
  if(b.flat)return b.flat;
  let atk=0,hp=0,sh=0;
  for(const pt of GT.parts){
    const g=b.eq[pt]; if(!g)continue;
    const m=GT.slotMul(b.slots[pt]||0)*(1+GT.plusStep*g.plus);
    atk+=GT.atk[g.rar]*m; hp+=GT.hp[g.rar]*m; sh+=GT.sh[g.rar]*m;
  }
  const ev=evenBonus(b);
  return {atk:(TUNE.pAtk0+atk)*ev, hp:(TUNE.pHp0+hp)*ev, sh:(TUNE.pSh0+sh)*ev};
}

/* UI 아이콘 1개 — 없는 키는 폴백(spark). 스탯 그리드·하단 탭·버프바가 전부 이 함수 하나만 쓴다. */
function uiIcon(k){ return svgIcon(UI_SVG[k]||UI_SVG.spark); }
/* ⚑ T124 — «계열» 이 «세트» 로 바뀌었다. 종류 키 앞부분이 곧 세트라 이름·색을 여기서 한 번에 준다.
   세트색은 위임 기본값(치명 = 붉은색 · 체력실드 = 초록 · 회피 = 하늘색)이고 등급색과 겹치지 않는다. */
GT.setOf=t=>t.slice(0,t.indexOf('_'));
GT.setColor={crit:'#FF6B6B',hpsh:'#5BD07A',evade:'#5AC8F5'};
GT.lineName=Object.fromEntries(Object.keys(GT.typeName).map(t=>[t,GT.setName[GT.setOf(t)]]));
const gearName=g=>`${GT.rarName[g.rar]} ${GT.typeName[g.type]}`;

/* ================= SAVE (v2 — 장비 포맷. 영구강화 up{} 폐지) ================= */
/* ⚑⚑⚑ T153 — 장비 «등급 인덱스 판». 1 = 5등급(영웅 포함) · 2 = 4등급(영웅 폐지). 판이 뒤처진 세이브는
   아래 정규화에서 한 번 재배치된다(마이그레이션). 세이브 키 자체는 그대로 둔다 — 골드·진행도를 지킬 이유가 없다. */
const GEAR_RAR_V=2;
const SAVE_KEY='kkoma-knight-v2';
const SAVE_KEY_V1='kkoma-knight-v1';
function newSave(){
  const slots={}; for(const pt of GT.parts) slots[pt]=0;
  return {gold:0, gem:0, maxChapter:1, selChapter:1, muted:false,
    /* ⚑ T153 — 상자 3종이라 피티 카운터도 상자마다 따로다. 둘 다 **비운 채** 두고 아래 정규화가 채운다:
       기본값을 여기서 채우면 `Object.assign(save, 옛세이브)` 뒤에도 그 기본값이 남아
       «옛 세이브인지» 를 구별할 수 없어 마이그레이션이 조용히 건너뛰어진다(T153 실측으로 잡았다). */
    inv:[], eq:{}, slots, gachaBoxes:{},
    gearRarV:0, pulls:0, fuses:0, uid:1, freeDay:''};
}
let save=newSave();
try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    const s=JSON.parse(raw);
    if(s&&typeof s==='object') save=Object.assign(save,s);
  }else{
    /* v1(영구강화) 세이브 이월 — 강화 레벨은 폐지된 시스템이라 버리고 골드·진행도만 가져온다 */
    const old=localStorage.getItem(SAVE_KEY_V1);
    if(old){ const s=JSON.parse(old);
      if(s&&typeof s==='object'){ save.gold=s.gold|0; save.maxChapter=s.maxChapter|0; save.selChapter=s.selChapter|0; save.muted=!!s.muted; } }
  }
}catch(e){}
/* 정규화 — 손상·구버전 세이브를 여기서 한 번에 바로잡는다 */
/* ⚑⚑⚑ T102 — 챕터 상한 **500** (PLAN §2.4 · 주인 확정 2026-09-03. 종전 300).
   ⚠ `TUNE.maxChapter` 를 못 쓴다 — TUNE 은 이 줄보다 «아래»에서 `const` 로 선언돼 여기선 TDZ 다.
   그래서 리터럴이 하나 남고, 두 값이 어긋나면 로비 해금과 전투 곡선이 갈라진다.
   게이트 `verifyT2` ⑦ 이 이 리터럴 ↔ `TUNE.maxChapter` 를 대조한다 — 한쪽만 고치면 빨개진다. */
save.maxChapter=Math.max(1,Math.min(save.maxChapter|0||1,420));   /* 챕터 상한 420 (PLAN §2.4 · ⚑ T103 주인 정정) */
save.selChapter=Math.max(1,Math.min(save.selChapter|0||1,save.maxChapter));
save.gold=Math.max(0,+save.gold||0); save.gem=Math.max(0,+save.gem||0);
if(!Array.isArray(save.inv)) save.inv=[];
/* ⚑⚑⚑ T153 (주인 «영웅 등급은 빼기») — 5등급 시절 세이브의 등급 인덱스를 4등급으로 옮긴다.
   0 일반 → 0 · 1 희귀 → 1 · **2 영웅 → 2 전설(승격 — 낮추면 유저 손해라 주인 위임대로 올린다)** ·
   3 전설 → 2 · 4 신화 → 3. 판 표시(`save.gearRarV`)가 없는 세이브 = 5등급 시절이다. 한 번만 돈다. */
if((save.gearRarV|0) < GEAR_RAR_V){
  const REMAP=[0,1,2,2,3];
  if(Array.isArray(save.inv)) for(const g of save.inv) if(g&&typeof g.rar==='number') g.rar=REMAP[Math.max(0,Math.min(4,g.rar|0))];
  save.gearRarV=GEAR_RAR_V;
}
save.inv=save.inv.filter(g=>g&&GT.parts.includes(g.part)&&GOPT[g.type]&&g.rar>=0&&g.rar<GT.rarName.length)
  .map(g=>({u:Math.max(0,g.u|0), part:g.part, type:g.type, rar:g.rar|0, plus:Math.max(0,g.plus|0),
    ...(g.nw?{nw:1}:{})}));   /* ⚑ T125 — «NEW» 뱃지는 세이브를 넘어서도 남는다(장착하거나 열어 보면 지워진다) */
/* ⚑ T68 — uid «유일성» 보정. 종전엔 «uid 가 없는 항목»(`if(!g.u)`)만 봤다. 그래서 ① 같은 uid 가 둘인 세이브와
   ② `save.uid` 가 인벤 최대 uid 보다 뒤처진 세이브(구버전·부분 손상)가 그대로 통과했고, 그 다음 뽑기·합성이
   만든 신품이 **장착 중인 장비의 uid 를 그대로 재사용**했다. uid 는 인벤의 유일 키라(`invById`·`save.eq`·
   대장간 `FG` 가 전부 이걸로 장비를 집는다) 겹치는 순간 세부 팝업·해제·합성이 엉뚱한 장비를 집는다.
   순서: ① 중복은 나중 것을 0 으로 떨궈 새 번호를 받게 한다(먼저 나온 쪽이 `save.eq` 와의 연결을 유지).
        ② `save.uid` 를 남아 있는 최대 uid 위로 올린다. ③ 그제서야 번호 없는 항목에 배분한다.
   ②를 ③보다 먼저 해야 배분값이 다시 겹치지 않는다. */
save.uid=Math.max(1,save.uid|0);
{
  const seen=new Set();
  for(const g of save.inv){ if(!g.u) continue; if(seen.has(g.u)) g.u=0; else seen.add(g.u); }
  for(const u of seen) if(u>=save.uid) save.uid=u+1;
  for(const g of save.inv) if(!g.u) g.u=save.uid++;        /* uid 없는 항목(구버전·손상·중복 강등분) 보정 */
}
if(!save.slots||typeof save.slots!=='object') save.slots={};
for(const pt of GT.parts) save.slots[pt]=Math.max(0,Math.min(save.slots[pt]|0,GT.slotLvMax));
if(!save.eq||typeof save.eq!=='object') save.eq={};
for(const pt of GT.parts){ const u=save.eq[pt]; const g=save.inv.find(x=>x.u===u); if(!g||g.part!==pt) delete save.eq[pt]; }
/* ⚑⚑⚑ T153 — 피티 카운터가 상자별로 나뉘었다. 종전 단일 `save.gacha` 는 «그 뽑기 상자» = 신화 상자의
   진행분이므로 그대로 신화 칸으로 옮긴다(유저 진행 보존). 옮긴 뒤 옛 키는 지운다. */
if(!save.gachaBoxes||typeof save.gachaBoxes!=='object') save.gachaBoxes={};
if(!save.gachaBoxes.myth||typeof save.gachaBoxes.myth!=='object')
  save.gachaBoxes.myth=(save.gacha&&typeof save.gacha==='object')?save.gacha:newGacha();
delete save.gacha;
for(const k in GT.boxes){
  const st=save.gachaBoxes[k];
  if(!st||typeof st!=='object'){ save.gachaBoxes[k]=newGacha(); continue; }
  st.p50=Math.max(0,st.p50|0); st.p10=Math.max(0,st.p10|0); st.pulls=Math.max(0,st.pulls|0);
}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---- 인벤토리·장착 헬퍼 ---- */
const invById=u=>save.inv.find(g=>g.u===u)||null;
const equippedGear=pt=>invById(save.eq[pt]);
const isEquipped=g=>save.eq[g.part]===g.u;
/* 전투 스탯 계산용 빌드 (sim.js 의 build = {eq,slots} 와 같은 모양) */
function curBuild(){ const eq={}; for(const pt of GT.parts) eq[pt]=equippedGear(pt); return {eq,slots:save.slots}; }
function newGear(part,type,rar,plus){ return {u:save.uid++, part, type, rar, plus:plus||0}; }

/* ================= AUDIO (효과음만 — Web Audio 합성) ================= */
const AU={
  ctx:null, sfxG:null,
  init(){
    if(this.ctx) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.sfxG=this.ctx.createGain(); this.sfxG.gain.value=save.muted?0:0.5; this.sfxG.connect(this.ctx.destination);
    }catch(e){}
  },
  setMuted(m){
    save.muted=m; persist();
    if(this.ctx) this.sfxG.gain.value=m?0:0.5;
    document.querySelectorAll('#sndBtnL,#sndBtnG').forEach(b=>b.textContent=m?'🔇':'🔊');
  },
  midi(m){ return 440*Math.pow(2,(m-69)/12); },
  note(dest,m,t,dur,type,vol){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=this.midi(m);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.02);
  },
  play(name){
    if(!this.ctx||save.muted) return;
    const c=this.ctx, t=c.currentTime, S=this.sfxG;
    const blip=(f0,f1,dur,type,vol)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(S); o.start(t); o.stop(t+dur+0.02);
    };
    const nz=(dur,vol,fq)=>{
      const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=c.createBufferSource(); src.buffer=buf;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fq;
      const g=c.createGain(); g.gain.value=vol;
      src.connect(f); f.connect(g); g.connect(S); src.start(t);
    };
    switch(name){
      case 'click': blip(700,900,0.06,'square',0.12); break;
      case 'hit': nz(0.08,0.25,2400); blip(300,160,0.08,'square',0.16); break;
      case 'crit': nz(0.12,0.3,3600); blip(660,220,0.14,'sawtooth',0.2); blip(990,330,0.14,'square',0.12); break;
      case 'hurt': blip(220,90,0.16,'sawtooth',0.2); break;
      case 'arrow': nz(0.14,0.14,5000); blip(1400,400,0.12,'sine',0.08); break;
      case 'bolt': nz(0.15,0.3,4000); blip(1800,200,0.18,'sawtooth',0.18); break;
      case 'throw': nz(0.12,0.18,3000); blip(900,500,0.1,'triangle',0.08); break;
      case 'boom': nz(0.35,0.45,700); blip(160,40,0.35,'sawtooth',0.25); break;
      case 'coin': blip(1568,1568,0.06,'square',0.14); setTimeout(()=>{ if(!save.muted&&this.ctx){const tt=this.ctx.currentTime; this.note(S,93,tt,0.16,'square',0.14);} },60); break;
      case 'poof': nz(0.2,0.3,900); break;
      case 'shield': blip(2200,900,0.14,'triangle',0.2); break;
      case 'evade': blip(500,1500,0.1,'sine',0.1); break;
      case 'levelup': [72,76,79,84].forEach((m,i)=>this.note(S,m,t+i*0.09,0.22,'square',0.16)); break;
      case 'perk': [79,84,88].forEach((m,i)=>this.note(S,m,t+i*0.07,0.2,'triangle',0.18)); break;
      case 'heal': [72,76,79].forEach((m,i)=>this.note(S,m,t+i*0.1,0.3,'sine',0.15)); break;
      case 'devil': blip(140,50,0.5,'sawtooth',0.25); nz(0.4,0.15,500); break;
      case 'angel': [84,88,91,96].forEach((m,i)=>this.note(S,m,t+i*0.11,0.4,'sine',0.12)); break;
      case 'boss': blip(100,40,0.7,'sawtooth',0.3); nz(0.5,0.2,300); break;
      case 'win': [72,72,72,76,79,84].forEach((m,i)=>this.note(S,m,t+i*0.13,0.3,'square',0.16)); break;
      case 'lose': [64,62,60,55].forEach((m,i)=>this.note(S,m,t+i*0.22,0.4,'triangle',0.16)); break;
    }
  },
};
document.addEventListener('pointerdown',()=>{

function bindSnd(id){ $(id).onclick=e=>{ e.stopPropagation(); AU.setMuted(!save.muted); }; }

/* ================= 전투력 표시 (영구강화 4종은 PLAN §11.4 로 폐지 — 성장은 장비·슬롯 전담) ================= */
/* 표시 전용 지표(위임) — 밸런스에 쓰이지 않는다. 장비/슬롯을 올리면 오르는 단조 함수면 충분. */
function power(){
  const pw=buildPower(curBuild());
  /* ⚑ 주인 확정(2026-09-03) — 전투력 표시식 = 공×8 + (체+실)×1.5.
     종전 `공×8 + 체/2 + 실/4` 는 방어 축을 3~4배 저평가했다: 장비 표가 매기는 값(부위당 희귀 = 공 12.5 /
     체 58.3 / 실 91.7)으로 보면 공격력 1 = 체력 4.7 어치인데, 옛 가중치는 체력을 1/16 로 쳐서
     방어형 장비를 껴도 숫자가 거의 안 올랐다. 표시값 전용이라 전투 계산에는 한 글자도 안 들어간다. */
  return Math.round(pw.atk*8 + (pw.hp + pw.sh)*1.5);
}

/* ⚑ T64 — 상단 줄 자동 맞춤. 줄이 프레임 안에 못 들면 `--tf` 로 줄 «전체» 를 비율로 줄인다.
   말줄임(min-width:0)은 마지막 안전망인데 그게 «수치» 에 걸리면 숫자가 통째로 거짓이 되므로
   (전투력 «338» → «…» · 골드 «59.68Oc» → «59.…») 그 앞단에서 막는 것이 이 함수다.
   판정 2종: ① 수치 span 이 말줄임에 걸렸나 ② 줄이 자기 상자보다 넓나(인게임 ☰ 가 프레임 밖으로 밀린 축).
   1 부터 한 칸씩 내려가며 «안 걸리는 첫 배율» 을 쓴다 — 넉넉한 프레임에서는 첫 판에 1 로 끝난다. */
const TF_STEPS=[1,.94,.88,.82,.76,.70,.64,.58];
function fitTopRow(row,spans){
  if(!row||!row.offsetParent) return 1;                       /* 안 보이는 줄은 잴 수 없다(폭 0) */
  const el=[...spans].map(s=>typeof s==='string'?$(s):s).filter(Boolean);
  const over=()=>row.scrollWidth>row.clientWidth+1 || el.some(e=>e.scrollWidth>e.clientWidth+1);
  for(const t of TF_STEPS){ row.style.setProperty('--tf',t); if(!over()) return t; }
  return TF_STEPS[TF_STEPS.length-1];                         /* 하한까지 가도 남으면 말줄임이 받는다 */
}
const lobbyTopRow=()=>document.querySelector('.lobby-top');
const fitLobbyTop=()=>fitTopRow(lobbyTopRow(),['lbPower','lbGold','lbGem']);
/* 인게임 상단 줄(처치·골드) 갱신 한 곳. 처치 1건마다 불리므로 «글자 수가 바뀐 순간만» 다시 맞춘다 —
   fitTopRow 은 강제 레이아웃을 일으켜서, 매 처치마다 돌리면 후반 웨이브에서 프레임을 갉아먹는다. */
let gameTopKey='';
function syncGameTop(kills,gold){
  const ks=String(kills!==undefined?kills:(G?G.kills:0));
  const gs=fmt(gold!==undefined?gold:(G?G.gold:0));
  $('gKills').textContent=ks; $('gGold').textContent=gs;
  const key=ks.length+'/'+gs.length;
  if(key!==gameTopKey){
    gameTopKey=key;
    /* 같은 «자릿수» 라도 글자 폭은 다르다(실측 14px: «888.88» 42.83px vs «111.11» 39.7px). 자릿수로만 다시 맞추면
       그 3px 차이에서 다음 처치가 잘린다 — 그래서 잴 때만 숫자를 전부 8 로 바꿔 «그 자릿수의 최대 폭» 으로 맞춘다. */
    const k8=ks.replace(/\d/g,'8'), g8=gs.replace(/\d/g,'8');
    $('gKills').textContent=k8; $('gGold').textContent=g8;
    fitTopRow($('topbar'),['gKills','gGold']);
    $('gKills').textContent=ks; $('gGold').textContent=gs;
  }
}

/* ---- T36: 챕터 500 대응 이동 UI (⚑ T102 로 상한 300 → 500) (게임 로직·밸런스 무관, 순수 UI) ----
   ① ◀▶ 를 누르고 있으면 연속 이동(가속) ② 제목 탭 → 챕터 이동 팝업(숫자 입력·±10·최신 해금) */
function chapStep(d){
  const v=clamp(save.selChapter+d,1,save.maxChapter);
  if(v===save.selChapter) return false;
  save.selChapter=v; renderLobby(); persist(); return true;
}
function holdRepeat(btn,d){
  let tmr=null, iv=300, moved=0;
  const stop=()=>{ if(tmr){ clearTimeout(tmr); tmr=null; } iv=300; moved=0; };
  const tick=()=>{
    if(!chapStep(d)){ stop(); return; }
    if(moved++%3===0) AU.play('click');
    iv=Math.max(45,iv*0.72);
    tmr=setTimeout(tick,iv);
  };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); AU.play('click'); chapStep(d); tmr=setTimeout(tick,420); });
  for(const ev of ['pointerup','pointercancel','pointerleave']) btn.addEventListener(ev,stop);
}
holdRepeat($('chPrev'),-1); holdRepeat($('chNext'),1);
function openChapterJump(){
  AU.play('click');
  openOverlay(`<div class="ov-banner">챕터 이동</div>
    <div class="ov-sub">해금: 1 ~ ${save.maxChapter}</div>
    <input id="jumpVal" type="number" inputmode="numeric" min="1" max="${save.maxChapter}" value="${save.selChapter}">
    <div class="jump-row">
      <button id="jm10" ${save.selChapter<=1?'disabled':''}>−10</button>
      <button id="jp10" ${save.selChapter>=save.maxChapter?'disabled':''}>+10</button>
      <button id="jLast" ${save.selChapter>=save.maxChapter?'disabled':''}>최신 ${save.maxChapter}</button>
    </div>
    <div class="jump-row">
      <button id="jOk" class="gold">이동</button>
      <button id="jNo">취소</button>
    </div>`);
  const inp=$('jumpVal');
  const bump=d=>{ inp.value=clamp((+inp.value||1)+d,1,save.maxChapter); };
  $('jm10').onclick=()=>{ AU.play('click'); bump(-10); };
  $('jp10').onclick=()=>{ AU.play('click'); bump(10); };

}

const GEAR_COL={left:['weapon','neck','armor'], right:['helm','glove','boot']};

function slotCardHTML(pt){

     mn=150 이면 (floor(150/5)+1)*5 = 155 라 도달 불가능한 «Lv.155 이면 +155%» 가 떴다.
     같은 화면의 슬롯 팝업(slotUpgradeHTML)은 상한에서 «상한 Lv.150» 으로 끊는데 이 줄만 안 끊었다. */

function invCellHTML(g,o){
