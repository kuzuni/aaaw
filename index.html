/* ================= FX ================= */
function addText(txt,color,wx,wy,big){
  if(!G) return;
  G.texts.push({txt,color,x:wx??G.player.worldX,y:wy??-70,t:0,big:big||false});
}
function sparks(wx,wy,color,n,spd){
  if(!G) return;
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), v=rand(40,spd||160);
    G.parts.push({x:wx,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rand(0.25,0.5),t:0,color,size:rand(2,4.5)});
  }
}
function poof(wx,wy){
  if(!G) return;
  for(let i=0;i<7;i++){
    const a=rand(0,Math.PI*2), v=rand(15,55);
    G.parts.push({x:wx,y:wy-20,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,life:rand(0.4,0.7),t:0,color:'rgba(230,230,235,',size:rand(6,11),puff:true});
  }
}
function shake(m){ if(G) G.shake=Math.max(G.shake,m); }
/* ⚑ T48 3단계 — 사신의 낫 전용 연출 (주인 16:5X 필수 지시).
   «낫이 베어 죽이는» 것이 보여야 하고 일반 처치 연기(poof)와 구별돼야 한다:
   ① 큰 낫이 호를 그리며 한 번 훑고(reaps 가 그린다) ② 베인 자리에 붉은 참격선 ③ 검은 재가 흩어진다.
   poof 는 부르지 않는다 — 여기서 죽은 적은 «연기» 가 아니라 «재» 로 사라진다. */
function reapFx(wx){
  if(!G) return;
  G.reaps.push({x:wx,t:0});
  AU.play('crit'); shake(7);
  addText('☠️ 사신의 낫','#C8A2FF',wx,-124,true);
  for(let i=0;i<12;i++){
    const a=rand(0,Math.PI*2), v=rand(30,120);
    G.parts.push({x:wx,y:-40,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rand(0.4,0.8),t:0,color:'rgba(40,36,50,',size:rand(4,9),puff:true});
  }
  sparks(wx,-46,'#B388FF',8,180);
}
/* 방어막이 «막을 때» 의 전용 이펙트 (주인 17:2X) — 육각 방벽이 번쩍하고 튕겨낸다. */
function wardFx(){
  if(!G) return;
  const p=G.player;
  AU.play('shield');
  addText('🛡️ 방어!','#9CD2FF',p.worldX,-108,true);
  sparks(p.worldX,-46,'#9CD2FF',10,190);
}

/* ================= COMBAT ================= */
function aliveEnemies(){
  const out=[];
  for(const n of G.nodes) for(const e of n.enemies) if(e.hp>0) out.push(e);
  return out;
}
/* 지금 «필드 위에» 있는 적이 속한 노드 = 플레이어가 상대하고 있는 최전방 노드. sim.js frontNode() 와 1:1.
   주인 확정 보강(15:2X): 관통형(창·검기)은 이 노드의 적만 맞는다 — 다음 웨이브 대기분은 절대 맞지 않는다.
   챕터의 적을 시작할 때 한꺼번에 만들어 두므로(노드 간격 560px, 창 사거리 88×8=704px) 필터가 없으면 꿰뚫린다. */
function frontNode(){ let b=null; for(const n of G.nodes) for(const e of n.enemies) if(e.hp>0&&(!b||e.worldX<b.worldX)) b=e; return b?b.wave:null; }
function randTarget(){
  const p=G.player;
  const pool=aliveEnemies().filter(e=>{const d=e.worldX-p.worldX; return d>-30&&d<540;});
  return pool.length?pick(pool):null;
}
/* ⚑ 주인 확정(2026-09-02 15:3X) — 소환 적중도 «공격» 이다: 소환(창/도끼/화살/번개/검기)이 적을 맞히면
   «공격 시 n%» 트리거를 굴린다(창이 창을 부르는 연쇄 허용). «치명타 시» 트리거는 `dealPlayerDamage` 안에 있어
   기본공격 전용이 아니었으므로 소환 적중에도 이미 걸린다 — 새로 붙는 것은 «공격 시» 쪽이다.
   **기본공격 전용으로 남는 것은 `nextCrit`/`nextAtk` 소모 · 분신 · 추가타 셋뿐**(PLAN §4, 주인 위임).
   소환 적중은 항상 아이콘 인자를 넘기므로 `nextCrit` 을 소모하지 않는다(sim.js 의 `fromBasic=false` 와 같다).
   성능 가드(주인 명시 허용) — `PROJ_CAP` 동시 활성 투사체 상한(초과분은 즉발 판정으로 대체) ·
   `PROC_TICK_CAP` 한 프레임에 굴리는 소환 적중 트리거 수 상한. 확률·연쇄 자체는 제한하지 않는다.
   sim.js:667~679 와 1:1 (게이트가 두 파일을 대조한다). */
const PROJ_CAP=200, PROC_TICK_CAP=200;
function summonHit(e,ratio,icon){
  dealPlayerDamage(e,ratio,icon);
  if(G.procN<PROC_TICK_CAP){ G.procN++; procOnAttack(); }
}
function pushProj(pr){
  if(G.pprojs.length<PROJ_CAP){ G.pprojs.push(pr); return; }
  if(pr.hit){                                   /* 관통형(창·검기): 사거리 안 적을 앞에서부터 pierce 마리 */
    const list=aliveEnemies().filter(e=>(!pr.node||e.wave===pr.node)&&e.worldX>=pr.x-16&&e.worldX<=pr.maxX)
                              .sort((a,b)=>a.worldX-b.worldX);   /* pr.node = 미스폰·대기 웨이브 피격 금지 (주인 15:2X · T44) */
    for(const e of list.slice(0,pr.pierce)) summonHit(e,pr.ratio,pr.type==='spear'?'🔱':'🌊');
  }else if(pr.tgt&&pr.tgt.hp>0) summonHit(pr.tgt,pr.ratio,pr.type==='axe'?'🪓':'🏹');
}
function castBolt(t){
  G.bolts.push({x:t.worldX,t:0,seed:Math.random()*10});
  AU.play('bolt');
  summonHit(t,0.75,'⚡');
}
/* ---------- 소환 5종 (sim.js fireAxe/fireArrows/fireBolts/fireWave/fireSpear 와 1:1) ----------
   주인 지시(2026-09-02 08:3X): 다연발은 동시 스폰 금지 — 50~70ms 간격 순차 연사, 발마다 판정·사운드. */
function volley(n,shot){
  shot(0);
  /* ⚑ T3-1 수리 — 간격을 «누적» 으로 쌓는다.
     종전 `k*(50+Math.random()*20)` 는 k 마다 난수를 새로 뽑아 «k번째 발의 절대 시각» 을 정했다.
     그래서 이웃한 두 발의 간격이 난수 차이만큼 벌어지거나 겹쳤다 — 24발 실측 0.6~171ms(평균 62),
     심하면 뒤 발이 앞 발보다 먼저 나간다. 주인 지시(08:3X)는 «발마다 50~70ms 간격의 순차 연사,
     낱발이 구별돼 보일 것» 이므로 간격 자체를 50~70ms 로 못박는다. 총 길이는 종전과 같다(평균 60ms×n). */
  let d=0;
  for(let k=1;k<n;k++){ d+=50+Math.random()*20; setTimeout(()=>{ if(G&&!G.over) shot(k); }, d); }
}
function fireAxe(p){
  const n=p.px.axeCount?14:1;
  volley(n,()=>{ const t=randTarget(); if(!t)return; AU.play('throw');
    pushProj({type:'axe',x:p.worldX+14,tgt:t,ratio:0.50,spd:430,spin:0}); });
}
function fireArrows(p){
  const n=p.px.arrowCount?24:2;
  volley(n,()=>{ const t=randTarget(); if(!t)return; AU.play('arrow');
    pushProj({type:'parrow',x:p.worldX+14,tgt:t,ratio:0.65,spd:560}); });
}
function fireBolts(p){
  const n=p.px.boltCount?20:2;
  volley(n,()=>{ const t=randTarget(); if(t) castBolt(t); });
}
function fireWave(p){
  AU.play('throw');
  pushProj({type:'wave',x:p.worldX+14,ratio:0.70,spd:470,maxX:p.worldX+(p.px.waveKing?1400:340),hit:new Set(),pierce:p.px.waveKing?20:2,node:frontNode()});
}
function fireSpear(p){
  AU.play('throw');
  /* 창 관통 상한 8마리 — PLAN §3.3 l_spear «일직선 8명 거리(88px×8) 관통» (T34). sim.js:663 과 동일 */
  pushProj({type:'spear',x:p.worldX+14,ratio:p.px.spearMaster?13.5:1.0,spd:520,maxX:p.worldX+88*8,hit:new Set(),pierce:8,node:frontNode()});
}
function gainExp(n){
  const p=G.player;
  p.exp+=n;
  let lev=0;
  while(p.exp>=expNeed(p.level)){ p.exp-=expNeed(p.level); p.level++; lev++; }
  /* 주인 지시(2026-09-02 06:3X): 챕터를 끝내는 보스 처치로 레벨업해도 특전 선택지·레벨업 팝업 없이 클리어로 */
  if(lev>0 && !G.over && !G.cleared){
    G.pendingLevels+=lev-1;
    openPerkChoice();
  }
}
function onKill(e){
  if(e.dead) return; e.dead=true;
  const p=G.player, px=p.px;
  G.kills++; G.killed++;
  const drop=Math.round(TUNE.goldKill(G.chapter)*p.goldMul);
  G.gold+=drop;
  $('gKills').textContent=G.kills;
  $('gGold').textContent=fmt(G.gold);
  AU.play('poof'); AU.play('coin');
  poof(e.worldX,0);
  addText('+'+drop+' 🪙','#FFD54F',e.worldX,-100);
  if(p.killHeal>0) heal(p,p.maxHp*p.killHeal);
  if(px.killShield3) p.sh=Math.min(p.maxSh,p.sh+p.maxSh*0.007*px.killShield3);
  if(px.killShield10) p.sh=Math.min(p.maxSh,p.sh+p.maxSh*0.0075*px.killShield10);
  if(px.aspdKill) addBuff(p,'aspd',0.20*px.aspdKill,4,3,'aspdKill');
  if(px.killCritBuff&&pkk(p,0.30*px.killCritBuff)) addBuff(p,'critR',14,4,3,'killCritBuff');
  if(px.killDefBuff) addBuff(p,'def',10*px.killDefBuff,3,3,'killDefBuff');
  if(px.killAspd){ p.aspd*=1.01; renderStatsGrid(); }
  /* 신화 m_stunKill «충격파» — 처치 시 사거리 안의 남은 적 전부 스턴 (sim.js onKill 과 같은 필터) */
  if(px.stunKill) for(const e2 of aliveEnemies()){ const dx=e2.worldX-p.worldX; if(dx>-30&&dx<540) applyStun(e2,1.2); }
  if(e.wave.enemies.every(x=>x.hp<=0)){
    e.wave.done=true;
    /* 웨이브 전멸 실드 무료충전 폐지 (주인 지시 2026-09-02 06:5X·08:5X) — 실드 충전은 특전으로만 */
  }
  /* 클리어 확정을 먼저 — 보스 경험치로 레벨업해도 특전 3택 없음 (PLAN §2.4 주인 지시) */
  if(e.isBoss){
    G.cleared=true; shake(10);
    gainExp(e.exp+(px.sage?1:0));
    setTimeout(()=>{ if(G) openClear(); },700);
  }else gainExp(e.exp+(px.sage?1:0));
}
/* ⚑ T48 1단계 — 스턴 메커니즘 (주인 15:5X · PLAN §3.0). sim.js applyStun 과 같은 규칙:
   더 긴 쪽만 남기고(합산 금지) 보스는 STUN_BOSS_MUL 배. 게임 쪽은 여기에 «기절» 연출이 붙는다. */
function applyStun(e,sec){
  if(!e||e.hp<=0) return;
  const p=G.player;
  let s=sec*(p.px.stunLord?STUN_LORD_MUL:1);
  if(e.isBoss) s*=STUN_BOSS_MUL;
  const wasStunned = (e.stun||0)>0;
  e.stun=Math.max(e.stun||0,s);
  if(!wasStunned){
    AU.play('shield');
    addText('💫 기절!','#FFD54F',e.worldX,-104,true);
    sparks(e.worldX,-60,'#FFE9A0',7,150);
  }
}
/* ⚑ T48 1단계 — 빗맞음(onMiss) 트리거. sim.js procOnMiss 와 1:1. 호출 지점은 빗맞음이 실제로
   일어나는 두 곳(dealPlayerDamage · doCounter)뿐 — «MISS» 팝이 뜨는 자리와 같다. */
function procOnMiss(e){
  const p=G.player, px=p.px;
  if(px.missAtk) addBuff(p,'atk',0.06*px.missAtk,3,5,'missAtk');
  if(px.missDef) addBuff(p,'def',6*px.missDef,3,3,'missDef');
  if(px.missAspd) addBuff(p,'aspd',0.12*px.missAspd,2,3,'missAspd');
  if(px.missReset&&pkk(p,0.30*px.missReset)) p.atkTimer=0;
  if(px.missCrit){ p.nextCrit=true; addText('🎯 확정 치명타!','#FFB92E'); }
  if(px.missStack){ p.missStk=Math.min(MISS_STACK_CAP,p.missStk+1); addText('💢 x'+p.missStk,'#FF8A80'); }
  if(px.missRush){ p.atkTimer=0; p.nextAtk=Math.min(1.5,Math.max(p.nextAtk,1.0)); addText('💨 즉시 재공격!','#9CD2FF'); }
  if(px.missSpear&&pkk(p,0.30*px.missSpear)) fireSpear(p);
}
/* ⚑ T48 3단계 — 횟수형 방어막 (주인 17:2X). sim.js wardCap/gainWard 와 1:1.
   막을 때의 전용 이펙트와 남은 장수 뱃지는 아래 hitPlayer·renderBuffBar 가 맡는다. */
function wardCap(p){ return p.px.wardKing?WARD_CAP_KING:WARD_CAP; }
function gainWard(p,ch){
  if(!ch) return;
  if(!pkk(p,ch*(p.px.wardKing?2:1))) return;
  if(p.ward>=wardCap(p)) return;
  p.ward=Math.min(wardCap(p),p.ward+1);
  addText('🛡️✨ x'+p.ward,'#9CD2FF');
  renderBuffBar();
}
/* ⚑ T48 2단계 — 원거리 피격 트리거 (주인 16:1X). sim.js procOnRanged 와 1:1.
   일반 «피격 시» 트리거와 별개 축이라 원거리 피격은 둘 다 굴린다. 회피에 성공하면 굴리지 않는다. */
function procOnRanged(src){
  const p=G.player, px=p.px;
  if(px.rangeShield&&pkk(p,0.20*px.rangeShield)){ p.sh=Math.min(p.maxSh,p.sh+p.maxSh*0.04); addText('🏹🔋','#6CC0F0'); }
  if(px.rangeThorns&&src&&src.hp>0&&pkk(p,0.30*px.rangeThorns)){
    const rd=effDmg(p)*0.8; src.hp-=rd; src.hitT=0.15;
    addText('🏹🌵 '+fmt(rd),'#9CE87E',src.worldX,-92);
    if(src.hp<=0) onKill(src);
  }
  if(px.rangeBolt&&pkk(p,0.30*px.rangeBolt)){ const t=randTarget(); if(t) castBolt(t); }
  if(px.rangeSpear&&pkk(p,0.30*px.rangeSpear)) fireSpear(p);
}
function dealPlayerDamage(e,ratio,icon){
  if(e.hp<=0) return false;
  const p=G.player, px=p.px;
  let cr=effCritR(p);
  const full=e.hp>=e.maxHp-0.5;
  if(px.fullHpCrit&&full) cr=Math.max(cr,62);
  if(icon===undefined&&p.nextCrit) cr=100;
  const crit=Math.random()*100<cr;
  if(icon===undefined&&p.nextCrit) p.nextCrit=false;
  /* ⚑ 적 회피 10% (PLAN §2.3 주인 확정) — sim.js dealDmg 와 같은 자리(치명타 굴림 뒤).
     빗맞아도 nextCrit·nextAtk 는 소모된다(위임 기본값). «MISS» 팝 표시. */
  if(Math.random()<ENEMY_EVADE){
    G.miss++;
    AU.play('evade');
    addText('MISS','#9FB0C0',e.worldX,-84);
    procOnMiss(e);
    return false;
  }
  let d=effDmg(p)*ratio*(crit?effCritF(p)/100:1)*rand(0.92,1.08);
  /* 가산 보너스 풀 — sim.js dealDmg 와 같은 식 (주인 정정 16:3X: 배수 아님, 가산 +100%).
     빗맞음 스택은 적중 1타당 1개 소모하고, 몇 장이 쌓여 있든 한 타에는 +100% 한 번만. */
  let addBonus=0;
  if(full&&px.firstHit) addBonus+=0.20*px.firstHit;
  if(px.missStack&&p.missStk>0){ p.missStk--; addBonus+=1.00; }
  if(addBonus) d*=1+addBonus;
  if(px.stunLord&&e.stun>0) d*=STUN_LORD_DMG;
  if(px.execute&&e.hp<=e.maxHp*0.5) d*=2.2;
  if(px.backDmg){
    let front=null;
    for(const en of aliveEnemies()) if(!front||en.worldX<front.worldX) front=en;
    if(front&&e!==front) d*=3.2;
  }
  e.hp-=d; e.hitT=0.15;
  AU.play(crit?'crit':'hit');
  sparks(e.worldX-10,-40,crit?'#FFB92E':'#FFF3CF',crit?9:5,crit?190:130);
  if(crit) shake(3);
  addText((icon||'')+(crit?'💥':'')+fmt(d), crit?'#FFB92E':(icon?'#BFE3FF':'#FFFFFF'), e.worldX,-84,crit);
  if(p.steal>0) heal(p,d*p.steal/100);
  if(crit){
    if(px.critChain) addBuff(p,'critR',5*px.critChain,3,5,'critChain');
    if(px.critFsmall) addBuff(p,'critF',10*px.critFsmall,3,3,'critFsmall');
    if(px.critFBuff) addBuff(p,'critF',34*px.critFBuff,4,3,'critFBuff');
    if(px.critAtkBuff) addBuff(p,'atk',0.15*px.critAtkBuff,4,3,'critAtkBuff');
    if(px.critAspdBuff) addBuff(p,'aspd',0.25*px.critAspdBuff,3,3,'critAspdBuff');
    if(px.critHealS&&pkk(p,0.20*px.critHealS)){ heal(p,p.maxHp*0.01); addText('❣️','#7ED957'); }
    if(px.critHeal3&&pkk(p,0.30*px.critHeal3)){ heal(p,p.maxHp*0.04); addText('❣️','#7ED957'); }
    if(px.critReset&&pkk(p,0.45*px.critReset)) p.atkTimer=0;
    if(px.stunCritM&&pkk(p,0.15*px.stunCritM)) applyStun(e,2.0);
    if(px.stunCritL&&pkk(p,0.35*px.stunCritL)) applyStun(e,3.0);   /* 주인 필수 예시 «치명타 시 3초 스턴» */
    gainWard(p,0.12*px.wardCrit);
  }
  if(px.execKill&&!e.isBoss&&e.hp>0&&e.hp<=e.maxHp*0.25){
    e.hp=0;
    addText('🧨 처형!','#FF6B6B',e.worldX,-104,true);
  }
  if(e.hp<=0) onKill(e);
  return crit;
}
function procOnAttack(){
  const p=G.player, px=p.px;
  if(px.atkPerm&&pkk(p,0.10*px.atkPerm)){ p.dmg*=1.01; addText('🌱 공격력 UP','#7ED957',p.worldX,-104); renderStatsGrid(); }
  if(px.c_atkBuff&&pkk(p,0.30*px.c_atkBuff)) addBuff(p,'atk',0.05,3,5,'c_atkBuff');
  if(px.c_aspdBuff&&pkk(p,0.30*px.c_aspdBuff)) addBuff(p,'aspd',0.05,3,5,'c_aspdBuff');
  if(px.aspdStack10&&pkk(p,0.25*px.aspdStack10)) addBuff(p,'aspd',0.05,4,10,'aspdStack10');   /* 주인 예시 — 고중첩 상위 변형 */
  if(px.atkBuffM&&pkk(p,0.30*px.atkBuffM)) addBuff(p,'atk',0.14,4,5,'atkBuffM');
  if(px.atkBuffL&&pkk(p,0.25*px.atkBuffL)) addBuff(p,'atk',0.35,5,3,'atkBuffL');
  if(px.axe&&pkk(p,0.15*px.axe)) fireAxe(p);
  if(px.arrow2&&pkk(p,0.15*px.arrow2)) fireArrows(p);
  if(px.wave&&pkk(p,0.20*px.wave)) fireWave(p);
  if(px.spear&&pkk(p,0.075*px.spear)) fireSpear(p);
  if(px.bolt&&pkk(p,0.10*px.bolt)) fireBolts(p);
  if(px.arsenal&&pkk(p,0.16*px.arsenal)) pick([fireAxe,fireArrows,fireBolts,fireWave,fireSpear])(p);
  gainWard(p,0.10*px.wardAtk);   /* 주인 필수 예시 — «공격 시 10% 확률로 방어막 1장» */
}
function doCounter(src,depth){
  const p=G.player, px=p.px;
  if(!src||src.hp<=0) return;
  /* 반격도 «플레이어의 타격» 이라 적 회피 10% 를 탄다 (PLAN §2.3). 빗맞으면 counterChain 도 끊긴다. */
  if(Math.random()<ENEMY_EVADE){
    G.miss++;
    AU.play('evade');
    addText('MISS','#9FB0C0',src.worldX,-80);
    procOnMiss(src);
    return;
  }
  const cd=effDmg(p)*0.7*(1+px.counterX);
  src.hp-=cd; src.hitT=0.15;
  addText('반격 '+fmt(cd),'#FFD54F',src.worldX,-80);
  sparks(src.worldX,-40,'#FFD54F',5,130);
  if(px.counterAtkS) addBuff(p,'atk',0.05*px.counterAtkS,3,3,'counterAtkS');
  if(px.counterDefS) addBuff(p,'def',8*px.counterDefS,3,3,'counterDefS');
  if(px.counterAtkM) addBuff(p,'atk',0.14*px.counterAtkM,4,3,'counterAtkM');
  if(px.counterCrit) addBuff(p,'critR',14,3,3,'counterCrit');
  if(px.counterHeal) heal(p,p.maxHp*0.04*px.counterHeal);
  if(px.counterWave&&pkk(p,1.0*px.counterWave)) fireWave(p);
  if(src.hp<=0) onKill(src);
  else if(px.counterChain&&!depth) doCounter(src,1);
}
function playerStrike(e){
  const p=G.player, px=p.px;
  p.strikeT=0.16;
  let ratio=1;
  if(p.nextAtk>0){ ratio*=1+p.nextAtk; p.nextAtk=0; }
  const crit=dealPlayerDamage(e,ratio);
  if(px.clone&&e.hp>0) dealPlayerDamage(e,0.37,'👻');
  if(crit&&px.extraHit&&pkk(p,0.75*px.extraHit)&&e.hp>0) dealPlayerDamage(e,2.3,'🗡️');
  procOnAttack();
}
function hitPlayer(dmg,isMelee,src){
  const p=G.player, px=p.px;
  if(Math.random()*100<effEvade(p)){
    AU.play('evade'); addText('회피!','#CFCFD8');
    if(px.evadeEvBuff) addBuff(p,'evade',8*px.evadeEvBuff,3,3,'evadeEvBuff');
    if(px.evadeAspd) addBuff(p,'aspd',0.05,2,3,'evadeAspd');
    if(px.evadeDef) addBuff(p,'def',5*px.evadeDef,3,3,'evadeDef');
    if(px.evadeAtkBuff) addBuff(p,'atk',0.28*px.evadeAtkBuff,5,3,'evadeAtkBuff');
    if(px.evadeRush&&p.nextAtk<1.5){ p.nextAtk=Math.min(1.5,p.nextAtk+0.5*px.evadeRush); addText('🌀 공격 강화!','#9CD2FF'); }
    if(px.evadeCrit) p.nextCrit=true;
    if(px.evadeHeal&&pkk(p,0.15*px.evadeHeal)){ heal(p,p.maxHp*0.07); addText('🍀 +'+fmt(p.maxHp*0.07),'#7ED957'); }
    if(px.evadeShield&&pkk(p,0.15*px.evadeShield)){ p.sh=Math.min(p.maxSh,p.sh+p.maxSh*0.14); addText('🔶 실드 수리','#6CC0F0'); }
    if(px.evadeCounter&&pkk(p,1.0*px.evadeCounter)) doCounter(src);
    if(px.evadeAxe&&pkk(p,0.10*px.evadeAxe)) fireAxe(p);
    gainWard(p,0.10*px.wardEvade);
    /* 신화 m_reaper «사신의 낫» — 회피 시 확률로 공격한 그 적 즉사 (보스 제외, 주인 16:5X).
       주인 지시대로 일반 처치 연기와 구별되는 전용 연출(낫이 베어 죽인다)을 붙인다. */
    if(px.reaper&&src&&src.hp>0&&!src.isBoss&&pkk(p,REAPER_CH)){
      reapFx(src.worldX);
      src.hp=0; onKill(src);
    }
    return;
  }
  /* 횟수형 방어막 — 이 타격 «1회» 를 통째로 무효화하고 1장 소모한다 (수치형 실드보다 먼저).
     데미지만 완전 무효이고 «맞은 사건» 은 일어난 것이라 아래 피격 트리거들은 그대로 굴린다.
     sim.js hitPlayer 와 같은 순서·같은 조건. */
  const warded=p.ward>0;
  if(warded){
    p.ward--;
    wardFx();
    if(px.wardBurst&&src&&src.hp>0){
      const bd=effDmg(p)*3; src.hp-=bd; src.hitT=0.15;
      addText('🛡️💥 '+fmt(bd),'#9CD2FF',src.worldX,-100,true);
      if(src.hp<=0) onKill(src);
    }
    renderBuffBar();
  }
  let d=warded?0:dmg*(1-effDef(p)/100);
  if(!warded&&px.guardCrystal&&p.sh>0) d*=0.62;
  p.hitT=0.15;
  if(!warded&&p.sh>0){
    const ab=Math.min(p.sh,d); p.sh-=ab; d-=ab;
    sparks(p.worldX,-40,'#6CC0F0',5,120);
    if(d<=0) AU.play('shield');
  }
  if(d>0){
    p.hp-=d;
    AU.play('hurt');
    sparks(p.worldX,-40,'#FF8A80',6,140);
    addText('-'+fmt(d),'#FF8A80');
    if(p.hp<=0){
      if(px.revive>0){
        px.revive--;
        p.hp=p.maxHp*0.07; p.sh=p.maxSh*0.07;
        AU.play('angel'); shake(8);
        addText('♻️ 부활!','#FFD54F',p.worldX,-120,true);
        sparks(p.worldX,-50,'#FFD54F',14,220);
      }else{
        p.hp=0; updateBars(); openDead(); return;
      }
    }
  }
  if(px.defHitBuff) addBuff(p,'def',3*px.defHitBuff,3,5,'defHitBuff');
  if(px.defBuff2&&pkk(p,0.30*px.defBuff2)) addBuff(p,'def',14,4,3,'defBuff2');
  if(px.defBuffL&&pkk(p,0.20*px.defBuffL)) addBuff(p,'def',15,4,2,'defBuffL');
  if(px.wallBuff) addBuff(p,'def',10,4,2,'wallBuff');
  if(px.hitEvadeBuff&&pkk(p,0.22*px.hitEvadeBuff)) addBuff(p,'evade',14,3,2,'hitEvadeBuff');
  if(px.evadeHitBuff&&pkk(p,0.30*px.evadeHitBuff)) addBuff(p,'evade',15,3,2,'evadeHitBuff');
  if(px.shieldOnHit&&pkk(p,0.10*px.shieldOnHit)){ p.sh=Math.min(p.maxSh,p.sh+p.maxSh*0.05); addText('🔋','#6CC0F0'); }
  if(px.hitHeal&&pkk(p,0.15*px.hitHeal)){ heal(p,p.maxHp*0.02); addText('🩹','#7ED957'); }
  /* 피격 시 스턴 — 주인 필수 예시 «피격 시 (n% 확률로) 공격한 적 3초 스턴» (전설 l_stunHit3) */
  gainWard(p,0.08*px.wardHit);
  if(px.stunHitS&&src&&pkk(p,0.12*px.stunHitS)) applyStun(src,1.5);
  if(px.stunHitL&&src&&pkk(p,0.55*px.stunHitL)) applyStun(src,3.0);
  if(px.thornsS&&src&&src.hp>0&&pkk(p,0.30*px.thornsS)){
    src.hp-=dmg*0.5; src.hitT=0.15;
    addText('🌿 '+fmt(dmg*0.5),'#A5D6A7',src.worldX,-92);
    if(src.hp<=0) onKill(src);
  }
  if(px.thorns&&src&&src.hp>0&&pkk(p,0.60*px.thorns)){
    src.hp-=dmg*1.5; src.hitT=0.15;
    addText('🌵 '+fmt(dmg*1.5),'#A5D6A7',src.worldX,-92);
    if(src.hp<=0) onKill(src);
  }
  if(px.thornsKing&&src&&src.hp>0){
    src.hp-=dmg*3; src.hitT=0.15;
    addText('🌵👑 '+fmt(dmg*3),'#7ED957',src.worldX,-104,true);
    sparks(src.worldX,-50,'#7ED957',9,170);
    if(src.hp<=0) onKill(src);
  }
  /* 원거리 피격 축 — 위 «피격 시» 트리거를 전부 굴린 «뒤» 에 추가로 굴린다 (별개 축, 주인 16:1X) */
  if(!isMelee) procOnRanged(src);
  if(isMelee&&src&&src.hp>0){
    const cc=Math.random()*100<p.counter;
    const pc=(px.hitCounter&&pkk(p,0.30*px.hitCounter))||(px.hitCounterS&&pkk(p,0.10*px.hitCounterS));
    if(cc||pc) doCounter(src);
  }
}

function update(dt){
  const p=G.player;
  G.t+=dt;
  G.procN=0;   /* 성능 가드: 소환 적중 트리거 예산은 프레임마다 리셋 (PROC_TICK_CAP) */
  G.shake=Math.max(0,G.shake-dt*40);
  p.strikeT=Math.max(0,p.strikeT-dt); p.hitT=Math.max(0,p.hitT-dt);
  if(G.overBoltCd>0) G.overBoltCd-=dt;

  /* 버프 타이머 */
  let bc=false;
  for(const k in p.buffs){
    const arr=p.buffs[k];
    for(let i=arr.length-1;i>=0;i--){ arr[i].t-=dt; if(arr[i].t<=0){ arr.splice(i,1); bc=true; } }
  }
  if(bc){ renderStatsGrid(); renderBuffBar(); }   /* 버프가 끝나면 아이콘 제거 (주인 지시 07:0X) */

  /* 파티클/텍스트 */
  for(let i=G.parts.length-1;i>=0;i--){
    const pt=G.parts[i]; pt.t+=dt;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=(pt.puff?-30:340)*dt;
    if(pt.t>pt.life) G.parts.splice(i,1);
  }
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i]; t.t+=dt;
    if(t.t>1.05) G.texts.splice(i,1);
  }
  for(let i=G.bolts.length-1;i>=0;i--){ G.bolts[i].t+=dt; if(G.bolts[i].t>0.3) G.bolts.splice(i,1); }
  for(let i=G.reaps.length-1;i>=0;i--){ G.reaps[i].t+=dt; if(G.reaps[i].t>0.45) G.reaps.splice(i,1); }

  const alive=aliveEnemies();
  if(!alive.length) return;

  /* 이벤트 노드 */
  for(const n of G.nodes){
    if(!n.done && (n.type==='rest'||n.type==='devil'||n.type==='angel') && p.worldX>n.x-95){
      n.done=true;
      if(n.type==='rest') openRest();
      else if(n.type==='devil') openDevil();
      else openAngel();
      return;
    }
  }

  /* 플레이어 */
  alive.sort((a,b)=>a.worldX-b.worldX);
  const tgt=alive[0];
  if(tgt.isBoss && !G.bossWarned && tgt.worldX-p.worldX<420){
    G.bossWarned=true; AU.play('boss'); shake(8);
    addText('⚠️ BOSS ⚠️','#FF5252',tgt.worldX,-150,true);
  }
  const dist=tgt.worldX-p.worldX;
  if(dist>74){
    p.worldX+=132*p.walkMul*dt; p.walking=true;
    p.atkTimer=Math.min(p.atkTimer,0.35);
  }else{
    p.walking=false;
    p.atkTimer-=dt*effAspd(p);
    if(p.atkTimer<=0){ p.atkTimer+=1; playerStrike(tgt); }
  }

  /* 뇌신 */
  if(p.px.autoBolt){
    G.autoBoltT-=dt;
    if(G.autoBoltT<=0){
      G.autoBoltT=2.4;   /* sim.js:805 와 동일 */
      volley(p.px.autoBolt,()=>{ const t2=randTarget(); if(t2) castBolt(t2); });
    }
  }
  /* 신화 m_stunAura «위압» — 2.5초마다 랜덤 적 1명 스턴 (sim.js 와 같은 주기·지속) */
  if(p.px.stunAura){
    G.stunAuraT-=dt;
    if(G.stunAuraT<=0){
      G.stunAuraT=2.5;
      for(let k=0;k<p.px.stunAura;k++){ const t3=randTarget(); if(t3) applyStun(t3,2.5); }
    }
  }

  /* 적 (제자리 고정) */
  for(const e of alive){
    if(e.hp<=0) continue;
    e.hitT=Math.max(0,e.hitT-dt); e.strikeT=Math.max(0,e.strikeT-dt);
    /* ⚑ 스턴 (T48) — sim.js 와 같이 남은 시간만 줄이고 이번 틱 공격을 통째로 건너뛴다.
       공격 타이머는 흐르지 않는다(풀리자마자 밀린 공격이 몰아치지 않게 — 위임 기본값). */
    if(e.stun>0){ e.stun-=dt; e.aggro=false; continue; }
    const d=e.worldX-p.worldX;
    if(!e.ranged){
      e.aggro = d<290;
      if(d<105){
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer+=e.isBoss?1.6:1.3;
          e.strikeT=0.16;
          let dm=e.dmg;
          if(e.isBoss){ e.hits=(e.hits||0)+1; if(e.hits%3===0){ dm*=2.2; shake(8); addText('강타!','#FF5252',e.worldX,-130,true);} }
          hitPlayer(dm,true,e);
          if(G.over||G.paused) return;
        }
      }
    }else{
      if(d<440 && d>40){
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer+=2.1; e.strikeT=0.16;
          AU.play('arrow');
          const friendly = p.misfire>0 && Math.random()<p.misfire;
          G.arrows.push({x:e.worldX-18,dmg:e.dmg,friendly,src:e});
        }
      }
    }
  }

  /* 적 화살 */
  for(let i=G.arrows.length-1;i>=0;i--){
    const a=G.arrows[i];
    a.x-=330*dt;
    let hit=false;
    if(a.friendly){
      for(const e of alive){
        if(e!==a.src && e.hp>0 && Math.abs(e.worldX-a.x)<16 && e.worldX<a.src.worldX){
          e.hp-=a.dmg*2; e.hitT=0.15;
          addText('오사! '+fmt(a.dmg*2),'#FFD54F',e.worldX,-92);
          sparks(e.worldX,-40,'#FFD54F',5,130);
          if(e.hp<=0) onKill(e);
          hit=true; break;
        }
      }
    }
    if(!hit && a.x<=p.worldX+8){ hitPlayer(a.dmg,false,a.src); hit=true; }
    if(hit || a.x<p.worldX-60) G.arrows.splice(i,1);
  }

  /* 플레이어 투사체 (도끼/화살/검기/창) */
  for(let i=G.pprojs.length-1;i>=0;i--){
    const pr=G.pprojs[i];
    pr.x+=pr.spd*dt;
    if(pr.type==='axe') pr.spin+=dt*16;
    let done=false;
    if(pr.type==='spear'||pr.type==='wave'){
      for(const e of aliveEnemies()){
        if(pr.node&&e.wave!==pr.node) continue;   /* 미스폰·대기 웨이브 피격 금지 (주인 15:2X) */
        if(!pr.hit.has(e)&&Math.abs(e.worldX-pr.x)<16){
          pr.hit.add(e);
          summonHit(e,pr.ratio,pr.type==='spear'?'🔱':'🌊');
          if(pr.hit.size>=pr.pierce){ done=true; break; }
        }
      }
      if(pr.x>pr.maxX) done=true;
    }else{
      if(!pr.tgt||pr.tgt.hp<=0) done=true;
      else if(pr.x>=pr.tgt.worldX-10){ summonHit(pr.tgt,pr.ratio,pr.type==='axe'?'🪓':'🏹'); done=true; }
    }
    if(done) G.pprojs.splice(i,1);
  }

  $('progIn').style.width=(G.killed/G.totalEnemies*100)+'%';
  updateBars();
}

/* ================= HUD ================= */
const STAT_DEFS=[
  /* base = 「전투 시작 시점 값」 — 장비 계열 옵션은 시작 시점에 이미 들어가 있으므로 buildPower/GOPT 결과가 기준이다.
     특전·버프로 그 위로 올라간 항목만 초록으로 강조된다. */
  /* `k` = UI_SVG 아이콘 키 (T2 7단계에서 이모지 폐지 — 참고: docs/ref/메인 게임화면.jpg 하단 스탯 그리드) */
  {k:'dmg',    lb:'공격력',    v:p=>fmt(effDmg(p)),           cur:p=>effDmg(p),    base:()=>statBase().dmg},
  {k:'def',    lb:'방어력',    v:p=>effDef(p).toFixed(1)+'%', cur:p=>effDef(p),    base:()=>statBase().def},
  {k:'aspd',   lb:'공격속도',  v:p=>effAspd(p).toFixed(2)+'/s',cur:p=>effAspd(p),  base:()=>statBase().aspd},
  {k:'counter',lb:'반격 확률',  v:p=>p.counter.toFixed(1)+'%', cur:p=>p.counter,    base:()=>statBase().counter},
  {k:'critR',  lb:'치명타 확률',v:p=>effCritR(p).toFixed(0)+'%',cur:p=>effCritR(p), base:()=>statBase().critR},
  {k:'evade',  lb:'회피',      v:p=>effEvade(p).toFixed(1)+'%',cur:p=>effEvade(p), base:()=>statBase().evade},
  {k:'critF',  lb:'치명타 배율',v:p=>effCritF(p).toFixed(0)+'%',cur:p=>effCritF(p), base:()=>statBase().critF},
  /* 🩸 흡혈 행 제거 — 주인 지시(2026-09-02 07:1X): 흡혈 특전 전면 배제로 항상 0 이라 7종으로 (엔진 steal 지원은 유지) */
];
/* 현재 장비 구성의 전투 시작 스탯 (특전 획득 전) — 전투마다 한 번만 계산해 캐시 */
let _statBase=null, _statBaseKey='';
function statBase(){
  const key=GT.parts.map(pt=>{const g=equippedGear(pt);return (g?g.type+g.rar+'+'+g.plus:'-')+':'+(save.slots[pt]|0);}).join(',');
  if(_statBase&&_statBaseKey===key) return _statBase;
  const p=playerBase();
  _statBaseKey=key;
  return _statBase={dmg:p.dmg, def:p.def, aspd:p.aspd, counter:p.counter, critR:p.critR, evade:p.evade, critF:p.critF};
}
function renderStatsGrid(){
  if(!G) return;
  const p=G.player, box=$('stats');
  if(!box.children.length){
    box.innerHTML=STAT_DEFS.map((d,i)=>
      `<div class="st"><span class="ic">${uiIcon(d.k)}</span><div><div class="lb">${d.lb}</div><div class="vl" id="sv${i}"></div></div></div>`
    ).join('');
  }
  STAT_DEFS.forEach((d,i)=>{
    const el=$('sv'+i);
    el.textContent=d.v(p);
    el.classList.toggle('up', d.cur(p) > d.base()+0.001);
  });
}
/* ===== ⚑ 주인 지시(2026-09-02 07:0X) 인게임 UI 2건 (PLAN §2.3) =====
   ① 발동 중 버프 아이콘 — 화면 왼쪽 위·챕터 표시보다 아래, 등급색 테두리 + 중첩 수 뱃지, 오래된 것이 위.
   ② 얻은 특전 미리보기 줄 — Info 버튼 행 왼쪽 끝부터 획득 순서대로, 중복은 개수 뱃지, 넘치면 «+N».
   둘 다 표시 전용이라 전투 수치·판정에 관여하지 않는다 (sim.js 무관). */
/* 장비 옵션발 버프(= 특전이 아니라 어느 특전 아이콘도 못 쓰는 경우)의 폴백 아이콘 —
   스탯 그리드와 **같은 UI_SVG 표**를 쓴다(같은 스탯이 두 화면에서 다른 그림이 되지 않게). T2 7단계 */
const BUFF_STAT_IC={atk:'dmg',aspd:'aspd',critR:'critR',critF:'critF',def:'def',evade:'evade'};
function renderBuffBar(){
  const box=$('buffBar'); if(!box) return;
  if(!G||!G.player){ box.innerHTML=''; return; }
  const p=G.player, groups=new Map();
  for(const k in p.buffs) for(const b of p.buffs[k]){
    const id=b.src||('#'+k);
    const g=groups.get(id);
    if(g){ g.n++; if(b.q<g.q) g.q=b.q; }
    else groups.set(id,{n:1, q:b.q||0, k, perk:b.src?G.pxPerk[b.src]:null});
  }
  let html=[...groups.values()].sort((a,b)=>a.q-b.q).map(g=>{
    const cc = g.perk ? RARITY[g.perk.r].cc : '#9EA3AC';
    const ic = g.perk ? g.perk.ic : uiIcon(BUFF_STAT_IC[g.k]||'spark');
    return `<div class="buff-ic" style="--bc:${cc};--bg:${cc}55">${ic}`+
      (g.n>1?`<span class="cnt">${g.n}</span>`:'')+`</div>`;
  }).join('');
  /* ⚑ 횟수형 방어막 (T48) — 시간제 버프가 아니라 «장수» 라 buffs 에 안 들어간다.
     주인 지시(17:2X)대로 버프 아이콘 줄 맨 앞에 남은 장수 뱃지를 달아 따로 보여준다. */
  if(p.ward>0){
    const cc=RARITY[1].cc;   /* 기본 획득처가 희귀 🛡️✨(r_ward) 라 희귀색 */
    html=`<div class="buff-ic ward-ic" style="--bc:${cc};--bg:${cc}55">🛡️<span class="cnt">${p.ward}</span></div>`+html;
  }
  if(box.innerHTML!==html) box.innerHTML=html;
}
function renderPerkStrip(){
  const box=$('perkStrip'); if(!box) return;
  if(!G){ box.innerHTML=''; return; }
  const order=[], cnt=new Map();
  for(const pk of G.perksTaken){
    const id=pk.id||pk.tx;
    if(!cnt.has(id)){ cnt.set(id,0); order.push({pk,id}); }
    cnt.set(id,cnt.get(id)+1);
  }
  /* 칩 28px + 간격 4px. 폭을 못 재는 상황(화면 비표시)에서는 7칸으로 잡는다. */
  const w=box.clientWidth||224;
  const cap=Math.max(1,Math.floor((w+4)/32));
  let list=order, more=0;
  if(order.length>cap){ more=order.length-(cap-1); list=order.slice(order.length-(cap-1)); }
  const html=(more?`<div class="pv-more">+${more}</div>`:'')+list.map(o=>{
    const c=cnt.get(o.id), cc=RARITY[o.pk.r].cc;
    return `<div class="pv-ic" style="--bc:${cc}">${o.pk.ic}`+(c>1?`<span class="cnt">${c}</span>`:'')+`</div>`;
  }).join('');
  if(box.innerHTML!==html) box.innerHTML=html;
}
let lastBars='';
function updateBars(){
  if(!G) return;
  const p=G.player;
  const key=[p.exp,p.level,Math.round(p.hp),Math.round(p.sh),Math.round(p.maxHp),Math.round(p.maxSh)].join(',');
  if(key===lastBars) return;
  lastBars=key;
  $('lvCap').textContent='Lv'+p.level;
  $('expTxt').textContent=`${p.exp}/${expNeed(p.level)}`;
  document.querySelector('#expBar .fill').style.width=(p.exp/expNeed(p.level)*100)+'%';
  $('hpTxt').textContent=`${fmt(p.hp)}/${fmt(p.maxHp)}`;
  document.querySelector('#hpBar .fill').style.width=(p.hp/p.maxHp*100)+'%';
  $('shTxt').textContent=`${fmt(p.sh)}/${fmt(p.maxSh)}`;
  document.querySelector('#shBar .fill').style.width=(p.maxSh?p.sh/p.maxSh*100:0)+'%';
}

/* ================= RENDER ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
const LW=540; let LH=900, cam=0;

function drawCharOn(c,x,y,o){
  const s=o.s||1, f=o.f||1, bob=o.bob||0;
  const punch=(o.hitT? 1+o.hitT*1.4 : 1);
  const lunge=(o.strikeT? Math.sin(o.strikeT/0.16*Math.PI)*10*f : 0);
  c.save(); c.translate(x+lunge,y+bob); c.scale(s*punch,s*(1/punch));
  c.fillStyle='rgba(0,0,0,.15)';
  c.beginPath(); c.ellipse(0,2,15,4.5,0,0,7); c.fill();
  if(o.weapon==='bow'){
    c.strokeStyle='#7A5230'; c.lineWidth=2.6;
    c.beginPath(); c.arc(f*13,-22,10,f>0?-1.2:Math.PI-1.9, f>0?1.2:Math.PI+1.9); c.stroke();
    c.strokeStyle='#EEE'; c.lineWidth=1;
    c.beginPath(); c.moveTo(f*13+f*4,-31); c.lineTo(f*13+f*4,-13); c.stroke();
  }
  c.fillStyle=o.body||'#777';
  c.beginPath(); c.roundRect(-11,-27,22,27,9); c.fill();
  c.fillStyle=o.skin||'#F6D7A7';
  c.beginPath(); c.arc(0,-40,15,0,7); c.fill();
  c.fillStyle='#26262B';
  c.beginPath(); c.arc(f*4-4.5,-41,2.3,0,7); c.arc(f*4+4.5,-41,2.3,0,7); c.fill();
  if(o.hat==='helmet'){
    c.fillStyle='#AEB6BE';
    c.beginPath(); c.arc(0,-44,15.5,Math.PI,0); c.fill();
    c.beginPath(); c.roundRect(-17,-46,34,5,2); c.fill();
    c.fillStyle='#3E6FD8'; c.beginPath(); c.arc(0,-60,4.5,0,7); c.fill();
  }else if(o.hat==='cone'){
    c.fillStyle='#8A6B4F';
    c.beginPath(); c.moveTo(-14,-47); c.lineTo(14,-47); c.lineTo(0,-64); c.closePath(); c.fill();
    c.beginPath(); c.roundRect(-16,-49,32,4,2); c.fill();
  }else if(o.hat==='hood'){
    c.fillStyle='#5C6068';
    c.beginPath(); c.arc(0,-42,16,Math.PI*0.95,Math.PI*0.05); c.fill();
  }else if(o.hat==='horns'){
    c.fillStyle='#D84343';
    c.beginPath(); c.moveTo(-9,-50); c.lineTo(-16,-64); c.lineTo(-3,-53); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(9,-50); c.lineTo(16,-64); c.lineTo(3,-53); c.closePath(); c.fill();
  }else if(o.hat==='halo'){
    c.strokeStyle='#FFD54F'; c.lineWidth=3;
    c.beginPath(); c.ellipse(0,-62,10,3.5,0,0,7); c.stroke();
  }
  if(o.wings){
    c.fillStyle='rgba(255,255,255,.92)';
    c.beginPath(); c.ellipse(-16,-26,7,13,0.5,0,7); c.fill();
    c.beginPath(); c.ellipse(16,-26,7,13,-0.5,0,7); c.fill();
  }
  if(o.weapon==='sword'){
    c.save(); c.translate(f*13,-16); c.rotate(f*(0.5-(o.strikeT?o.strikeT*3:0)));
    c.fillStyle='#E8ECF0';
    c.beginPath(); c.moveTo(-3.5,-2); c.lineTo(f*24,-5); c.lineTo(f*27,0); c.lineTo(f*24,4); c.lineTo(-3.5,3); c.closePath(); c.fill();
    c.fillStyle='#C9A03B'; c.beginPath(); c.roundRect(f>0?-4:-2,-6,4,12,2); c.fill();
    c.fillStyle='#7A5230'; c.beginPath(); c.roundRect(f>0?-9:3,-2.5,6,5,2); c.fill();
    c.restore();
  }else if(o.weapon==='axe'){
    c.save(); c.translate(f*13,-15); c.rotate(f*(0.35-(o.strikeT?o.strikeT*3:0)));
    c.fillStyle='#7A5230'; c.beginPath(); c.roundRect(-1.8,-16,3.6,20,2); c.fill();
    c.fillStyle='#D2691E';
    c.beginPath(); c.moveTo(0,-16); c.quadraticCurveTo(f*14,-16,f*13,-4); c.quadraticCurveTo(f*5,-8,0,-6); c.closePath(); c.fill();
    c.restore();
  }
  c.restore();
}

function drawHpBar(x,y,w,frac,txt,color){
  ctx.fillStyle='#141418';
  ctx.beginPath(); ctx.roundRect(x-w/2-1.5,y-1.5,w+3,15,5); ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.roundRect(x-w/2,y,Math.max(3,w*clamp(frac,0,1)),12,4); ctx.fill();
  ctx.fillStyle='#FFF'; ctx.font='10.5px Jua'; ctx.textAlign='center';
  ctx.fillText(txt,x,y+10);
}

function drawFire(x,y,t){
  ctx.fillStyle='#7A5230';
  ctx.save(); ctx.translate(x,y);
  ctx.rotate(0.5); ctx.fillRect(-16,-3,32,6); ctx.rotate(-1); ctx.fillRect(-16,-3,32,6);
  ctx.restore();
  const fl=Math.sin(t*9)*3;
  ctx.fillStyle='#F5A623';
  ctx.beginPath(); ctx.ellipse(x,y-16+fl*0.3,10,16+fl,0,0,7); ctx.fill();
  ctx.fillStyle='#FFD54F';
  ctx.beginPath(); ctx.ellipse(x,y-12+fl*0.3,5.5,9+fl*0.6,0,0,7); ctx.fill();
}

function drawScene(){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(w===0) return;
  if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  const sc=cv.width/LW; LH=cv.height/sc;
  ctx.setTransform(sc,0,0,sc,0,0);

  const p=G?G.player:null;
  cam=p?Math.max(0,p.worldX-150):0;
  const t=G?G.t:0;
  if(G&&G.shake>0){ ctx.translate(rand(-G.shake,G.shake)*0.5,rand(-G.shake,G.shake)*0.5); }
  const gy=LH*0.615;
  const pathTop=LH*0.47, pathBot=LH*0.78;

  ctx.fillStyle='#8CC85E'; ctx.fillRect(-20,-20,LW+40,pathTop+20);
  ctx.fillStyle='#C9A470'; ctx.fillRect(-20,pathTop,LW+40,pathBot-pathTop);
  ctx.fillStyle='#7FBF52'; ctx.fillRect(-20,pathBot,LW+40,LH-pathBot+40);
  ctx.fillStyle='#6FAE47';
  for(let x=-((cam)%36)-36;x<LW+36;x+=36){
    ctx.beginPath(); ctx.arc(x,pathTop,9,0,Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(x+18,pathBot,9,Math.PI,0); ctx.fill();
  }
  for(let i=Math.floor(cam/90)-1;i<Math.floor((cam+LW)/90)+2;i++){
    const hx=hash(i), x=i*90+hx*50-cam;
    if(hx<0.28){
      const ty=pathTop*(0.28+hash(i+9)*0.5);
      ctx.fillStyle='#7A5230'; ctx.fillRect(x-5,ty,10,26);
      ctx.fillStyle='#5E9C3B';
      ctx.beginPath(); ctx.arc(x,ty-8,22,0,7); ctx.arc(x-15,ty+2,14,0,7); ctx.arc(x+15,ty+2,14,0,7); ctx.fill();
    }else if(hx<0.5){
      const by=pathBot+18+hash(i+3)*(LH-pathBot-40);
      ctx.fillStyle='#5E9C3B';
      ctx.beginPath(); ctx.arc(x,by,13,0,7); ctx.arc(x+12,by+3,9,0,7); ctx.fill();
    }else if(hx<0.68){
      const fy=hash(i+5)<0.5? pathTop*0.6 : pathBot+20+hash(i+7)*(LH-pathBot-45);
      ctx.fillStyle=hash(i+2)<0.5?'#F2D34B':'#F2F2F2';
      for(let k=0;k<5;k++){ const a=k/5*Math.PI*2; ctx.beginPath(); ctx.arc(x+Math.cos(a)*4.4,fy+Math.sin(a)*4.4,3,0,7); ctx.fill(); }
      ctx.fillStyle='#F5A623'; ctx.beginPath(); ctx.arc(x,fy,2.8,0,7); ctx.fill();
    }else if(hx<0.78){
      ctx.fillStyle='#C4CDD4';
      ctx.beginPath(); ctx.ellipse(x,pathTop*0.7,15,10,0,0,7); ctx.fill();
      ctx.fillStyle='#AEB6BE';
      ctx.beginPath(); ctx.ellipse(x-4,pathTop*0.7+2,9,6,0,0,7); ctx.fill();
    }
  }

  if(!G) return;

  for(const n of G.nodes){
    const x=n.x-cam;
    if(x<-80||x>LW+80) continue;
    if(n.type==='rest'&&!n.done) drawFire(x,gy,t);
    else if(n.type==='devil'&&!n.done) drawCharOn(ctx,x,gy,{s:1.15,f:-1,body:'#5A3247',skin:'#C77E9E',hat:'horns',bob:Math.sin(t*3)*2});
    else if(n.type==='angel'&&!n.done) drawCharOn(ctx,x,gy,{s:1.15,f:-1,body:'#F2F2F6',skin:'#F6D7A7',hat:'halo',wings:true,bob:Math.sin(t*2.2)*4-4});
  }

  for(const n of G.nodes) for(const e of n.enemies){
    if(e.hp<=0) continue;
    const x=e.worldX-cam;
    if(x<-90||x>LW+90) continue;
    const s=e.isBoss?1.7:1;
    drawCharOn(ctx,x,gy,{s,f:-1,body:e.skin.body,hat:e.skin.hat,weapon:e.skin.weapon,
      bob:Math.sin(t*7+e.bob)*(e.aggro?2.5:1), hitT:e.hitT, strikeT:e.strikeT});
    drawHpBar(x,gy+12,e.isBoss?88:56,e.hp/e.maxHp,fmt(e.hp),'#E8483F');
    /* ⚑ 기절 표시 (T48) — 머리 위 💫 가 돌고 남은 시간을 같이 보여준다 (주인 15:5X «기절 표시 + 남은 시간») */
    if(e.stun>0){
      const hy=gy-(e.isBoss?96:66);
      ctx.save();
      ctx.translate(x,hy);
      ctx.rotate(Math.sin(t*7)*0.5);
      ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💫',0,0);
      ctx.restore();
      ctx.fillStyle='#FFE9A0'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
      ctx.fillText(e.stun.toFixed(1)+'s',x,hy+15);
    }
  }

  /* ⚑ 사신의 낫 연출 (T48) — 적 위를 큰 낫이 호를 그리며 훑고 붉은 참격선이 남는다 */
  for(const rp of G.reaps){
    const x=rp.x-cam, k=Math.min(1,rp.t/0.45);
    ctx.save();
    ctx.globalAlpha=1-k;
    /* 낫 자루 + 날 — 위에서 아래로 훑는 회전 */
    ctx.translate(x,gy-58);
    ctx.rotate(-1.15+k*2.3);
    ctx.strokeStyle='#4A4458'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(0,30); ctx.stroke();
    ctx.strokeStyle='#E7E2F5'; ctx.lineWidth=7;
    ctx.beginPath(); ctx.arc(0,-34,30,Math.PI*0.05,Math.PI*0.85); ctx.stroke();
    ctx.restore();
    /* 참격선 */
    ctx.save();
    ctx.globalAlpha=(1-k)*0.9;
    ctx.strokeStyle='#FF5E6C'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-30,gy-74+k*24); ctx.lineTo(x+30,gy-38+k*24); ctx.stroke();
    ctx.restore();
  }

  /* 적 화살 */
  ctx.strokeStyle='#6B4A2B'; ctx.lineWidth=3;
  for(const a of G.arrows){
    const x=a.x-cam;
    ctx.beginPath(); ctx.moveTo(x,gy-38); ctx.lineTo(x+16,gy-38); ctx.stroke();
    ctx.fillStyle='#D8DDE2';
    ctx.beginPath(); ctx.moveTo(x,gy-41); ctx.lineTo(x-6,gy-38); ctx.lineTo(x,gy-35); ctx.closePath(); ctx.fill();
  }

  /* 플레이어 투사체 */
  for(const pr of G.pprojs){
    const x=pr.x-cam;
    if(pr.type==='axe'){
      ctx.save(); ctx.translate(x,gy-46); ctx.rotate(pr.spin);
      ctx.fillStyle='#7A5230'; ctx.fillRect(-2,-12,4,22);
      ctx.fillStyle='#D2691E';
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.quadraticCurveTo(13,-12,12,-1); ctx.quadraticCurveTo(5,-6,0,-4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }else if(pr.type==='parrow'){
      ctx.strokeStyle='#8A6B4F'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x-14,gy-46); ctx.lineTo(x,gy-46); ctx.stroke();
      ctx.fillStyle='#E8ECF0';
      ctx.beginPath(); ctx.moveTo(x,gy-49); ctx.lineTo(x+7,gy-46); ctx.lineTo(x,gy-43); ctx.closePath(); ctx.fill();
    }else if(pr.type==='spear'){
      ctx.strokeStyle='#C9A03B'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(x-30,gy-44); ctx.lineTo(x,gy-44); ctx.stroke();
      ctx.fillStyle='#E8ECF0';
      ctx.beginPath(); ctx.moveTo(x,gy-49); ctx.lineTo(x+12,gy-44); ctx.lineTo(x,gy-39); ctx.closePath(); ctx.fill();
    }else if(pr.type==='wave'){
      ctx.strokeStyle='rgba(120,220,255,.9)'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(x-10,gy-40,22,-1.1,1.1); ctx.stroke();
      ctx.strokeStyle='rgba(200,240,255,.7)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(x-14,gy-40,16,-1.0,1.0); ctx.stroke();
    }
  }

  /* 번개 */
  for(const b of G.bolts){
    const x=b.x-cam, a=clamp(1-b.t/0.3,0,1);
    ctx.strokeStyle=`rgba(255,228,92,${a})`; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.moveTo(x+Math.sin(b.seed)*10,30);
    for(let s2=1;s2<=6;s2++){
      const ny=30+(gy-100)*s2/6;
      ctx.lineTo(x+Math.sin(b.seed+s2*3.7)*14,ny);
    }
    ctx.lineTo(x,gy-40); ctx.stroke();
    ctx.fillStyle=`rgba(255,240,150,${a*0.8})`;
    ctx.beginPath(); ctx.arc(x,gy-40,14*(1.4-a),0,7); ctx.fill();
  }



  /* 플레이어 */
  const px2=G.player.worldX-cam;
  drawCharOn(ctx,px2,gy,{s:1.05,f:1,body:'#5E6A75',hat:'helmet',weapon:'sword',
    bob:G.player.walking?Math.sin(t*13)*3:Math.sin(t*3)*1.5,
    hitT:G.player.hitT, strikeT:G.player.strikeT});
  drawHpBar(px2,gy+12,62,G.player.hp/G.player.maxHp,fmt(G.player.hp),'#E8483F');
  drawHpBar(px2,gy+29,62,G.player.maxSh?G.player.sh/G.player.maxSh:0,fmt(G.player.sh),'#38A6E8');

  /* 파티클 */
  for(const pt of G.parts){
    const x=pt.x-cam, frac=1-pt.t/pt.life;
    if(pt.puff){
      ctx.fillStyle=pt.color+(frac*0.7)+')';
      ctx.beginPath(); ctx.arc(x,gy+pt.y,pt.size*(1+pt.t*2),0,7); ctx.fill();
    }else{
      ctx.globalAlpha=frac;
      ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(x,gy+pt.y,pt.size,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  /* 플로팅 텍스트 */
  ctx.textAlign='center';
  for(const ft of G.texts){
    const x=ft.x-cam;
    const pop=ft.t<0.12? 1+(0.12-ft.t)*4 : 1;
    ctx.font=(ft.big?26:17)*pop+'px Jua';
    ctx.globalAlpha=clamp(1.3-ft.t,0,1);
    ctx.fillStyle='rgba(0,0,0,.45)';
    ctx.fillText(ft.txt,x+1.5,gy+ft.y-ft.t*46+1.5);
    ctx.fillStyle=ft.color;
    ctx.fillText(ft.txt,x,gy+ft.y-ft.t*46);
  }
  ctx.globalAlpha=1;
}

/* ================= MAIN LOOP ================= */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  if(screenName==='game'&&G){
    if(!G.paused&&!G.over) update(dt*SPEEDS[speedIdx]);
    drawScene();
  }
  requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{ if(screenName==='lobby') renderLobby(); });
renderLobby();
requestAnimationFrame(loop);
</script>
