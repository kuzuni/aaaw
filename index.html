/* ================= 합성 / 대장간 화면 (PLAN §11.3 · 참고: docs/ref/장비 합성 업글창.jpg) =================
   스크린샷의 «수동 3칸 선택» 구도: 재료 3칸 → ▲ → 결과 미리보기, 아래에 자동/합성 버튼과 인벤 그리드.
   ⚠ 산출물은 `fuseMake()` 하나만 쓴다 — 자동(fuseAll)과 규칙이 갈라질 수 없다.
   ⚑⚑⚑ T125 ①-c (주인 확정 2026-09-04 21:2X) — 재료 제한이 **«장착분 제외»** 로 확정됐다(주인 «장착 중인 것은
      재료 후보에서 제외 — 종전 규칙 유지»). 종전의 «장착분도 재료»(T41 · 승인 대기 28번)는 이로써 해소됐고,
      게임이 PLAN §11.3 문면과 일치한다. `sim.js accRefresh` 는 «합성 후 즉시 재장착» 이 측정 정책이라 그대로다. */
let FG=[];                                   /* 선택된 재료 uid 배열 (최대 3) */
const fgMatsGear=()=>FG.map(invById).filter(Boolean);
function fgKey(g){ return `${g.part}|${g.type}|${g.rar}`; }
function openForge(){ FG=[]; showScreen('forge'); }
function renderForge(){
  renderTopBars();
  const mats=fgMatsGear();
  if(mats.length!==FG.length) FG=mats.map(g=>g.u);          /* 사라진 uid 정리 */
  const lock=mats.length?fgKey(mats[0]):null;
  /* 재료 3칸 */
  $('fgMats').innerHTML=[0,1,2].map(i=>{
    const g=mats[i];
    if(!g) return `<button class="fg-cell empty" data-i="${i}">＋</button>`;
    return `<button class="fg-cell" data-i="${i}" style="border-color:${GT.rarColor[g.rar]};background:linear-gradient(${GT.rarColor[g.rar]}55,${GT.rarColor[g.rar]}22)">`+
      `<span class="ptag" style="background:${GT.rarColor[g.rar]}">${GT.partName[g.part]}</span>${gearIcon(g.type)}</button>`;
  }).join('');
  $('fgMats').querySelectorAll('.fg-cell').forEach(b=>b.onclick=()=>{
    const g=mats[+b.dataset.i]; if(!g) return;
    AU.play('click'); FG=FG.filter(u=>u!==g.u); renderForge();       /* 재료 칸을 누르면 해제 */
  });
  /* 결과 미리보기 — 3개가 다 찼을 때만 실제 산출물을 보여준다 */
  const res=$('fgResult');
  if(mats.length===3){
    const base=mats.slice().sort((a,b)=>b.plus-a.plus)[0], made=fuseMake(base);
    res.className='fg-slot';
    res.style.borderColor=GT.rarColor[made.rar];
    res.style.boxShadow=`0 0 14px ${GT.rarGlow[made.rar]}`;
    res.innerHTML=`${gearIcon(made.type)}${made.plus?`<span class="plus">+${made.plus}</span>`:''}`;
    $('fgBanner').innerHTML=`<div><b>${GT.rarName[made.rar]} ${GT.typeName[made.type]}</b>${made.plus?` <b>+${made.plus}</b>`:''}<br>`+
      `<span style="font-size:12px;color:var(--ink-dim)">재료 3개가 사라지고 위 장비 1개가 됩니다</span></div>`;
  }else{
    res.className='fg-slot empty'; res.style.borderColor=''; res.style.boxShadow=''; res.innerHTML='🛠️';
    $('fgBanner').innerHTML=mats.length
      ? `<div>같은 <b>${GT.partName[mats[0].part]} · ${GT.typeName[mats[0].type]} · ${GT.rarName[mats[0].rar]}</b> 을(를)<br>`+
        `<b>${3-mats.length}개</b> 더 고르세요</div>`
      : `<div>합성할 장비를<br>선택하세요<br><span style="font-size:12px;color:var(--ink-dim)">같은 부위·종류·등급 3개</span></div>`;
  }
  const fk=fusableKeys();
  $('fgAuto').disabled=fk.size===0;
  $('fgAuto').innerHTML=fk.size?`⚙️ 자동 (${fk.size})<span class="bang">!</span>`:'⚙️ 자동';
  $('fgFuse').disabled=mats.length!==3;
  $('fgFuse').textContent=`🔨 합성 (${mats.length}/3)`;
  /* 인벤 — 선택된 것은 초록, 다른 키는 흐리게 */
  $('fgGrid').innerHTML = save.inv.length ? invSorted().map(g=>{
    const sel=FG.includes(g.u);
    const off=isEquipped(g)||(lock&&!sel&&fgKey(g)!==lock);   /* ⚑ T125 ①-c — 장착분은 재료 후보가 아니다 */
    return invCellHTML(g,{cls:(sel?'sel':'')+(off?' off':''),fus:!lock&&fk.has(fgKey(g))});
  }).join('') : `<div class="inv-empty">장비가 없습니다.<br>🏪 상점에서 뽑기로 장비를 얻으세요.</div>`;
  $('fgGrid').querySelectorAll('.inv-cell').forEach(b=>b.onclick=()=>{
    const g=invById(+b.dataset.u); if(!g) return;
    if(FG.includes(g.u)){ AU.play('click'); FG=FG.filter(u=>u!==g.u); renderForge(); return; }
    /* ⚑ T125 ①-c — 장착 중인 장비는 재료가 되지 않는다(자동 장착이 없어져 그 부위가 빈 채 남기 때문). */
    if(isEquipped(g)){ toast('장착 중인 장비는 재료가 되지 않습니다 — 먼저 해제하세요'); return; }
    if(lock&&fgKey(g)!==lock){ toast(`같은 부위·종류·등급만 재료가 됩니다 (${GT.partName[mats[0].part]} · ${GT.typeName[mats[0].type]} · ${GT.rarName[mats[0].rar]})`); return; }
    if(FG.length>=3){ toast('재료는 3개까지입니다'); return; }
    AU.play('click'); FG.push(g.u); renderForge();
  });
}
$('fgBack').onclick=()=>{ AU.play('click'); showScreen('gear'); };
$('fgFuse').onclick=()=>{
  const mats=fgMatsGear(); if(mats.length!==3) return;
  AU.play('levelup');
  const base=mats.slice().sort((a,b)=>b.plus-a.plus)[0], made=fuseMake(base);
  for(const m of mats){ const i=save.inv.indexOf(m); if(i>=0) save.inv.splice(i,1); }
  made.u=save.uid++; save.inv.push(made); save.fuses++;
  FG=[]; persist(); renderForge();                          /* ⚑ T125 ①-c — 자동 장착 없음 */
  toast(`🔨 ${GT.rarName[made.rar]} ${GT.typeName[made.type]}${made.plus?` +${made.plus}`:''} 완성!`);
};
$('fgAuto').onclick=()=>{
  AU.play('click');
  const before=save.inv.length;
  /* ⚑⚑⚑ T125 ①-c (주인 21:2X «장착 중인 것은 재료 후보에서 제외») — 자동 합성도 장착분은 안 먹는다.
     자동 장착이 없어졌으므로 장착분을 재료로 쓰면 그 부위가 그대로 빈 채 남는다(종전엔 autoEquipBest 가 덮었다).
     이로써 게임이 PLAN §11.3 «장착 중인 장비는 합성 재료에서 제외» 와 일치한다(승인 대기 28번 해소).
     `sim.js` 의 accRefresh 는 측정 정책상 전체를 대상으로 합성하고 곧바로 재장착하므로 종전 그대로다. */
  const n=fuseAll(save.inv,new Set(GT.parts.map(equippedGear).filter(Boolean)));
  for(const g of save.inv) if(!g.u) g.u=save.uid++;      /* fuseAll 이 만든 신품에 uid 부여 */
  save.fuses+=n; FG=[];
  if(n){ AU.play('levelup'); persist(); renderForge();      /* ⚑ T125 ①-c — 자동 장착 없음 */
    toast(`🔨 ${n}회 합성 (장비 ${before} → ${save.inv.length})`); }
  else toast('합성할 조합이 없습니다 (같은 부위·종류·등급 3개)');
};
/* ⚑⚑⚑ T125 ①-c (주인 확정 21:2X) — 게임 쪽 **자동 장착은 폐지**했다(종전 `autoEquipBest`).
   뽑기·합성 결과는 인벤에만 들어가고, 장착은 유저가 장비 탭 → 인벤 칸 → «장착» 으로 직접 한다.
   `autoEquip(inv)` 는 시뮬(`sim.js accRefresh`)의 측정 정책이라 엔진에는 그대로 남아 있다 — 게임에서는
   «인벤에 더 좋은 게 있다» 는 **↑ 표시**만 계산한다(장착은 안 한다). */
function betterInInv(pt){
  const cur=equippedGear(pt);
  let best=null;
  for(const g of save.inv){ if(g.part!==pt||isEquipped(g))continue; if(!best||gearScore(g)>gearScore(best))best=g; }
  return !!(best&&(!cur||gearScore(best)>gearScore(cur)));
}
function drawGearAvatar(){
  const cv=$('gearAvatar'), d=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  cv.width=w*d; cv.height=h*d;
  const c=cv.getContext('2d'); c.setTransform(d,0,0,d,0,0);
  c.clearRect(0,0,w,h);
  drawCharOn(c,w/2,h*0.86,{s:Math.min(w,h)/52,f:1,body:'#5E6A75',hat:'helmet'});
}

/* ---- 장비 세부 팝업 (참고: 장비 세부팝업.jpg) ---- */
function optRowsHTML(g){
  const tbl=GOPT[g.type], n=GT.optCount(g.rar,g.plus);
  return tbl.map((o,i)=>{
    const on=i<n;
    /* ⚑ T147 — 잠금 안내가 한 칸씩 밀려 있었다. 옵션 i 는 `GT.optCount(rar,plus) > i` 일 때 열린다.
       ⚑⚑⚑ T153 — 영웅이 빠져 등급이 4단이 됐다: i=0~3 → 일반·희귀·전설·신화 «이상»,
       i=4~6 → 신화 +3/+6/+9강. 경계는 `rarName.length` 에서 읽는다(리터럴로 되돌리지 말 것). */
    const R=GT.rarName.length;
    const need = i<R ? `${GT.rarName[i]} 이상` : `신화 +${(i-R+1)*3}강`;
    return `<div class="gd-opt${on?'':' lock'}"><span>${on?'◆':'🔒'}</span><span>${o.d}${on?'':` <span style="opacity:.7">(${need})</span>`}</span></div>`;
  }).join('');
}
function gearContribHTML(g){
  const m=GT.slotMul(save.slots[g.part]|0)*(1+GT.plusStep*g.plus);
  return `<div class="gd-stat"><span>⚔️ 공격력</span><b>+${fmt(Math.round(GT.atk[g.rar]*m))}</b></div>`+
         `<div class="gd-stat"><span>❤️ 체력</span><b>+${fmt(Math.round(GT.hp[g.rar]*m))}</b></div>`+
         `<div class="gd-stat"><span>🛡️ 실드</span><b>+${fmt(Math.round(GT.sh[g.rar]*m))}</b></div>`;
}
function slotMaxed(pt){ return (save.slots[pt]|0)>=GT.slotLvMax; }
/* ⚑ T116 U02 — 레퍼런스 세부팝업은 «스탯 섹션 / 옵션 목록 / 비용줄» 이 **따로 놓인 세 블록**이라
   종전의 «강화 줄 + 안내 줄» 한 덩어리를 둘로 나눈다. 문구·수치는 그대로다(표시 구조만 바뀐다). */
function slotCostHTML(pt){
  const lv=save.slots[pt]|0, cost=GT.slotCost(lv);
  return `<div class="gd-stat"><span>슬롯 강화 Lv.${lv} → ${slotMaxed(pt)?'MAX':'Lv.'+(lv+1)}</span>`+
    `<b style="color:var(--gold)">${slotMaxed(pt)?`상한 Lv.${GT.slotLvMax}`:'🪙 '+fmt(cost)}</b></div>`;
}
function slotNoteHTML(pt){
  return `<div class="gd-opt"><span>◆</span><span>슬롯 1레벨당 이 부위 장비의 공격력·체력·실드 +${GT.slotStep*100}% (상한 Lv.${GT.slotLvMax} · PLAN §11.4)</span></div>`;
}
function slotUpgradeHTML(pt){ return slotCostHTML(pt)+slotNoteHTML(pt); }
function openGearDetail(u){
  const g=invById(u);
  if(!g){ closeOverlay(); return; }
  /* ⚑ T125 ①-c — 한 번 열어 봤으면 «NEW» 는 지운다.
     ⚑⚑⚑ T128 — 여기서 `renderGear()` 까지 해야 한다. 모델에서만 지우면 **뒤에 깔린 인벤 격자는 옛 HTML 그대로**라
     NEW 뱃지가 화면에 남는다(«닫기» 로 닫으면 아무도 다시 그리지 않는다 — `closeOverlay()` 는 오버레이만 비운다).
     장착·해제·슬롯 강화 경로는 각자 `renderGear()` 를 부르고 있어 이 한 갈래만 어긋나 있었다.
     격자는 `#overlay` 와 다른 컨테이너라 팝업이 열린 채 다시 그려도 무해하다(슬롯 강화 경로가 이미 그렇게 한다). */
  if(g.nw){ delete g.nw; persist(); renderGear(); }
  const lv=save.slots[g.part]|0, cost=GT.slotCost(lv), eqd=isEquipped(g);
  /* ⚑ T116 U02 — 레퍼런스 `장비 세부팝업.jpg` 의 구조로 재배치한다(두 비평가 공통 «가장 효과 큰 수정 2개» 중 하나):
     등급 배지가 상자 윗변에 걸치고 → 좌상 정사각 아이콘 + 오른쪽 이름줄·메타줄 2단 헤더 →
     스탯 섹션 → 옵션 목록(넘치면 목록 «안에서만» 스크롤) → 비용줄 → 버튼 2개, 닫기는 상자 밖.
     종전은 한 줄로 흘러 버튼줄이 y83.7 = 상자 밖으로 나가 **화면에 렌더되지 않았다.** */
  openOverlay(`<div class="gd-badge" style="background:${GT.rarColor[g.rar]}">${GT.rarName[g.rar]}</div>
    <div class="gd-head">
      <div class="gd-ic">${gearIcon(g.type)}</div>
      <div class="gd-headtx">
        <div class="gd-name" style="color:${GT.rarColor[g.rar]}">${gearName(g)}${g.plus?` +${g.plus}`:''}</div>
        <div class="gd-meta"><span>${GT.partName[g.part]}</span><span style="color:${GT.setColor[GT.setOf(g.type)]}">${GT.lineName[g.type]} 세트</span><span>슬롯 Lv.${lv}</span></div>
      </div>
    </div>
    <div class="gd-stats">${gearContribHTML(g)}</div>
    <div class="gd-opts">
      ${eqd?slotNoteHTML(g.part):''}
      <div class="gd-secname">세트 옵션 (${GT.optCount(g.rar,g.plus)}/${GOPT[g.type].length} 해금)</div>
      ${optRowsHTML(g)}
    </div>
    <div class="gd-cost">${eqd?slotCostHTML(g.part):''}</div>
    <div class="gd-row">
      ${eqd
        ? `<button id="gdUneq">해제</button><button class="gold" id="gdUp" ${save.gold<cost||slotMaxed(g.part)?'disabled':''}>${slotMaxed(g.part)?'슬롯 MAX':'슬롯 강화 🪙'+fmt(cost)}</button>`
        : `<button class="gold" id="gdEq">장착</button>`}
    </div>`,
    {cls:'ov-gear', out:`<button class="ghost-btn" id="gdClose">닫기</button>`});
  if(eqd){
    $('gdUneq').onclick=()=>{ AU.play('click'); delete save.eq[g.part]; persist(); closeOverlay(); renderGear(); };
    $('gdUp').onclick=()=>{
      const c=GT.slotCost(save.slots[g.part]|0);
      if(save.gold<c||slotMaxed(g.part)) return;
      AU.play('coin'); save.gold-=c; save.slots[g.part]=(save.slots[g.part]|0)+1; persist(); openGearDetail(u); renderGear();
    };
  }else{
    $('gdEq').onclick=()=>{ AU.play('click'); save.eq[g.part]=g.u; delete g.nw; persist(); closeOverlay(); renderGear(); };
  }
  $('gdClose').onclick=()=>{ AU.play('click'); closeOverlay(); };
}
/* 빈 부위를 눌렀을 때 — 슬롯 강화만 가능 */
function openSlotDetail(pt){
  const lv=save.slots[pt]|0, cost=GT.slotCost(lv);
  openOverlay(`<div class="ov-banner" style="font-size:22px">${GT.partName[pt]} 슬롯</div>
    <div class="ov-sub">장착된 장비가 없습니다</div>
    <div style="width:100%;text-align:left">${slotUpgradeHTML(pt)}</div>
    <div class="gd-row"><button class="gold" id="gdUp" ${save.gold<cost||slotMaxed(pt)?'disabled':''}>${slotMaxed(pt)?'슬롯 MAX':'슬롯 강화 🪙'+fmt(cost)}</button></div>
    <button class="ghost-btn" id="gdClose">닫기</button>`);
  $('gdUp').onclick=()=>{
    const c=GT.slotCost(save.slots[pt]|0);
    if(save.gold<c||slotMaxed(pt)) return;
    AU.play('coin'); save.gold-=c; save.slots[pt]=(save.slots[pt]|0)+1; persist(); openSlotDetail(pt); renderGear();
  };
  $('gdClose').onclick=()=>{ AU.play('click'); closeOverlay(); };
}

/* ================= 상점 화면 (PLAN §11.2·§11.5) ================= */
/* 모의 결제 — 실결제 없음. 주인 확정 상수 1종만 둔다(PLAN §11.5).
   추가 가격대는 주인이 정하지 않았으므로 임의로 만들지 않는다(ROUTINE §1 «새 콘텐츠 임의 추가 금지»). */
const GEM_PACKS=[
  {gem:GT.iapGem, won:110000, nm:'다이아 금고'},
];
const today=()=>new Date().toISOString().slice(0,10);
/* 상점 안내문의 확률 줄 — 손으로 베끼지 않고 상자의 rate 에서 만든다 (T65).
   높은 등급부터 «신화 0.8% · 전설 4% · …» 순. 소수 0 은 떼고 찍고(2.0% 가 아니라 2%),
   ⚑ T153 — **0% 등급은 아예 안 적는다**(희귀 상자에 «신화 0%» 를 적으면 있는 것처럼 읽힌다). */
function gachaRateText(box){
  box=box||GT.boxes.myth;
  return box.rate.map((v,i)=>({v:+v,i})).filter(o=>o.v>0).reverse()
    .map(o=>`${GT.rarName[o.i]} ${o.v}%`).join(' · ');
}
/* 상자의 천장 안내 — ⚑ T125 ①-b 문구 규약(«신화 확정까지 N회» · «전설 확정까지 N회»)을 그대로 쓰되,
   ⚑ T153 로 상자마다 있는 천장만 적는다(희귀 상자는 천장이 없어 줄이 없다). N 은 상자 상수에서 읽는다. */
function pityText(box,st){
  const out=[];
  if(box.pityM>0)   out.push(`신화 확정까지 <b>${Math.max(0,box.pityM-st.p50)}</b>회`);
  if(box.pityL>0) out.push(`전설 확정까지 <b>${Math.max(0,box.pityL-st.p10)}</b>회`);
  out.push(`누적 ${fmtQty(st.pulls)}회`);
  return out.join('<br>');
}
/* 상자 한 칸 — 3상자가 같은 함수를 쓴다(칸을 손으로 세 번 적으면 확률·가격이 갈라진다). */
function gachaCardHTML(box,st){
  const one=box.cost, ten=box.cost*10;
  return `<div class="gacha-card gb-${box.key}">
      <div class="ttl">${box.name}</div>
      <div class="pity">${gachaRateText(box)}<br>${pityText(box,st)}</div>
      <div class="gacha-btns">
        <button id="pull1_${box.key}" ${save.gem<one?'disabled':''}>1회 💎${fmtQty(one)}</button>
        <button id="pull10_${box.key}" ${save.gem<ten?'disabled':''}>10회 💎${fmtQty(ten)}</button>
      </div>
    </div>`;
}
function renderShop(){
  renderTopBars();
  const canFree=save.freeDay!==today();
  $('shopBody').innerHTML=`
    <div class="shop-sec">🎁 무료 보급</div>
    <div class="free-row">
      <div class="gem-card">
        <div class="amt">💎 ${fmtQty(GT.dailyGem)}</div>일일 무료
        <button id="freeBtn" ${canFree?'':'disabled'}>${canFree?'수령':'완료'}</button>
      </div>
      <div class="gem-card lock"><div class="amt">🔒</div>추가 보급 (준비 중)</div>
    </div>
    <div class="shop-sec">💎 다이아 (모의 결제 — 실결제 없음)</div>
    <div class="gem-grid">${GEM_PACKS.map((p,i)=>
      `<div class="gem-card"><div class="amt">💎 ${fmtQty(p.gem)}</div>${p.nm}
        <button data-p="${i}">₩${fmtWon(p.won)}</button></div>`).join('')
      /* ⚑ 레퍼런스 그리드는 3열 2행(6칸)이다. 상품 종류를 늘리는 것은 새 콘텐츠(§1)라 나머지는 잠금 칸으로
         «형태만» 채운다 — 눌리지 않고 아무 일도 안 한다. 주인이 상품을 정해 주시면 그 자리에 들어간다. */
      +Array.from({length:Math.max(0,6-GEM_PACKS.length)},()=>
      `<div class="gem-card lock"><div class="amt">🔒</div>준비 중</div>`).join('')}</div>
    <div class="shop-sec tight">⚔️ 장비 뽑기</div>
    <!-- ⚑⚑⚑ T153 (주인 18:1X) — 상자 3종(희귀 · 전설 · 신화). 확률·가격·천장 문구는 전부 GT.boxes 에서
         읽는다(하드코딩 금지 — 게이트가 문구 ↔ 상수를 대조한다). ⚑ T125 ①-b 천장 문구 규약은 그대로. -->
    ${['rare','legend','myth'].map(k=>gachaCardHTML(GT.boxes[k],save.gachaBoxes[k])).join('')}`;
  $('freeBtn').onclick=()=>{
    if(save.freeDay===today()) return;
    AU.play('coin'); save.gem+=GT.dailyGem; save.freeDay=today(); persist(); renderShop();
    toast(`💎 ${fmtQty(GT.dailyGem)} 수령!`);
  };
  for(const k of ['rare','legend','myth']){
    $('pull1_'+k).onclick=()=>doPull(1,k);
    $('pull10_'+k).onclick=()=>doPull(10,k);
  }
  $('shopBody').querySelectorAll('.gem-card button[data-p]').forEach(b=>b.onclick=()=>{
    const p=GEM_PACKS[+b.dataset.p];
    AU.play('coin'); save.gem+=p.gem; persist(); renderShop();
    toast(`💎 ${fmtQty(p.gem)} 지급 (모의 결제)`);
  });
}
/* ⚑⚑⚑ T153 — 어느 상자를 뽑았는지(`boxKey`)를 받는다. 가격·확률·천장·피티 카운터가 전부 상자별이다. */
function doPull(n,boxKey){
  boxKey=boxKey||'myth';
  const box=GT.boxes[boxKey], st=save.gachaBoxes[boxKey];
  const cost=box.cost*n;
  if(save.gem<cost){ toast('💎 다이아가 부족합니다'); return; }
  AU.play('coin'); save.gem-=cost;
  const got=[];
  /* ⚑ T125 — 한 회차가 2개를 줄 수 있다(신화 천장 × 전설 피티 겹침). 10연차면 결과가 11개로 뜬다. */
  for(let i=0;i<n;i++){
    for(const raw of gachaPull(st,box)){
      const g=newGear(raw.part,raw.type,raw.rar,raw.plus);
      g.nw=1;                                  /* ⚑ T125 ①-c — «NEW» 뱃지(세부 팝업을 열면 지워진다) */
      save.inv.push(g); got.push(g);
    }
    save.pulls++;
  }
  /* ⚑⚑⚑ T125 ①-c (주인 21:2X «뽑기만 하고 장착 안 했는데 자동 장착되는 거 안 되게») —
     여기 있던 `autoEquipBest()` 를 없앴다. 뽑은 장비는 인벤에만 들어가고 장착은 장비 탭에서 유저가 한다. */
  persist(); renderShop();
  const best=got.reduce((a,b)=>gearScore(b)>gearScore(a)?b:a);
  AU.play(best.rar>=GT.RAR_LEGEND?'levelup':'perk');
  openOverlay(`<div class="ov-banner" style="font-size:24px">🎁 ${box.name} ${n}회${got.length>n?` · <b style="color:var(--gold)">${got.length}개</b>`:''}</div>
    <div class="ov-sub">최고 등급 <b style="color:${GT.rarColor[best.rar]}">${GT.rarName[best.rar]}</b> · 인벤토리에 담겼습니다 — 장착은 ⚔️ 장비 탭에서</div>
    <div class="pull-list">${got.map(g=>
      `<div class="inv-cell" style="border-color:${GT.rarColor[g.rar]};box-shadow:0 0 9px ${GT.rarGlow[g.rar]};background:linear-gradient(${GT.rarColor[g.rar]}55,${GT.rarColor[g.rar]}22)">`+
      `<span class="ptag" style="background:${GT.rarColor[g.rar]}">${GT.partName[g.part]}</span>${gearIcon(g.type)}</div>`).join('')}</div>
    <div style="font-size:12.5px;color:var(--ink-dim);line-height:1.5">${got.map(g=>`${GT.rarName[g.rar]} ${GT.typeName[g.type]}`).join(' · ')}</div>
    <button class="ghost-btn" id="pullClose">닫기</button>`,{rays:best.rar>=GT.RAR_LEGEND});
  $('pullClose').onclick=()=>{ AU.play('click'); closeOverlay(); renderShop(); };
}

/* 로비 디오라마 & 아바타 */
function hash(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function drawDiorama(){
  const cvd=$('dioCv'), d=window.devicePixelRatio||1;
  const w=cvd.clientWidth,h=cvd.clientHeight;
  if(w===0) return;
  cvd.width=w*d; cvd.height=h*d;
  const c=cvd.getContext('2d'); c.setTransform(d,0,0,d,0,0);
  const ch=save.selChapter;
  const hues=[[87,150,74],[74,140,120],[100,120,60],[60,110,140]];
  const base=hues[(ch-1)%hues.length];
  c.fillStyle=`rgb(${base[0]},${base[1]},${base[2]})`; c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<5;i++){ c.beginPath(); c.arc(hash(ch*10+i)*w,hash(ch*20+i)*h,18+hash(ch*3+i)*20,0,7); c.fill(); }
  for(let i=0;i<3;i++){
    const x=w*(0.2+hash(ch*7+i)*0.6), y=h*(0.28+hash(ch*11+i)*0.34);
    c.fillStyle='#6B4A2B'; c.fillRect(x-4,y,8,22);
    c.fillStyle='#4E8C3B';
    c.beginPath(); c.arc(x,y-8,20,0,7); c.arc(x-13,y+2,13,0,7); c.arc(x+13,y+2,13,0,7); c.fill();
    c.fillStyle='rgba(255,255,255,.12)'; c.beginPath(); c.arc(x-6,y-14,7,0,7); c.fill();
  }
  for(let i=0;i<2;i++){
    const x=w*(0.15+hash(ch*13+i)*0.7), y=h*(0.62+hash(ch*17+i)*0.2);
    c.fillStyle='#B9C2CA'; c.beginPath(); c.ellipse(x,y,17,12,0,0,7); c.fill();
    c.fillStyle='#98A2AB'; c.beginPath(); c.ellipse(x-4,y+2,10,7,0,0,7); c.fill();
  }
  for(let i=0;i<3;i++){
    const x=w*(0.1+hash(ch*23+i)*0.8), y=h*(0.75+hash(ch*29+i)*0.15);
    c.fillStyle='#5E9C3B'; c.beginPath(); c.arc(x,y,11,0,7); c.arc(x+10,y+2,8,0,7); c.fill();
  }
  if(ch>=3){ c.font='22px serif'; c.fillText('💀', w*0.78, h*0.4); }
}
/* ⚑ T116 U02 — 로비뿐 아니라 장비·상점 상단 바에도 같은 아바타가 있다(모든 탭의 상단 바가 같은 모양).
   숨은 화면의 캔버스는 clientWidth 0 이라 그 탭을 열 때 다시 그린다(renderTopBars 가 매번 부른다). */
function drawAvatar(){
  const d=window.devicePixelRatio||1;
  document.querySelectorAll('.avatar-box').forEach(a=>{
    const w=a.clientWidth||52;
    a.width=w*d; a.height=w*d;
    const c=a.getContext('2d'); c.setTransform(d*w/60,0,0,d*w/60,0,0);
    c.fillStyle='#5B87C7'; c.fillRect(0,0,60,60);
    drawCharOn(c,30,56,{s:1.15,f:1,body:'#5E6A75',hat:'helmet'});
  });
}

/* ================= 버프/스탯 엔진 (sim.js 와 1:1) ================= */
/* 발동 확률 (🌪️ 폭풍의 힘이면 1.22배 — sim.js pkk()) */
function pkk(p,ch){ return Math.random() < ch*(p.px.procX2?1.22:1); }
/* src = 이 버프를 준 px 키(주인 지시 07:0X «발동 중 버프 아이콘» 전용 표시 정보).
   sim.js 는 표시가 없어 5인자 그대로다 — 6번째 인자는 수치·판정에 일절 관여하지 않는다. */
let buffSeq=0;   /* q = 발동 순번 — 버프 아이콘을 «오래된 것이 위» 로 쌓는 기준 */
/* ⚑ 주인 확정(2026-09-03) — 시간제 버프의 중첩 상한 전부 삭제(무한 중첩). sim.js addBuff 와 1:1. */
function addBuff(p,k,amt,dur,src){
  p.buffs[k].push({t:dur,amt,src,q:++buffSeq});
  renderStatsGrid(); renderBuffBar();
}
/* ⚑ T121 «갱신형» 버프 한 곳 — 같은 태그의 기존 항목을 지우고 새로 넣는다(중첩 없이 «시간만 갱신»).
   무한 중첩이 기본인 `addBuff` 와 달리 항상 1개만 남는다 — 주인 «스택 아님». sim.js refreshBuff 와 1:1
   (`src`·`q` 는 버프 아이콘 표시 전용이라 수치·판정에 관여하지 않는다). */
function refreshBuff(p,k,amt,dur,tag){
  const arr=p.buffs[k];
  for(let i=arr.length-1;i>=0;i--) if(arr[i].tag===tag) arr.splice(i,1);
  arr.push({t:dur,amt,tag,src:tag,q:++buffSeq});
  renderStatsGrid(); renderBuffBar();
}
function bsum(p,k){ let s=0; for(const b of p.buffs[k]) s+=b.amt; return s; }
/* 🃏 수집가 4종 — «보유한 특전 1개당». 실효 스탯에서 매번 세므로 나중에 얻는 특전까지 소급된다. */
function effDmg(p){
  const px=p.px; let m=1+bsum(p,'atk');
  if(px.rage&&p.sh<=0) m*=1.5;                       /* 장비 옵션 */
  if(px.p_collAtk) m*=1+PERK_COLL_ATK*perkCountOf(p);   /* ⚑ T121 수집가·공격 — 보유 특전 하나당 +4% (곱연산) */
  /* ⚑ T121 3차 «실드 없을 때 공격력»(주인 확정 18:2X) — 실드가 0 인 동안만, 실드가 다시 생기면 꺼진다 */
  if(px.p_noShAtk&&p.sh<=0) m*=PERK_NOSH_ATK;
  return p.dmg*m;
}
/* ⚑ T121 3차 «실드 없을 때 공속» — 위와 같은 상시 조건부(곱연산) */
function effAspd(p){ return p.aspd*(1+bsum(p,'aspd'))*(p.px.p_noShAspd&&p.sh<=0?PERK_NOSH_ASPD:1); }
/* ⚑ T119 광전사(전설 6) — 치명타 확률을 **0 으로 고정**한다(치확 +10 특전·버프·장비 옵션이 있어도 0).
   sim.js effCritR 와 1:1 — 여기 한 자리에서 막으므로 «치명타 시» 트리거도 함께 죽는다. */
/* ⚑ T121 — 수집가·치명(보유 특전 하나당 +2, 가산)과 치명 스택(평타 적중 누적)이 여기서 합쳐진다.
   광전사는 종전대로 이 한 자리에서 전부 0 으로 눌러 «치명타 시» 트리거까지 함께 죽인다. sim.js 와 1:1. */
function effCritR(p){
  const px=p.px; if(px.p_berserk) return 0;
  let c=p.critR+bsum(p,'critR');
  if(px.p_collCrit) c+=PERK_COLL_CRIT*perkCountOf(p);
  if(px.p_critStack) c+=p.critStk;
  return c;
}
function effCritF(p){ return p.critF+bsum(p,'critF'); }
function effDef(p){ return Math.min(80,p.def+bsum(p,'def')); }
function effEvade(p){
  const px=p.px; let e=p.evade+bsum(p,'evade');
  if(px.lastStand&&p.hp<=p.maxHp*0.10) e+=40;        /* 장비 옵션 */
  return Math.min(90,e);
}
function effCounter(p){ return p.counter; }
/* ⚑ T154 — 흡혈은 버프·특전 축이 없고 장비 옵션 7번(신화 +6강 · T145)만 올린다. 그 옵션은 `playerBase()`
   에서 GOPT 7번 칸이 부위마다 8씩 더해 이미 들어가 있으므로 실효값 = `p.steal` 이다. **표시 전용 별칭이 아니라**,
   나머지 7종과 같은 이름 규약(`effXxx`)을 지켜 스탯 그리드·특전 선택창 상단 줄이 «같은 동사» 를 쓰게 한다.
   (전투 회복은 종전대로 `dealDmg` 의 `p.steal` 한 곳에서만 계산한다 — 엔진 무수정.) */
function effSteal(p){ return p.steal; }
/* ⚑ 실드 수리 한 곳 — 🔧 «실드 수리 효과 +100%» 가 여기서만 걸린다 (sim.js repair 와 1:1) */
function repair(p,amt){ if(amt<=0) return; p.sh=Math.min(p.maxSh,p.sh+amt*(1+p.repairAmp)); }
/* sim.js heal(p,amt,noBoost) 와 1:1 */
function heal(p,amt,noBoost){
  const px=p.px;
  if(!noBoost){
    amt*=1+p.healAmp;
    if(px.healBoost2&&pkk(p,0.20*px.healBoost2)) amt+=p.maxHp*0.02;
  }
  const over=Math.max(0,p.hp+amt-p.maxHp);
  const before=p.hp;
  p.hp=Math.min(p.maxHp,p.hp+amt);
  /* ⚑ T121 희귀 «회복 시 수리» — «힐 시 같은 양만큼 실드도 수리»(수리 증폭은 `repair` 가 건다).
     «같은 양» = 실제로 체력에 들어간 회복량(최대치 초과분 제외). 주인 문면이 «회복 시» 라 증폭 분기 밖에
     둔다 — 회피 시 회복·생명 흡수 같은 `noBoost` 회복도 «회복» 이다. sim.js heal 과 1:1. */
  if(px.p_healRepair&&p.hp>before) repair(p,p.hp-before);
  if(!noBoost){
    if(px.healDefBuff&&pkk(p,0.30*px.healDefBuff)) addBuff(p,'def',5*px.healDefBuff,3,'healDefBuff');
    if(px.healShield3&&pkk(p,0.20*px.healShield3)){ repair(p,p.maxSh*0.03); addText('💦','#6CC0F0'); }
    if(px.healShield5&&pkk(p,0.30*px.healShield5)){ repair(p,p.maxSh*0.08); addText('💦','#6CC0F0'); }
    if(px.healAtkBuff) addBuff(p,'atk',0.08,3,'healAtkBuff');
    if(over>0){
      if(px.overheal) repair(p,over*7);
      if(px.overBolt&&p.G.overBoltCd<=0){ p.G.overBoltCd=0.12; fireBolts(p,1); }
    }
  }
}

   지금은 풀도 10·획득도 10 이라 동작 불변이고, 나중에 풀만 늘려도 «한 런 = 10개» 면 파워 총량이 그대로다.
   ⚑ 챕터 레벨업 횟수(T100 = 10)와 반드시 같아야 한다. */
const PERK_PICKS=10;
/* ⚑⚑⚑ T117 (주인 확정 2026-09-04 12:3X) — 레벨업 특전이 «3개 중 1개 선택» 으로 돌아왔다.
   T96 이 폐지한 것 중 **선택창만** 돌아오고 등급·등장 확률·무료 새로고침·전지의 눈은 그대로 폐지다.
   sim.js 와 같은 이름·같은 값·같은 동사(게이트가 두 엔진을 대조한다). */
const PERK_OFFER=3;
/* 등급이 폐지돼 카드 색·태그가 하나다. 천사의 축복처럼 «특전이 아닌 획득물» 도 같은 카드를 쓴다. */
const PERK_COLOR='#FFB92E';
/* ⚑ 순번은 «획득 목록의 길이» 가 아니라 «그중 진짜 특전의 수» 다 — 천사의 축복처럼 PERKS 밖의 항목도
   같은 목록에 쌓이므로(미리보기 줄·책이 함께 보여 준다) 길이로 세면 축복 한 번에 특전 하나를 건너뛴다.
   sim.js 는 `G.taken` 에 특전만 넣으므로 그쪽은 길이로 세도 같은 결과다. */
function perkOrderN(){ let n=0; for(const q of G.perksTaken) if(PERKS.includes(q)) n++; return n; }
/* ⚑ T117 — 제시 카드 3장: «아직 안 얻은 것만 · 한 장 안에서 중복 없음 · 남은 것이 3 미만이면 그만큼».
   ⚑⚑⚑ T151 (주인 확정 2026-09-05 17:5X) — **3장은 전부 같은 등급이다**(«섞어 뜨지 말고»). 등급은
   레벨업마다 **딱 한 번** PERK_GRADE_RATE(60/25/15)로 굴리고 그 등급의 남은 특전 중 3장을 뽑는다.
   T119 의 «카드마다 등급 굴림» 은 폐기됐다. 그 등급에 3장이 안 남았으면 남은 만큼(1~2장)만,
   0장이면 가중치가 0 이라 남은 등급들로 재정규화돼 다시 굴린다. «귀족의 눈»(noble)이면 일반을 뺀다
   (가중치를 그대로 두고 일반만 빼면 희귀 25/40 = 62.5% · 전설 15/40 = 37.5% 로 자동 재정규화된다).
   sim.js offerPerks(taken,noble) 와 1:1(같은 이름·같은 본문 — 게이트가 두 엔진을 대조한다). */
function offerPerks(taken,noble){
  const cand=PERKS.filter(p=>taken.indexOf(p)<0);
  if(!cand.length)return [];
  const w=PERK_GRADE_RATE.map((r,g)=>(cand.some(p=>p.g===g)?r:0));
  if(noble&&(w[1]||w[2])) w[0]=0;
  const tot=w[0]+w[1]+w[2];
  let r=Math.random()*tot, g=0;
  for(g=0;g<3;g++){ if(r<w[g])break; r-=w[g]; }
  if(g>2||!w[g]){ g=2; while(g>0&&!w[g])g--; }
  const pool=cand.filter(p=>p.g===g), out=[];
  for(let i=0;i<PERK_OFFER&&pool.length;i++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}
/* ⚑⚑⚑ T150 (주인 확정 2026-09-05 17:4X) — **악마의 거래는 3택이 아니다.**
   주인 원문: «악마 거래는 전설 꺼 1개만 두고 hp 소모되면서 가져가는 거로 되야 되는데 3개 특전 주네».
   악마는 «아직 안 얻은 **전설** 특전 중 무작위 1개» 한 장만 내놓는다 — 고르는 것이 없으므로
   시뮬 정책(`simPickPerk`)도 필요 없고, 시뮬은 게임과 **같은 무작위 1장**을 받는다(판 난수 · 시드 결정적).
   남은 전설이 없으면 null → 거래 불성립(카드도 비용도 없다 — 종전 «줄 특전이 없으면 성립 안 함» 그대로).
   등급 굴림(PERK_GRADE_RATE)·귀족의 눈은 여기에 걸리지 않는다 — 악마 몫은 원래 전설 고정이다.
   sim.js 와 같은 이름·같은 본문(게이트 verifyDevilPolicy·verifyPerkOrder 가 두 엔진을 대조한다). */
const PERK_DEVIL_GRADE=2;
function offerDevilPerk(taken){
  const pool=PERKS.filter(p=>p.g===PERK_DEVIL_GRADE&&taken.indexOf(p)<0);
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

   ⚑ 난수를 쓰지 않는다 — «있나» 를 묻는 자리에서 카드를 뽑아 버리면 굴림이 두 번 일어난다. */
function perksLeftN(){ let n=0; for(const p of PERKS) if(G.perksTaken.indexOf(p)<0) n++; return n; }
function hasPerkLeft(){ return perkOrderN()<PERK_PICKS && perksLeftN()>0; }

  const before=Object.assign({},G.player.px);
  perk.ap(G.player);

     장비 옵션(GOPT)이 올린 키는 특전이 아니므로 여기 등록되지 않고, 아이콘은 스탯 기본형으로 뜬다. */
  for(const k in G.player.px) if(G.player.px[k]!==before[k]) G.pxPerk[k]=perk;

/* ⚑ 악마의 거래 비용 (PLAN §2.4 · 주인 확정 2026-09-03 · T90) — «최대체력의 30% 를 **최대치에서** 깎는다».
   현재체력에서 깎던 종전 구현은 폐기 — 그 판 동안 최대체력 자체가 줄어든 채 진행한다.
   현재체력이 새 최대치를 넘으면 최대치로 클램프(위임 — 풀충전이 아니라 내림 클램프다).
   sim.js 와 같은 이름·같은 값이어야 한다
   (게이트 tools/verifyDevilPolicy.js 가 두 엔진을 대조하고 실측으로도 단언한다). */
const DEVIL_COST=0.30;
function payDevilCost(p){
  p.maxHp=Math.max(1,p.maxHp-p.maxHp*DEVIL_COST);
  p.hp=Math.min(p.hp,p.maxHp);
  return p.maxHp;
}
/* ⚑ 주인 확정 제약 (PLAN §2.4, 2026-09-02 14:2X) — 전 500 챕터 공통 (⚑ T102 로 300 → 500):
   ① 적 총 수 ≤ LAYOUT_MAXENEMY ② 쉼터 고정 ③ 악마 정확히 1 ④ 천사 정확히 1.
   가중치(45/30/25) 배치는 폐기 — 악마1·천사1 을 먼저 깔고 남는 슬롯을 전부 쉼터로 채운 뒤 순서만 시드 셔플한다. */
const LAYOUT_MAXENEMY=50;   /* ⚑⚑⚑ T107 주인 확정 — 80 → 50 (상한 · «50마리 넘으면 피로하다»). T100 의 76 고정 폐기 */
/* ⚑ 고정 구성 — 웨이브 5개 · 쉼터 2 (전 챕터 동일). sim.js 와 같은 값. */
const LAYOUT_WAVES=5, LAYOUT_RESTS=2;
/* ⚑⚑⚑ T107 (주인 확정 2026-09-03 17:3X) — **챕터별 적 수 곡선**. 주인 원문: «적수를 1챕터~5까지 17마리,
   6챕터부터 1 올라갈 때마다 1개씩 추가, 그리고 적 개수 50개 되면 더이상 안 올리기».
     N(c) = c ≤ 5 ? 17 : min(50, 17 + (c − 5))   — 챕터 6 = 18 · … · **38 부터 50 고정**
   «17» 은 보스 포함 총 수라 일반 적은 N − 1 이고, 웨이브 5개에 균등 분배(나머지는 앞 웨이브부터).
   sim.js 와 같은 함수·같은 값 — 게이트 verifyChapterFixed 가 두 엔진을 전수 대조한다. */
const ENEMY_CURVE={early:17, from:6, cap:50};
function chapterEnemyCount(c){
  return c<ENEMY_CURVE.from ? ENEMY_CURVE.early
       : Math.min(ENEMY_CURVE.cap, ENEMY_CURVE.early+(c-(ENEMY_CURVE.from-1)));
}
function chapterWaveSizes(c){
  const n=chapterEnemyCount(c)-1, b=Math.floor(n/LAYOUT_WAVES), r=n%LAYOUT_WAVES, out=[];
  for(let i=0;i<LAYOUT_WAVES;i++) out.push(b+(i<r?1:0));   /* 나머지는 앞 웨이브부터 */
  return out;
}
/* ⚑⚑⚑ T114 (주인 확정 2026-09-04 03:4X) — **원거리 마릿수 곡선** (sim.js 와 같은 이름·같은 값·같은 순서).
   주인 원문: «챕터 4까지는 원거리 아예 없고 5부터 원거리 1마리씩 추가하고 30퍼 비율 될 때까지 한 마리씩
   늘린 다음에 30퍼에서 플러스 마이너스 2로 묶으까?» — T105 의 «각 적 40% 독립 굴림» 은 폐기됐다.
     E(c) = N(c) − 6(굴림 대상) · B(c) = round(0.30·E) · j ∈ {−2..+2}(챕터 시드)
     R(c) = c ≤ 4 ? 0 : (c−4 ≤ B(c) ? c−4 : max(0, B(c)+j(c)))   — 램프(5~9)는 흔들림 없이 정확히 +1
   `chapterLayout` 안에서만 쓴다 — 웨이브 생성부에서 다시 굴리면 챕터별 고정이 깨진다. */
const RANGED_CURVE={zeroUntil:4, rate:0.30, jitter:2};
function chapterRangedPool(c){ return chapterEnemyCount(c)-1-LAYOUT_WAVES; }
function chapterRangedBase(c){ return Math.round(RANGED_CURVE.rate*chapterRangedPool(c)); }
function chapterRangedCount(c,jit){
  if(c<=RANGED_CURVE.zeroUntil) return 0;
  const ramp=c-RANGED_CURVE.zeroUntil, B=chapterRangedBase(c);
  return ramp<=B ? ramp : Math.max(0,B+jit);
}
/* ⚑ 쉼터 보상 (PLAN §2.4 · 주인 확정 2026-09-02 17:1X · T49) — «❤️ 체력 260 회복(고정값)» vs «🌟 경험치 +26».
   고정값이라 최대체력 비율로 되돌리지 말 것. sim.js 와 이름·값이 같아야 한다(게이트 verifyRestPolicy). */

   튜닝 노브가 아니다. 적중률(명중) 스탯·특전·장비 옵션·버프는 이 게임에 존재 금지(흡혈 증가 금지와 같은 축).
   적용: 기본공격 · 소환 5종 · 반격. 제외(위임): 가시 반사·오발 화살 — PROGRESS T43 근거. */
const ENEMY_EVADE=0.10;

const STUN_BOSS_MUL=1/3;
/* ⚑ T48 3단계 — 횟수형 방어막(주인 17:2X) · 회피 즉사(주인 16:5X). sim.js 와 같은 값(게이트가 대조). */
/* ⚑ 주인 확정 소환 데미지 상수 (PLAN §3.0) — 튜닝으로 계수 변경 금지. sim.js 와 같은 값.
   ⚑⚑⚑ T118 (주인 확정 2026-09-04 12:4X) — 화살 0.50 → 0.30 · 도끼 0.30 → 0.50 맞교환. */
const R_AXE=0.50, R_ARROW=0.30, R_WAVE=0.50, R_BOLT=0.75, R_SPEAR=1.00;
const WAVE_PIERCE=2, WAVE_PIERCE_BIG=8, SPEAR_PIERCE=8;
/* ⚑ T96 — 주기 소환·공속 램프·오버킬 회복·반격 연쇄·등급 확률 상수는 특전 132종과 함께 폐지됐다.
   장비 옵션이 쓰는 `autoBolt`(3초 주기)만 남는다. sim.js 와 1:1. */
/* ⚑ 방어막(ward)은 장수 상한이 없다(주인 확정 «무한»). */
function chapterLayout(c){
  /* ⚑⚑⚑ T107 (주인 확정 2026-09-03 17:3X) — 챕터별 적 수 곡선 위의 고정 구성 (sim.js chapterLayout 과 1:1):
       웨이브 5개(크기는 `chapterWaveSizes(c)`) · 보스 1 → 적 **N(c)마리**(상한 LAYOUT_MAXENEMY 50)
       쉼터 2 (고정) · 악마 1 · 천사 1 — «순서» 만 챕터 시드로 섞인다.
     ⚑ 특전은 «그 챕터의 경험치가 주는 만큼»(주인 «특전은 걍 되는 만큼»). 처치 3·보스 9·쉼터 26×2·`5·Lv+1`
       은 불변이고 T100 의 «완주 = 정확히 10개» 항등식만 사라졌다 — 1~5챕터 6개 · 15 = 7 · 28 = 8 · 38+ = 9.
     ⚑ 적 «수» 는 난이도 노브가 아니다 — 난이도는 적 스탯(구간 성장률·벽 배수)으로만 만든다. */
  const rnd=mulberry(c*1013904223+77);
  const waveCount=LAYOUT_WAVES, sizes=chapterWaveSizes(c);
  const evs=['devil','angel'];                                  /* 악마 1 · 천사 1 */
  for(let i=0;i<LAYOUT_RESTS;i++) evs.push('rest');             /* 쉼터 2 고정 */
  for(let i=evs.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=evs[i]; evs[i]=evs[j]; evs[j]=t; }
  const out=[];
  /* 웨이브 5 · 이벤트 4 — «웨이브 뒤 이벤트» 를 이벤트가 떨어질 때까지 반복하면 마지막 웨이브가 보스 앞에 붙는다 */
  for(let i=0;i<waveCount;i++){ out.push({t:'wave',size:sizes[i]}); if(i<evs.length) out.push({t:evs[i]}); }
  out.push({t:'boss'});
  /* ⚑⚑⚑ T105(자리 고정) + ⚑⚑⚑ T114(마릿수 곡선) — ① 마릿수를 `chapterRangedCount` 로 정하고
     ② 그만큼을 굴림 대상(웨이브 첫 마리 제외)에서 챕터 시드로 뽑는다. sim.js 와 1:1.
     ⚑ 이벤트 셔플이 끝난 «뒤» 에 굴려야 기존 쉼터·악마·천사 순서가 안 바뀐다.
     ⚑ 흔들림 j 는 램프 구간에서도 항상 한 번 소비한다(소비 수가 챕터마다 달라지면 자리가 밀린다). */
  for(const nd of out) if(nd.t==='wave') nd.ranged=new Array(nd.size).fill(false);
  const jit=Math.floor(rnd()*(2*RANGED_CURVE.jitter+1))-RANGED_CURVE.jitter;
  const want=chapterRangedCount(c,jit);
  const pool=[];
  out.forEach((nd,i)=>{ if(nd.t==='wave') for(let j=1;j<nd.size;j++) pool.push([i,j]); });
  for(let i=pool.length-1;i>0;i--){ const k=Math.floor(rnd()*(i+1)); const t=pool[i]; pool[i]=pool[k]; pool[k]=t; }
  for(let q=0;q<want&&q<pool.length;q++){ const[i,j]=pool[q]; out[i].ranged[j]=true; }
  return out;
}
const ENEMY_SKINS=[
  {body:'#8A6B4F', hat:'cone',  weapon:'sword'},
  {body:'#7A7A85', hat:'bald',  weapon:'axe'},
  {body:'#6B7F5A', hat:'hood',  weapon:'sword'},
];
const RANGED_SKINS=[
  {body:'#5E7C8A', hat:'hood', weapon:'bow'},
  {body:'#8A6B4F', hat:'cone', weapon:'bow'},
];

function startChapter(c){
  const nodes=[]; let x=560, wi=0, totalEnemies=0;
  chapterLayout(c).forEach(nl=>{
    const type=nl.t;
    const node={type, x, done:false, enemies:[]};
    if(type==='wave'){
      const st=enemyStats(c,wi);
      for(let j=0;j<nl.size;j++){
        const ranged=nl.ranged[j];   /* ⚑ T105 — 챕터 시드로 이미 정해져 있다 (여기서 다시 굴리지 말 것) */
        node.enemies.push({
          worldX:x+j*88, hp:st.hp, maxHp:st.hp, dmg:st.dmg,
          ranged, atkTimer:rand(0.4,1.2), stun:0, slow:0, aggro:false, wave:node, dead:false,
          skin: ranged?pick(RANGED_SKINS):pick(ENEMY_SKINS),
          exp:TUNE.expKill, isBoss:false, bob:Math.random()*7, hitT:0, strikeT:0,
        });
      }
      totalEnemies+=nl.size; wi++; x+=(nl.size-1)*88+560;
    }else if(type==='boss'){
      const st=enemyStats(c,wi);
      const bh=Math.round(st.hp*TUNE.bossHp), bd=Math.round(st.dmg*TUNE.bossDmg);
      node.enemies.push({
        worldX:x+60, hp:bh, maxHp:bh, dmg:bd,
        ranged:false, atkTimer:1.2, stun:0, slow:0, aggro:false, wave:node, dead:false,
        skin:{body:'#5A3247', hat:'horns', weapon:'axe'},
        exp:TUNE.expBoss, isBoss:true, hits:0, bob:0, hitT:0, strikeT:0,
      });
      totalEnemies+=1;
    }else{ x+=470; }
    nodes.push(node);
  });
  G={
    chapter:c, t:0, kills:0, gold:0, killed:0, totalEnemies,
    player:playerBase(), nodes, arrows:[], texts:[], parts:[], reaps:[],
    pprojs:[], bolts:[], procN:0,
    paused:false, over:false, cleared:false, pendingLevels:0, perksTaken:[], shake:0, bossWarned:false,
    perkChances:0, overBoltCd:0, autoBoltT:3,
    miss:0,   /* 적 회피 10% 로 빗나간 횟수 (PLAN §2.3) */
    pxPerk:{},   /* px 키 → 그 키를 올린 특전 (발동 중 버프 아이콘이 «해당 특전» 을 찾는 용도) */
  };
  G.player.G=G;   /* sim.js 의 p.G 와 동일 — 특전 ap 본문이 p.G.perkChances 를 쓴다 */
  $('chapHudName').textContent='CHAPTER '+c;
  $('progIn').style.width='0%';
  lastBars='';
  showScreen('game'); closeOverlay();
  gameTopKey=''; syncGameTop(0,0);      /* 줄이 화면에 뜬 «뒤» 에 맞춘다 — 숨은 줄은 폭이 0 이라 못 잰다 */
  renderStatsGrid(); updateBars(); renderBuffBar(); renderPerkStrip();
}

function openOverlay(html,opts){
  opts=opts||{};

     `:nth-child(4·5·6)` 등장 지연이 한 칸씩 밀린다. 흐름 밖(절대 배치)이라 배너·카드 y 는 그대로다. */
  ov.innerHTML=(opts.stats?`<div class="ov-stats">${statRowHTML()}</div>`:'')
    +`<div class="ov-inner">${opts.rays?'<div class="rays"></div>':''}${html}</div>`

   📘 보유 특전 버튼(T89)은 «고르기 전에 내가 뭘 갖고 있나» 를 보는 자리라 3택 복구로 제 뜻을 되찾았다 —

   ⚑ 굴림(offerPerks)은 **paint 밖에서 딱 한 번**이다. paint 안에서 굴리면 책을 드나들 때마다 선택지가
   다시 굴려져 «무료 무한 새로고침» 이 된다(T89 가 못 박은 실패 경로 ②). */
function openLevelUp(){
  if(!hasPerkLeft()){ G.perkChances++; afterPerk(); return; }   /* 줄 것이 없다 — 팝업 없이 그냥 진행 */
  AU.play('levelup');
  G.perkChances++;
  const offer=offerPerks(G.perksTaken,!!G.player.px.p_nobleEye);   /* ⚑ 이 줄이 이번 레벨업의 유일한 굴림이다 (⚑ T119 — 등급 굴림 + 귀족의 눈) */
  const paint=()=>{
    openOverlay(`<div class="ov-banner">🎉 레벨 업!</div>
      <div class="ov-sub">특전 하나를 고르세요</div>
      ${offer.map((p,i)=>perkCardHTML(p,i,'pick')).join('')}
      <div class="ov-foot"><button id="perkBookBtn">📘<b>${G.perksTaken.length}</b><span class="sr-lbl">보유 특전</span></button></div>`,
      {rays:true,cls:'ov-full',stats:true});   /* ⚑ T154 — 상단 스탯 줄 8칸 */
    offer.forEach((p,i)=>{ $('perkPick'+i).onclick=()=>{ AU.play('click'); pickPerk(p); renderStatsGrid(); updateBars(); afterPerk(); }; });
    /* ⚑ stopPropagation 필수 — 이 클릭이 오버레이까지 거품처럼 올라가면 책이 깔아 둔 ov.onclick(=복귀)에
       걸려 열자마자 되돌아간다(T89 가 T3 실측으로 잡은 버그). */
    $('perkBookBtn').onclick=e=>{ e.stopPropagation(); openPerkBook(paint); };
  };
  paint();
}
function afterPerk(){
  renderStatsGrid(); updateBars();
  if(G.pendingLevels>0){ G.pendingLevels--; openLevelUp(); }
  else closeOverlay();
}
/* back 이 함수면 «특전 선택창에서 열린 책» 이다 — 닫으면 게임으로 나가는 게 아니라 선택창으로 돌아간다.
   (여기서 closeOverlay 를 부르면 레벨업 특전 선택을 통째로 날린다.) 평소(HUD 📘 버튼·미리보기 줄)엔
   인자가 없거나 클릭 이벤트가 들어오므로 «함수인가» 로만 판별한다. */
function openPerkBook(back){
  if(!G) return;
  AU.play('click');
  const ret=typeof back==='function'?back:null;
  const list=G.perksTaken.length
    ? G.perksTaken.map((p,i)=>perkCardHTML(p,i,'static')).join('')
    : `<div class="ov-sub" style="margin-top:20px">아직 획득한 특전이 없습니다</div>`;
  /* ⚑ T116 U02 — 인포 팝업은 «상자 y23 h52.5 + 윗변에 걸친 제목 리본» 규격(ov-book)이고,
     닫기 안내는 레퍼런스대로 상자 «밖» 아래(y91.5)에 놓는다. */
  openOverlay(`<div class="ov-banner">📘 PERKS</div>
    <div class="ov-sub">이번 원정에서 얻은 특전 (${G.perksTaken.length})</div>
    <div class="perk-list">${list}</div>`,
    {cls:'ov-book', stats:true,   /* ⚑ T154 — 📘 보유 특전 목록에도 같은 줄 (주인 지시 «위임») */
     out:ret?`<button id="pbBack">← 특전 선택으로</button>`
        :`<div class="tap-close">— 화면을 탭하면 닫힙니다 —</div>`});
  if(ret) $('pbBack').onclick=e=>{ e.stopPropagation(); AU.play('click'); ret(); };
  ov.onclick=()=>{ AU.play('click'); ret?ret():closeOverlay(); };
}

function addText(txt,color,wx,wy,big){

function sparks(wx,wy,color,n,spd){
  if(!G) return;
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), v=rand(40,spd||160);
    G.parts.push({x:wx,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rand(0.25,0.5),t:0,color,size:rand(2,4.5)});
  }
}
function poof(wx,wy){
  if(!G) return;
  for(let i=0;i<7;i++){
    const a=rand(0,Math.PI*2), v=rand(15,55);
    G.parts.push({x:wx,y:wy-20,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,life:rand(0.4,0.7),t:0,color:'rgba(230,230,235,',size:rand(6,11),puff:true});
  }
}

/* ⚑ T48 3단계 — 사신의 낫 전용 연출 (주인 16:5X 필수 지시).

   ① 큰 낫이 호를 그리며 한 번 훑고(reaps 가 그린다) ② 베인 자리에 붉은 참격선 ③ 검은 재가 흩어진다.

/* ================= COMBAT ================= */
function aliveEnemies(){
  const out=[];
  for(const n of G.nodes) for(const e of n.enemies) if(e.hp>0) out.push(e);
  return out;
}
/* 지금 «필드 위에» 있는 적이 속한 노드 = 플레이어가 상대하고 있는 최전방 노드. sim.js frontNode() 와 1:1.
   주인 확정 보강(15:2X): 관통형(창·검기)은 이 노드의 적만 맞는다 — 다음 웨이브 대기분은 절대 맞지 않는다.
   챕터의 적을 시작할 때 한꺼번에 만들어 두므로(노드 간격 560px, 창 사거리 88×8=704px) 필터가 없으면 꿰뚫린다. */
function frontNode(){ let b=null; for(const n of G.nodes) for(const e of n.enemies) if(e.hp>0&&(!b||e.worldX<b.worldX)) b=e; return b?b.wave:null; }
function randTarget(){
  const p=G.player;
  const pool=aliveEnemies().filter(e=>{const d=e.worldX-p.worldX; return d>-30&&d<540;});
  return pool.length?pick(pool):null;
}
/* ⚑ 주인 확정(2026-09-02 15:3X) — 소환 적중도 «공격» 이다: 소환(창/도끼/화살/번개/검기)이 적을 맞히면
   «공격 시 n%» 트리거를 굴린다(창이 창을 부르는 연쇄 허용). «치명타 시» 트리거는 `dealPlayerDamage` 안에 있어
   기본공격 전용이 아니었으므로 소환 적중에도 이미 걸린다 — 새로 붙는 것은 «공격 시» 쪽이다.
   **기본공격 전용으로 남는 것은 `nextCrit`/`nextAtk` 소모 · 분신 · 추가타 셋뿐**(PLAN §4, 주인 위임).
   소환 적중은 항상 아이콘 인자를 넘기므로 `nextCrit` 을 소모하지 않는다(sim.js 의 `fromBasic=false` 와 같다).
   성능 가드(주인 명시 허용) — `PROJ_CAP` 동시 활성 투사체 상한(초과분은 즉발 판정으로 대체) ·
   `PROC_TICK_CAP` 한 프레임에 굴리는 소환 적중 트리거 수 상한. 확률·연쇄 자체는 제한하지 않는다.
   sim.js:667~679 와 1:1 (게이트가 두 파일을 대조한다). */
const PROJ_CAP=200, PROC_TICK_CAP=200;
function summonHit(e,ratio,icon){
  dealPlayerDamage(e,ratio,icon);
  if(G.procN<PROC_TICK_CAP){ G.procN++; procOnAttack(e); }
}
function pushProj(pr){
  if(G.pprojs.length<PROJ_CAP){ G.pprojs.push(pr); return; }
  if(pr.hit){                                   /* 관통형(창·검기): 사거리 안 적을 앞에서부터 pierce 마리 */
    const list=aliveEnemies().filter(e=>(!pr.node||e.wave===pr.node)&&e.worldX>=pr.x-16&&e.worldX<=pr.maxX)
                              .sort((a,b)=>a.worldX-b.worldX);   /* pr.node = 미스폰·대기 웨이브 피격 금지 (주인 15:2X · T44) */
    for(const e of list.slice(0,pr.pierce)) projHit(pr,e);
  }else if(pr.tgt&&pr.tgt.hp>0) projHit(pr,pr.tgt);
}
/* 소환 적중 한 곳 — sim.js projHit 과 1:1 (투사체 해석 지점이 여러 곳이라 동사를 하나로 모았다).
   ⚑ T96 — 소환 개조 특전(회전·튕김·관통 스턴)은 새 10종 체제에 없다. 도끼·화살·창 모두 «1개 = 1발». */
function projHit(pr,e){
  summonHit(e,pr.type==='axe'?R_AXE:pr.ratio,pr.type==='spear'?'🔱':(pr.type==='wave'?'🌊':(pr.type==='axe'?'🪓':'🏹')));
}
function castBolt(t){
  const p=G.player, px=p.px;
  G.bolts.push({x:t.worldX,t:0,seed:Math.random()*10});
  AU.play('bolt');
  summonHit(t,R_BOLT,'⚡');
}
/* «가장 가까운 적» — 💫👟·💫👑·연쇄 번개가 쓴다 (sim.js nearestTo 와 1:1) */
function nearestTo(ref,except){
  let b=null,bd=1e9;
  for(const e of aliveEnemies()){ if(e===except) continue; const d=Math.abs(e.worldX-ref); if(d<bd){ bd=d; b=e; } }
  return b;
}
/* ---------- 소환 5종 (sim.js fireAxe/fireArrows/fireBolts/fireWave/fireSpear 와 1:1) ----------
   주인 지시(2026-09-02 08:3X): 다연발은 동시 스폰 금지 — 50~70ms 간격 순차 연사, 발마다 판정·사운드. */
function volley(n,shot){
  shot(0);
  /* ⚑ T3-1 수리 — 간격을 «누적» 으로 쌓는다.
     종전 `k*(50+Math.random()*20)` 는 k 마다 난수를 새로 뽑아 «k번째 발의 절대 시각» 을 정했다.
     그래서 이웃한 두 발의 간격이 난수 차이만큼 벌어지거나 겹쳤다 — 24발 실측 0.6~171ms(평균 62),
     심하면 뒤 발이 앞 발보다 먼저 나간다. 주인 지시(08:3X)는 «발마다 50~70ms 간격의 순차 연사,
     낱발이 구별돼 보일 것» 이므로 간격 자체를 50~70ms 로 못박는다. 총 길이는 종전과 같다(평균 60ms×n). */
  let d=0;
  for(let k=1;k<n;k++){ d+=50+Math.random()*20; setTimeout(()=>{ if(G&&!G.over) shot(k); }, d); }
}
/* ⚑ 소환 발사 5종 — 발수 n 을 인자로 받는다(특전 텍스트의 «도끼 2개 / 화살 2발 / 번개 2회» 가 그대로 인자다).
   데미지 계수는 주인 확정 상수(R_AXE …). sim.js 의 같은 이름 함수와 1:1이고, 여기에만 순차 연사·사운드가 붙는다. */
function fireAxe(p,n){
  n=(n||1)*(p.px.axeCount?3:1);
  volley(n,()=>{ const t=randTarget(); if(!t)return; AU.play('throw');
    pushProj({type:'axe',x:p.worldX+14,tgt:t,ratio:R_AXE,spd:430,spin:0}); });
}
function fireArrows(p,n){
  const px=p.px; n=n||2;
  if(px.arrowCount) n=Math.round(n*1.5);            /* 장비 «화살 3발로 증가» (기본 2발 → 3발) */
  /* ⚑⚑⚑ T119 창의 화신(전설 8) — «내가 쏘는 모든 화살이 창으로 바뀐다». 발사 동사 한 곳에서 갈아탄다
     (특전 화살도 장비 화살 옵션도 전부 이 함수를 거친다). 발수 그대로 · 창 데미지·8관통 그대로. */
  if(px.p_spearAvatar){ fireSpear(p,n); return; }
  volley(n,()=>{ const t=randTarget(); if(!t)return; AU.play('arrow');
    pushProj({type:'parrow',x:p.worldX+14,tgt:t,ratio:R_ARROW,spd:560}); });
}
function fireBolts(p,n){
  n=(n||1)*(p.px.boltCount?2:1);
  volley(n,()=>{ const t=randTarget(); if(t) castBolt(t); });
}
/* ⚑⚑⚑ T119 «보이는 적 전부에게 번개 1회씩» — «보이는 적» = 현재 교전 중인 웨이브의 살아 있는 적 전부
   (적은 고정 배치라 «화면에 보이는» = 그 웨이브다 · 주인 위임). 회당 공격력 75%(R_BOLT). sim.js 와 1:1. */
function fireBoltsAll(p,node){
  const nd=node||frontNode(); if(!nd) return;
  const list=nd.enemies.filter(e=>e.hp>0);   /* 대상은 «발동 시점» 에 굳힌다 — 연사 사이에 죽어도 자리가 안 밀린다 */
  if(!list.length) return;
  volley(list.length,k=>{ const t=list[k]; if(t&&t.hp>0) castBolt(t); });
}
function fireWave(p,n){
  const px=p.px; n=n||1;
  const big=false;                                  /* 거대 검기 개조 특전은 새 10종에 없다 */
  const pierce=big?WAVE_PIERCE_BIG:(px.waveKing?20:WAVE_PIERCE);
  const reach=big?88*SPEAR_PIERCE:(px.waveKing?1400:340);
  volley(n,()=>{ AU.play('throw');
    pushProj({type:'wave',x:p.worldX+14,ratio:R_WAVE,spd:470,maxX:p.worldX+reach,hit:new Set(),pierce,node:frontNode()}); });
}
function fireSpear(p,n){
  n=n||1;
  /* 창 관통 상한 8마리 — PLAN §3.0 «일직선 최대 8마리». 장비 «창 데미지» 옵션은 계수만 올린다. */
  volley(n,()=>{ AU.play('throw');
    pushProj({type:'spear',x:p.worldX+14,ratio:p.px.spearMaster?13.5:R_SPEAR,spd:520,maxX:p.worldX+88*SPEAR_PIERCE,hit:new Set(),pierce:SPEAR_PIERCE,node:frontNode()}); });
}
function gainExp(n){
  const p=G.player;
  p.exp+=n;
  let lev=0;
  while(p.exp>=expNeed(p.level)){ p.exp-=expNeed(p.level); p.level++; lev++; }
  /* 주인 지시(2026-09-02 06:3X): 챕터를 끝내는 보스 처치로 레벨업해도 특전 선택지·레벨업 팝업 없이 클리어로 */
  if(lev>0 && !G.over && !G.cleared){
    G.pendingLevels+=lev-1;
    openLevelUp();
  }
}
/* over = 이 처치에서 «초과된 데미지»(오버킬). 🩸 오버킬 힐 · 🔧⚡ 오버킬 수리가 이 값을 쓴다. */
function onKill(e,over){
  if(e.dead) return; e.dead=true;
  const p=G.player, px=p.px;
  G.kills++; G.killed++;
  const drop=Math.round(TUNE.goldKill(G.chapter)*p.goldMul);
  G.gold+=drop;
  syncGameTop();
  AU.play('poof'); AU.play('coin');
  poof(e.worldX,0);
  /* ⚑ T57 — 전투 중 유일하게 fmt 를 안 거치던 표기였다. 데미지·회복·반격은 전부 fmt 를 쓰는데
     이 한 줄만 raw number 라, 골드가 챕터당 1.22 배로 자라면서 챕터 150 에서 19자,
     챕터 240 부터는 JS 지수표기(«+9.25e+22 🪙»)가 캔버스에 그대로 떴다 — 게임 표기 규약(T54) 밖이다. */
  addText('+'+fmt(drop)+' 🪙','#FFD54F',e.worldX,-100);
  if(p.killHeal>0) heal(p,p.maxHp*p.killHeal);
  if(px.killShield3) repair(p,p.maxSh*0.05*px.killShield3);      /* 장비 옵션 */
  if(px.killShield10) repair(p,p.maxSh*0.10*px.killShield10);    /* 장비 옵션 */
  if(px.aspdKill) addBuff(p,'aspd',0.20*px.aspdKill,4,'aspdKill');
  if(px.killCritBuff&&pkk(p,0.30*px.killCritBuff)) addBuff(p,'critR',14,4,'killCritBuff');
  if(px.killDefBuff) addBuff(p,'def',10*px.killDefBuff,3,'killDefBuff');
  if(px.killAspd){ p.aspd*=1.01; renderStatsGrid(); }
  /* ⚑⚑⚑ T119 처치 시 트리거 (주인 확정 2026-09-04 13:0X) — sim.js onKill 과 1:1.
     «내가 처치했을 때» = 평타·반격·소환 적중·가시 반사 전부. 확률은 등급별 최댓값(mkPerks 주석 참조). */
  if(px.p_killSpear&&pkk(p,px.p_killSpear)) fireSpear(p,1);
  if(px.p_killBolt&&pkk(p,px.p_killBolt)) fireBoltsAll(p,e.wave);   /* ⚑ 대상 = 죽은 적이 속한 웨이브 (대기 웨이브·보스로 넘어가지 않는다) */
  if(px.p_killArrow&&pkk(p,px.p_killArrow)) fireArrows(p,3);
  if(px.p_killAxe&&pkk(p,px.p_killAxe)) fireAxe(p,2);
  /* ⚑ T119 오버킬 회복(전설 3) — 초과분 100% 만큼 체력 회복(«힐» 이라 회복 증폭을 탄다 · 실드는 안 채움) */
  if(px.p_overkill&&over>0) heal(p,over);
  /* ⚑⚑⚑ T121 처치 시 트리거 5종 (주인 확정 16:0X ①) — sim.js onKill 과 1:1.
     회피 버프만 «갱신형»(중첩 아님 — 재발동 시 시간만 2초로 되돌린다)이고, 스택 2종은 이 판 동안 무한 누적한다.
     공격력 스택은 곱연산이라 `p.dmg` 를 직접 키우고, 회피 스택은 가산이라 `p.evade` 를 키운다
     (상한 90 은 `effEvade` 의 엔진 규칙이 자른다). */
  if(px.p_killEvBuff) refreshBuff(p,'evade',PERK_KILLEV_A,PERK_KILLEV_T,'p_killEvBuff');
  if(px.p_killAtkStk&&pkk(p,PERK_KSTACK_CH)){ p.dmg*=1+PERK_KSTACK_ATK; renderStatsGrid(); }
  if(px.p_killEvStk&&pkk(p,PERK_KSTACK_CH)){ p.evade+=PERK_KSTACK_EV; renderStatsGrid(); }
  if(px.p_killHealN&&pkk(p,PERK_KHEAL_CH)){ heal(p,p.maxHp*PERK_KHEAL_F); addText('❣️','#7ED957'); }
  if(px.p_killRepair&&pkk(p,PERK_KREPAIR_CH)){ repair(p,p.maxSh*PERK_KREPAIR_F); addText('🔧','#6CC0F0'); }
  /* ⚑⚑⚑ T121 2차 처치 시 트리거 3종 (주인 확정 17:0X ×2 · 17:2X) — sim.js onKill 과 1:1.
     ⓐ 확정 치명 = 플래그 1개(스택 아님) · 다음 평타에서 소모 · 광전사의 «치확 0 고정» 보다 우선.
     ⓑ 버서커 = 여기서 쌓기만 하고 소모는 평타에서 1개씩(8스택이 한 방에 +800% 가 아니다 — 주인 명시).
     ⓒ 대시 = **같은 웨이브에 살아 있는 다음 적이 있을 때만**(웨이브 마지막 적 → 다음 웨이브로는 안 간다). */
  if(px.p_killSureCrit){ p.sureCrit=true; addText('🎯 확정 치명!','#FFB92E',p.worldX,-104); }
  if(px.p_berserkStk){ p.bsStk++; renderStatsGrid(); }
  if(px.p_killDash&&e.wave&&e.wave.enemies.some(x=>x.hp>0)) p.dash=true;
  if(e.wave.enemies.every(x=>x.hp<=0)){
    e.wave.done=true;
    /* 웨이브 전멸 실드 무료충전 폐지 (주인 지시 2026-09-02 06:5X·08:5X) — 실드 충전은 특전으로만 */
  }
  /* 클리어 확정을 먼저 — 보스 경험치로 레벨업해도 특전 3택 없음 (PLAN §2.4 주인 지시) */
  if(e.isBoss){
    G.cleared=true; shake(10);
    gainExp(e.exp+(px.sage?1:0));
    /* ⚑ T61 — 클리어 화면을 700ms 미루는 동안 «이 전투» 를 고정한다. 종전 `if(G)` 는 그 사이에
       포기·재시작으로 G 가 다른 전투로 바뀌어도 통과해서, 한 대도 안 때린 챕터가 클리어 처리됐다
       (실측: 챕터 40 을 처치 0 으로 클리어 + 보너스 280.04K 지급). */
    const g=G;
    setTimeout(()=>{ if(G===g) openClear(); },700);
  }else gainExp(e.exp+(px.sage?1:0));
}
/* ⚑ T48 1단계 — 스턴 메커니즘 (주인 15:5X · PLAN §3.0). sim.js applyStun 과 같은 규칙:
   더 긴 쪽만 남기고(합산 금지) 보스는 STUN_BOSS_MUL 배. 게임 쪽은 여기에 «스턴» 연출이 붙는다. */
function applyStun(e,sec){
  if(!e||e.hp<=0) return;
  const p=G.player;
  let s=sec;
  if(e.isBoss) s*=STUN_BOSS_MUL;
  const wasStunned = (e.stun||0)>0;
  e.stun=Math.max(e.stun||0,s);
  if(!wasStunned){
    AU.play('shield');
    addText('💫 스턴!','#FFD54F',e.worldX,-104,true);
    sparks(e.worldX,-60,'#FFE9A0',7,150);
  }
}
/* ⚑ T48 1단계 — 빗맞음(onMiss) 트리거. sim.js procOnMiss 와 1:1. 호출 지점은 빗맞음이 실제로
   일어나는 두 곳(dealPlayerDamage · doCounter)뿐 — «MISS» 팝이 뜨는 자리와 같다. */
function procOnMiss(e){
  const p=G.player, px=p.px;
  if(px.missAtk) addBuff(p,'atk',0.10*px.missAtk,3,'missAtk');   /* ⚑ T1 R01 등급 내 재분배: +6% → +10% */
  if(px.missDef) addBuff(p,'def',10*px.missDef,3,'missDef');
  if(px.missAspd) addBuff(p,'aspd',0.12*px.missAspd,2,'missAspd');
  if(px.missReset&&pkk(p,0.30*px.missReset)) p.atkTimer=0;
  if(px.missRush){ p.atkTimer=0; p.nextAtk=Math.min(1.5,Math.max(p.nextAtk,1.0)); addText('💨 즉시 재공격!','#9CD2FF'); }
  if(px.missSpear&&pkk(p,0.20*px.missSpear)) fireSpear(p,1);
}
/* ⚑ T48 3단계 — 횟수형 방어막 (주인 17:2X). sim.js wardCap/gainWard 와 1:1.
   막을 때의 전용 이펙트와 남은 장수 뱃지는 아래 hitPlayer·renderBuffBar 가 맡는다. */
/* 상한 없음 — 주인 확정 «무한» (sim.js gainWard 와 1:1) */
function gainWard(p,ch){
  if(!ch||!pkk(p,ch)) return;
  p.ward++;
  addText('🛡️✨ x'+p.ward,'#9CD2FF');
  renderBuffBar();
}
/* ⚑ T48 2단계 — 원거리 피격 트리거 (주인 16:1X). sim.js procOnRanged 와 1:1.
   일반 «피격 시» 트리거와 별개 축이라 원거리 피격은 둘 다 굴린다. 회피에 성공하면 굴리지 않는다. */
/* dmg = 그 화살로 실제로 «받은 피해». 🏹🌵 는 이 값의 100% 를 되돌린다. */
function procOnRanged(src,dmg){
  const p=G.player, px=p.px;
  if(px.rangeShield&&pkk(p,0.10*px.rangeShield)){ repair(p,p.maxSh*0.04); addText('🏹🔋','#6CC0F0'); }
  if(px.rangeThorns&&src&&src.hp>0&&pkk(p,0.30*px.rangeThorns)) reflect(src,effDmg(p)*0.8,'🏹🌵');
  if(px.rangeBolt&&pkk(p,0.30*px.rangeBolt)) fireBolts(p,1);
  if(px.rangeSpear&&pkk(p,0.10*px.rangeSpear)) fireSpear(p,1);
}
/* 반사 한 곳 (sim.js reflect 와 1:1) — 반사는 «플레이어가 겨눈 타격» 이 아니라 적 회피를 타지 않는다. */
function reflect(src,amt,icon){
  if(!src||src.hp<=0||amt<=0) return;
  src.hp-=amt; src.hitT=0.15;
  addText((icon||'')+' '+fmt(amt),'#A5D6A7',src.worldX,-92);
  if(src.hp<=0) onKill(src,-src.hp);
}
function dealPlayerDamage(e,ratio,icon){
  if(e.hp<=0) return false;
  const p=G.player, px=p.px;
  const basic=(icon===undefined);
  const full=e.hp>=e.maxHp-0.5, stunned=e.stun>0;
  let cr=effCritR(p);
  if(px.fullHpCrit&&full) cr=Math.max(cr,62);                 /* 장비 옵션 */
  if(basic&&p.nextCrit) cr=100;
  /* ⚑ T121 2차 «처치 시 확정 치명» — `effCritR` 이 광전사 때문에 0 이어도 여기서 100 으로 덮는다
     (주인 명시 «광전사 상태에서도 그 한 방은 0% → 100%»). 치명타 트리거도 정상 발동한다. sim.js 와 1:1. */
  if(basic&&p.sureCrit) cr=100;
  const crit=Math.random()*100<cr;
  if(basic&&p.nextCrit) p.nextCrit=false;
  if(basic&&p.sureCrit) p.sureCrit=false;
  /* ⚑ 적 회피 10% (PLAN §2.3 주인 확정) — sim.js dealDmg 와 같은 자리(치명타 굴림 뒤).
     빗맞아도 nextCrit·nextAtk 는 소모된다(위임 기본값). «MISS» 팝 표시. */
  if(Math.random()<ENEMY_EVADE){
    G.miss++;
    AU.play('evade');
    addText('MISS','#9FB0C0',e.worldX,-84);
    procOnMiss(e);
    return false;
  }
  /* ⚑ T121 치명 스택 — «한 대 때릴 때마다 치명확률 +1, 치명타 뜨면 초기화». 위임 기본값대로
     **평타 적중**만 센다(빗맞음은 위에서 이미 빠졌고, 반격·소환 적중은 `basic` 이 아니다).
     굴림은 이 위에서 이미 끝났으므로 여기서 올린 스택은 «다음 평타» 부터 효과가 있다. sim.js 와 1:1. */
  if(basic&&px.p_critStack) p.critStk=crit?0:p.critStk+PERK_CSTACK_A;
  let d=effDmg(p)*ratio*(crit?effCritF(p)/100:1)*rand(0.92,1.08);
  /* 가산 보너스 풀 — sim.js dealDmg 와 같은 식 (주인 정정 16:3X: 배수 아님, 가산 +100%).
     빗맞음 스택은 적중 1타당 1개 소모하고, 몇 장이 쌓여 있든 한 타에는 +100% 한 번만. */
  let addBonus=0;
  if(full&&px.firstHit) addBonus+=0.20*px.firstHit;            /* 장비 옵션 */
  if(full&&px.p_fullHp) addBonus+=PERK_FULLHP_A;               /* ⚑ T119 희귀 1 풀피 적 강타 — 데미지 +100% */
  if(px.backDmg){                                             /* 장비 옵션 (순수 배수) */
    let front=null;
    for(const en of aliveEnemies()) if(!front||en.worldX<front.worldX) front=en;
    if(front&&e!==front) d*=3.2;
  }
  if(addBonus) d*=1+addBonus;
  if(px.execute&&e.hp<=e.maxHp*0.5) d*=2.2;                    /* 장비 옵션 */
  e.hp-=d; e.hitT=0.15;
  AU.play(crit?'crit':'hit');
  sparks(e.worldX-10,-40,crit?'#FFB92E':'#FFF3CF',crit?9:5,crit?190:130);
  if(crit) shake(3);
  addText((icon||'')+(crit?'💥':'')+fmt(d), crit?'#FFB92E':(icon?'#BFE3FF':'#FFFFFF'), e.worldX,-84,crit);
  /* ⑦ 생명 흡수 — «준 피해의 10% 회복». noBoost=true (sim.js 와 1:1):
     주인 문면이 «준 피해의 10%» 라 회복 증폭을 안 타고, «실드는 안 채움» 조항대로 오버킬 수리도 안 탄다. */
  if(p.steal>0) heal(p,d*p.steal/100,true);
  if(crit){
    if(px.critChain) addBuff(p,'critR',5*px.critChain,3,'critChain');
    if(px.critFsmall) addBuff(p,'critF',20*px.critFsmall,3,'critFsmall');   /* ⚑ T1 R01 등급 내 재분배: +10 → +20 */
    if(px.critFBuff) addBuff(p,'critF',34*px.critFBuff,4,'critFBuff');
    if(px.critAtkBuff) addBuff(p,'atk',0.15*px.critAtkBuff,4,'critAtkBuff');
    if(px.critAspdBuff) addBuff(p,'aspd',0.25*px.critAspdBuff,3,'critAspdBuff');
    if(px.critHealS&&pkk(p,0.20*px.critHealS)){ heal(p,p.maxHp*0.05); addText('❣️','#7ED957'); }
    if(px.critHeal3&&pkk(p,0.30*px.critHeal3)){ heal(p,p.maxHp*0.04); addText('❣️','#7ED957'); }
    if(px.critReset&&pkk(p,0.45*px.critReset)) p.atkTimer=0;
    if(px.stunCritM&&pkk(p,0.15*px.stunCritM)) applyStun(e,3);
    if(px.stunCritL&&pkk(p,0.35*px.stunCritL)) applyStun(e,3);
    /* ⚑ T121 치명타 시 스턴 I/II/III — 셋은 서로 다른 특전이라 **각각 따로 굴린다**(주인 명시).
       지속 3초·보스 1/3 은 `applyStun` 의 엔진 규칙 그대로다. sim.js dealDmg 와 1:1. */
    if(px.p_stunCritN&&pkk(p,PERK_STUNC_N)) applyStun(e,PERK_STUNC_T);
    if(px.p_stunCritR&&pkk(p,PERK_STUNC_R)) applyStun(e,PERK_STUNC_T);
    if(px.p_stunCritL&&pkk(p,PERK_STUNC_L)) applyStun(e,PERK_STUNC_T);
    /* ⚑⚑⚑ T121 3차 «치명 시 창»(희귀 33% · 전설 66%)·«치명 시 번개»(전설 66%) — 주인 확정 17:5X·18:4X.
       셋 다 따로 굴린다. 광전사면 치명타 자체가 안 뜨므로 함께 죽는다(«처치 시 확정 치명» 한 방은 예외).
       sim.js dealDmg 와 1:1 — 소환 연쇄 B 는 `verifySummonChain` ⑥ 이 잰다. */
    /* ⚑ 성능 가드 — 소환 적중 트리거와 같은 틱 예산(PROC_TICK_CAP). 이 셋은 «소환 → 치명타 → 새 소환» 으로
       자기를 다시 부를 수 있는 첫 축이라 재귀를 여기서 끊는다(데미지는 그대로 · sim.js 와 1:1). */
    if((px.p_critSpearR||px.p_critSpearL||px.p_critBoltL)&&G.procN<PROC_TICK_CAP){
      G.procN++;
      if(px.p_critSpearR&&pkk(p,PERK_CRITSP_R)) fireSpear(p,1);
      if(px.p_critSpearL&&pkk(p,PERK_CRITSP_L)) fireSpear(p,1);
      if(px.p_critBoltL&&pkk(p,PERK_CRITBOLT_L)) fireBoltsAll(p,e.wave);
    }
    /* ⚑⚑⚑ T124 치명 세트 f «치명타 시 50% 확률로 도끼 1개» — 부위마다 따로 굴린다(풀셋 +3강이면 6번).
       «치명타 시» 축의 소환이라 T121 의 창·번개와 같은 틱 예산을 쓴다(sim.js 와 1:1). */
    if(px.g_critAxe&&G.procN<PROC_TICK_CAP){
      G.procN++;
      for(let i=0;i<px.g_critAxe;i++) if(pkk(p,0.50)) fireAxe(p,1);
    }
    gainWard(p,0.12*px.wardCrit);
  }
  if(px.execKill&&!e.isBoss&&e.hp>0&&e.hp<=e.maxHp*0.25){       /* 장비 옵션 */
    e.hp=0;
    addText('🧨 처형!','#FF6B6B',e.worldX,-104,true);
  }
  if(e.hp<=0) onKill(e,-e.hp);
  if(basic) cleave(e,d);
  return crit;
}
/* ⚑⚑⚑ T121 2차 관통 베기 I/II/III (주인 확정 17:4X) — sim.js cleave 와 1:1.
   대상 = «타겟 다음으로 가까운 살아 있는 적, 같은 웨이브»(다음 웨이브로 안 번진다 · T44 와 같은 축) ·
   데미지 = 그 평타가 타겟에게 준 값 그대로 · 뒤 적 회피 10% 는 따로 굴림 · 셋 다 있으면 뒤 적이 한 공격에 3번 ·
   **평타에만**(소환·반격 제외) · 뒤의 뒤로 번지지 않게 `dealPlayerDamage` 를 다시 부르지 않는다. */
function cleave(tgt,dmg){
  const p=G.player, px=p.px;
  if(!(px.p_cleaveN||px.p_cleaveR||px.p_cleaveL)||dmg<=0) return;
  let back=null;
  for(const e of aliveEnemies()){
    if(e===tgt||e.wave!==tgt.wave) continue;
    if(e.worldX<=tgt.worldX) continue;                /* «뒤» = 타겟보다 먼 쪽 */
    if(!back||e.worldX<back.worldX) back=e;
  }
  if(!back) return;
  const hit=()=>{
    if(back.hp<=0) return;
    if(Math.random()<ENEMY_EVADE){ G.miss++; AU.play('evade'); addText('MISS','#9FB0C0',back.worldX,-84); procOnMiss(back); return; }
    back.hp-=dmg; back.hitT=0.15;
    sparks(back.worldX-10,-40,'#CFE8FF',5,130);
    addText('🗡️'+fmt(dmg),'#CFE8FF',back.worldX,-84);
    if(back.hp<=0) onKill(back,-back.hp);
  };
  if(px.p_cleaveN&&pkk(p,PERK_CLEAVE_N)) hit();
  if(px.p_cleaveR&&pkk(p,PERK_CLEAVE_R)) hit();
  if(px.p_cleaveL&&pkk(p,PERK_CLEAVE_L)) hit();
}
/* e = 이번 «공격» 이 맞힌 적 (스턴 축이 대상을 알아야 한다). 소환 적중에서도 불린다. */
function procOnAttack(e){
  const p=G.player, px=p.px;
  if(px.atkPerm&&pkk(p,0.10*px.atkPerm)){ p.dmg*=1.01; addText('🌱 공격력 UP','#7ED957',p.worldX,-104); renderStatsGrid(); }
  if(px.c_atkBuff&&pkk(p,0.30*px.c_atkBuff)) addBuff(p,'atk',0.05,3,'c_atkBuff');
  if(px.c_aspdBuff&&pkk(p,0.30*px.c_aspdBuff)) addBuff(p,'aspd',0.05,3,'c_aspdBuff');
  if(px.aspdStack10&&pkk(p,0.25*px.aspdStack10)) addBuff(p,'aspd',0.05,4,'aspdStack10');   /* 주인 예시 — 고중첩 상위 변형 */
  if(px.atkBuffM&&pkk(p,0.30*px.atkBuffM)) addBuff(p,'atk',0.14,4,'atkBuffM');
  if(px.atkBuffL&&pkk(p,0.25*px.atkBuffL)) addBuff(p,'atk',0.35,5,'atkBuffL');
  if(px.axe&&pkk(p,0.05*px.axe)) fireAxe(p,1);
  if(px.arrow2&&pkk(p,0.05*px.arrow2)) fireArrows(p,2);
  if(px.wave&&pkk(p,0.05*px.wave)) fireWave(p,1);
  if(px.spear&&pkk(p,0.05*px.spear)) fireSpear(p,1);
  if(px.bolt&&pkk(p,0.05*px.bolt)) fireBolts(p,1);
  if(px.arsenal&&pkk(p,0.05*px.arsenal)) pick([fireAxe,fireArrows,fireBolts,fireWave,fireSpear])(p,1);
  /* ⚑ T121 «공격 시 공속 버프» — 확률 없이 확정 발동이고 중첩형이라 기존 버프 엔진(무한 중첩)을 그대로 쓴다.
     소환 적중도 «공격» 이므로(PLAN §3.0) 이 자리에 두면 소환 적중에서도 함께 발동한다. sim.js 와 1:1. */
  if(px.p_aspdAtk) addBuff(p,'aspd',PERK_ASPDATK_A,PERK_ASPDATK_T,'p_aspdAtk');
  gainWard(p,0.10*px.wardAtk);
}
function doCounter(src,depth){
  const p=G.player, px=p.px;
  if(!src||src.hp<=0) return;
  /* 반격도 «플레이어의 타격» 이라 적 회피 10% 를 탄다 (PLAN §2.3). 빗맞으면 counterChain 도 끊긴다. */
  if(Math.random()<ENEMY_EVADE){
    G.miss++;
    AU.play('evade');
    addText('MISS','#9FB0C0',src.worldX,-80);
    procOnMiss(src);
    return;
  }
  let cd=effDmg(p)*0.7*(1+px.counterX);                          /* counterX = 장비 옵션 */
  /* ⚑⚑⚑ T121 2차 반격 축 2개 (주인 확정 17:0X) — 반격은 종전에 «치명타가 없는 타격» 이었다. sim.js 와 1:1.
     ⓐ 반격 치명 I/II — **반격 타격에만** 치확 가산(둘 다면 +60) · 치명 배율은 `effCritF` 그대로.
     ⓑ 반격 강화 I/II — 반격 데미지 곱연산(둘 다면 ×1.30 × ×1.60 — 주인 명시). */
  const ctCr=(px.p_ctCritN?PERK_CTCRIT_N:0)+(px.p_ctCritR?PERK_CTCRIT_R:0);
  const ctCrit=ctCr>0&&Math.random()*100<ctCr;
  if(ctCrit) cd*=effCritF(p)/100;
  if(px.p_ctDmgN) cd*=PERK_CTDMG_N;
  if(px.p_ctDmgR) cd*=PERK_CTDMG_R;
  src.hp-=cd; src.hitT=0.15;
  /* 연출용 접두 문자열은 다른 팝업과 같은 이름(`icon`)을 쓴다 — 숫자는 전부 `fmt` 를 거친다(T57 규약). */
  const icon=ctCrit?'반격 💥':'반격 ';
  addText(icon+fmt(cd),'#FFD54F',src.worldX,-80,ctCrit);
  sparks(src.worldX,-40,'#FFD54F',5,130);
  if(px.counterAtkS) addBuff(p,'atk',0.05*px.counterAtkS,3,'counterAtkS');
  if(px.counterDefS) addBuff(p,'def',10*px.counterDefS,3,'counterDefS');
  if(px.counterAtkM) addBuff(p,'atk',0.14*px.counterAtkM,4,'counterAtkM');
  if(px.counterCrit) addBuff(p,'critR',14,3,'counterCrit');
  if(px.counterHeal) heal(p,p.maxHp*0.04*px.counterHeal);
  if(px.counterWave&&pkk(p,1.0*px.counterWave)) fireWave(p,1);
  /* ⑦ 반격 시 창 — 반격 1회당 창 1개, 확정 발동 (sim.js doCounter 와 1:1 · ⚑ T108 로 50% → 100% · T109 로 순번 3 → 7) */
  if(px.p_spearCt&&pkk(p,PERK_SUMMON_CH)) fireSpear(p,1);
  if(src.hp<=0) onKill(src,-src.hp);
  /* 🔂 반격하면 반드시 두 번 더 반격 — 연쇄 상한 3회 (무한 연쇄 금지는 유지) */
  else if(px.counterChain&&!depth) doCounter(src,1);
}
function playerStrike(e){
  const p=G.player, px=p.px;
  p.strikeT=0.16;
  let ratio=1;
  if(p.nextAtk>0){ ratio*=1+p.nextAtk; p.nextAtk=0; }
  /* ⚑ T121 2차 버서커 — 평타 1회당 스택 1 소모, 그 공격만 ×2(+100%). 반격·소환은 소모하지도 쓰지도 않는다. */
  if(px.p_berserkStk&&p.bsStk>0){ p.bsStk--; ratio*=PERK_BSTK_M; renderStatsGrid(); }
  const crit=dealPlayerDamage(e,ratio);
  if(px.clone&&e.hp>0) dealPlayerDamage(e,0.25,'👻');                  /* 장비 옵션 */
  if(crit&&px.extraHit&&pkk(p,0.75*px.extraHit)&&e.hp>0) dealPlayerDamage(e,2.3,'🗡️');   /* 장비 옵션 */
  procOnAttack(e);
  procNHit(p);
}
/* ⚑⚑⚑ T121 «N타마다» 특전표 (주인 확정 16:0X ① · 16:2X ⑤) — [px 키, 주기 N, 발동]. sim.js NHIT_PERKS 와 1:1.
   같은 이름의 I/II/III 는 **서로 다른 특전**이라 카운터도 각자 센다(주인 명시).
   «N타» = 평타 횟수다 — 빗나감도 세고(`playerStrike` 한 번 = 1타) 반격·소환은 안 센다.
   그래서 호출 지점이 `playerStrike` 끝 한 곳뿐이다 (`procOnAttack` 은 소환 적중에서도 불려 자격이 없다). */
const NHIT_PERKS=[
  ['p_nArrowN',PERK_NHIT_ARROW,p=>fireArrows(p,1)],
  ['p_nArrowR',PERK_NHIT_ARROW,p=>fireArrows(p,2)],
  ['p_nArrowL',PERK_NHIT_ARROW,p=>fireArrows(p,3)],
  ['p_nAxeN',  PERK_NHIT_AXE,  p=>fireAxe(p,1)],
  ['p_nAxeR',  PERK_NHIT_AXE,  p=>fireAxe(p,2)],
  ['p_nAxeL',  PERK_NHIT_AXE,  p=>fireAxe(p,3)],
  ['p_nBoltN', PERK_NHIT_BOLT, p=>fireBolts(p,1)],
  ['p_nBoltR', PERK_NHIT_BOLT, p=>fireBolts(p,2)],
  ['p_nBoltL', PERK_NHIT_BOLT, p=>fireBolts(p,3)],
  ['p_nSpearL',PERK_NHIT_SPEAR,p=>fireSpear(p,1)],
  ['p_nHealN', PERK_NHIT_HEAL, p=>heal(p,p.maxHp*PERK_NHEAL_F)],
];
function procNHit(p){
  const px=p.px;
  for(const t of NHIT_PERKS){
    if(!px[t[0]]) continue;
    const c=(p.nhit[t[0]]||0)+1;
    if(c>=t[1]){ p.nhit[t[0]]=0; t[2](p); } else p.nhit[t[0]]=c;
  }
}

    if(p.hp<p.maxHp*0.50) for(let i=0;i<px.g_evHeal;i++) if(pkk(p,0.30)){ heal(p,p.maxHp*0.10); addText('🍀 +'+fmt(p.maxHp*0.10),'#7ED957'); }
    gainWard(p,0.10*px.wardEvade);
    /* ⚑⚑⚑ T104 — 1번 특전 «회피 시 회복»: 회피 성공마다 10% 굴려서 최대 체력 6% 회복.
       heal(...,true) 로 회복 증폭·오버킬 수리 분기를 안 타므로 실드는 안 채운다(위임 기본값 · sim.js 와 1:1). */
    if(px.p_evadeHeal&&pkk(p,PERK_EVHEAL_CH)){ heal(p,p.maxHp*PERK_EVHEAL_F,true); addText('🍀 +'+fmt(p.maxHp*PERK_EVHEAL_F),'#7ED957'); }
    /* ④ 회피 시 화살 I/II/III — ⚑ 17:5X 주인 정정으로 I 이 100% → 33% 가 되고 II(66%)·III(100%)가 생겼다.
       셋은 서로 다른 특전이라 각각 따로 굴린다(sim.js hitPlayer 와 1:1). «회피 시 창»(전설 33%)도 같은 축. */
    if(px.p_arrowEv&&pkk(p,PERK_SUMMON_N)) fireArrows(p,1);
    if(px.p_arrowEvR&&pkk(p,PERK_SUMMON_R)) fireArrows(p,1);
    if(px.p_arrowEvL&&pkk(p,PERK_SUMMON_L)) fireArrows(p,1);
    if(px.p_spearEvL&&pkk(p,PERK_SUMMON_SP)) fireSpear(p,1);
    /* ⚑ T121 3차 «회피 시 회복 II»(희귀 15%)·«회피 시 수리 I/II»(희귀 15% · 전설 25%) — ⚑ 18:0X·18:1X 정정값.
       II 는 주인이 «회복 증폭 적용» 이라 적어 일반 1번(noBoost)과 달리 증폭 분기를 탄다. */
    if(px.p_evHealR&&pkk(p,PERK_EVHEAL_R)){ heal(p,p.maxHp*PERK_EVHEAL_F); addText('🍀 +'+fmt(p.maxHp*PERK_EVHEAL_F),'#7ED957'); }
    if(px.p_evRepairR&&pkk(p,PERK_EVREP_R)){ repair(p,p.maxSh*PERK_EVREP_F); addText('🔧 실드 수리','#6CC0F0'); }
    if(px.p_evRepairL&&pkk(p,PERK_EVREP_L)){ repair(p,p.maxSh*PERK_EVREP_F); addText('🔧 실드 수리','#6CC0F0'); }
    /* ⚑⚑⚑ T121 회피 시 즉사 I/II/III (주인 확정 16:0X ①) — 셋은 서로 다른 특전이라 **각각 따로 굴린다**
       (5+10+15 을 합쳐 한 번 굴리지 않는다 — 주인 명시). 근접·원거리 둘 다이고 **보스도 포함**한다
       (옛 «사신의 낫» 관례를 잇는 위임 기본값). 즉사도 «내 처치» 라 `onKill` 을 거치므로
       처치 시 트리거·경험치·골드가 그대로 발동한다. sim.js hitPlayer 와 1:1. */
    /* ⚑ T121 2차 «회피 시 스턴» (주인 확정 16:5X) — 근접·원거리 모두(원거리는 «쏜 적») · 보스 1/3 */
    if(src&&src.hp>0&&px.p_evadeStun&&pkk(p,PERK_EVSTUN_CH)) applyStun(src,PERK_STUNC_T);
    if(src&&src.hp>0&&px.p_execEvN&&pkk(p,PERK_EXEC_N)){ src.hp=0; addText('☠️ 즉사!','#FF6B6B',src.worldX,-104,true); onKill(src,0); }
    if(src&&src.hp>0&&px.p_execEvR&&pkk(p,PERK_EXEC_R)){ src.hp=0; addText('☠️ 즉사!','#FF6B6B',src.worldX,-104,true); onKill(src,0); }
    if(src&&src.hp>0&&px.p_execEvL&&pkk(p,PERK_EXEC_L)){ src.hp=0; addText('☠️ 즉사!','#FF6B6B',src.worldX,-104,true); onKill(src,0); }
    return;
  }
  /* ===== 맞았다 ===== */
  /* ⚑⚑⚑ T121 3차 (주인 확정 18:2X) — 판정 순서는 **회피 → 방어막 → 피해 무시 → 피해** 다.
     방어막으로 막았거나 «피해 무시»(일반 20%)·«실드 방벽»(전설 · 실드 > 0 일 때 50%)에 걸린 타격은
     주인 문면대로 «피격» 이 아니다 — 피격 트리거·가시갑옷·원거리 피격 축·반격까지 전부 굴리지 않는다.
     sim.js hitPlayer 와 같은 순서·같은 조건. */
  if(p.ward>0){
    p.ward--;
    wardFx();
    renderBuffBar();
    return;
  }
  const ign1=px.p_ignoreN&&pkk(p,PERK_IGN_N);
  const ign2=p.sh>0&&px.p_shWallL&&pkk(p,PERK_SHWALL_L);
  if(ign1||ign2){ addText('🚫','#B9C6D4'); return; }
  const hadSh=p.sh>0;                             /* 실드 반사 조건 — 실드 흡수 «전» 상태로 본다 */
  let d=dmg*(1-effDef(p)/100);
  if(px.guardCrystal&&p.sh>0) d*=0.80;
  /* ⚑⚑⚑ T119 가시갑옷 — 기준은 «이 공격이 나에게 실제로 준 피해»(방어 적용 후 · 실드로 받은 양 포함 ·
     회피/방어막 무효화면 0)라 실드 흡수 «앞» 값이다. sim.js hitPlayer 의 thornBase 와 1:1. */
  const thornBase=d;
  p.hitT=0.15;
  if(p.sh>0){
    const ab=Math.min(p.sh,d); p.sh-=ab; d-=ab;
    sparks(p.worldX,-40,'#6CC0F0',5,120);
    if(d<=0) AU.play('shield');
  }
  if(d>0){
    p.hp-=d;
    AU.play('hurt');
    sparks(p.worldX,-40,'#FF8A80',6,140);
    addText('-'+fmt(d),'#FF8A80');
    if(p.hp<=0){
      if(px.revive>0){
        px.revive--;
        p.hp=p.maxHp*0.05; p.sh=p.maxSh*0.05;
        AU.play('angel'); shake(8);
        addText('♻️ 부활!','#FFD54F',p.worldX,-120,true);
        sparks(p.worldX,-50,'#FFD54F',14,220);
      }else{
        p.hp=0; updateBars(); openDead(); return;
      }
    }
  }
  if(px.defHitBuff) addBuff(p,'def',3*px.defHitBuff,3,'defHitBuff');
  if(px.defBuff2&&pkk(p,0.30*px.defBuff2)) addBuff(p,'def',14,4,'defBuff2');
  if(px.defBuffL&&pkk(p,0.20*px.defBuffL)) addBuff(p,'def',15,4,'defBuffL');
  if(px.wallBuff) addBuff(p,'def',5,4,'wallBuff');
  if(px.hitEvadeBuff&&pkk(p,0.22*px.hitEvadeBuff)) addBuff(p,'evade',14,3,'hitEvadeBuff');
  if(px.evadeHitBuff&&pkk(p,0.30*px.evadeHitBuff)) addBuff(p,'evade',15,3,'evadeHitBuff');
  /* 🚑 체력이 30% 아래로 떨어지면 실드 30% 즉시 충전 (판당 1번) */
  if(px.shieldOnHit&&pkk(p,0.05*px.shieldOnHit)){ repair(p,p.maxSh*0.05); addText('🔋','#6CC0F0'); }
  if(px.hitHeal&&pkk(p,0.15*px.hitHeal)){ heal(p,p.maxHp*0.02); addText('🩹','#7ED957'); }
  /* 피격 시 스턴 — 주인 필수 예시 «피격 시 (n% 확률로) 공격한 적 3초 스턴» (전설 l_stunHit3) */
  gainWard(p,0.08*px.wardHit);
  if(px.stunHitS&&src&&pkk(p,0.20*px.stunHitS)) applyStun(src,3);
  if(px.stunHitL&&src&&pkk(p,0.55*px.stunHitL)) applyStun(src,3);
  if(px.thornsS&&pkk(p,0.30*px.thornsS)) reflect(src,dmg*0.70,'🌿');
  if(px.thorns&&pkk(p,0.60*px.thorns)) reflect(src,dmg*1.5,'🌵');
  if(px.thornsKing) reflect(src,dmg*1.5,'🌵👑');
  /* ⚑ T119 가시갑옷 — 근접만 · 가산 중첩(최대 +600%).
     ⚑ T124 체력실드 세트 e «실드가 있을 때 가시갑옷 +12%» 가 같은 축에 가산으로 얹힌다(조건 = 피격 «전» 실드 · `hadSh`). */
  const thornM=px.p_thorns+(hadSh?px.g_thornSh:0);
  if(thornM&&isMelee&&src) reflect(src,thornBase*thornM,'🌵');
  /* ⚑⚑⚑ T121 3차 «실드 반사»(전설 · 주인 확정 18:2X) — 실드가 있으면 피격 시 50% 로 그 데미지를 되갚는다.
     기준값은 가시갑옷과 같다(방어 «후» · 실드로 받은 양 포함). 근접·원거리 둘 다 · 피해는 그대로 받는다. */
  if(px.p_shRefL&&hadSh&&src&&pkk(p,PERK_SHREF_L)) reflect(src,thornBase,'🪞');
  /* ⚑⚑⚑ T121 3차 «피격 시 방어막» I/II/III — 스택형·장수 무제한, 셋 다 따로 굴린다. */
  gainWard(p,px.p_wardHitN?PERK_WARD_N:0);
  gainWard(p,px.p_wardHitR?PERK_WARD_R:0);
  gainWard(p,px.p_wardHitL?PERK_WARD_L:0);
  /* ⑤ 피격 시 도끼 I/II/III — ⚑ 17:5X 정정으로 I 이 33% · II 66% · III 100% (각각 따로 굴린다).
     «피격 시 창»(전설 33%)도 같은 축이다. sim.js 와 1:1. */
  if(px.p_axeHit&&pkk(p,PERK_SUMMON_N)) fireAxe(p,1);
  if(px.p_axeHitR&&pkk(p,PERK_SUMMON_R)) fireAxe(p,1);
  if(px.p_axeHitL&&pkk(p,PERK_SUMMON_L)) fireAxe(p,1);
  if(px.p_spearHitL&&pkk(p,PERK_SUMMON_SP)) fireSpear(p,1);
  /* ⚑⚑⚑ T124 체력실드 세트 f «피격 시 50% 확률로 도끼 1개» (주인 20:0X · sim.js 와 1:1) */
  for(let i=0;i<px.g_hitAxe;i++) if(pkk(p,0.50)) fireAxe(p,1);
  /* 원거리 피격 축 — 위 «피격 시» 트리거를 전부 굴린 «뒤» 에 추가로 굴린다 (별개 축, 주인 16:1X) */
  if(!isMelee) procOnRanged(src,dmg);
  if(isMelee&&src&&src.hp>0){
    const cc=Math.random()*100<effCounter(p);
    const pc=(px.hitCounter&&pkk(p,0.30*px.hitCounter))||(px.hitCounterS&&pkk(p,0.20*px.hitCounterS));
    if(cc||pc) doCounter(src);
  }
}

function update(dt){
  const p=G.player;
  G.t+=dt;
  G.procN=0;   /* 성능 가드: 소환 적중 트리거 예산은 프레임마다 리셋 (PROC_TICK_CAP) */
  G.shake=Math.max(0,G.shake-dt*40);
  p.strikeT=Math.max(0,p.strikeT-dt); p.hitT=Math.max(0,p.hitT-dt);
  if(G.overBoltCd>0) G.overBoltCd-=dt;

  /* 버프 타이머 */
  let bc=false;
  for(const k in p.buffs){
    const arr=p.buffs[k];
    for(let i=arr.length-1;i>=0;i--){ arr[i].t-=dt; if(arr[i].t<=0){ arr.splice(i,1); bc=true; } }
  }
  if(bc){ renderStatsGrid(); renderBuffBar(); }   /* 버프가 끝나면 아이콘 제거 (주인 지시 07:0X) */

  /* 파티클/텍스트 */
  for(let i=G.parts.length-1;i>=0;i--){
    const pt=G.parts[i]; pt.t+=dt;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=(pt.puff?-30:340)*dt;
    if(pt.t>pt.life) G.parts.splice(i,1);
  }
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i]; t.t+=dt;
    if(t.t>1.05) G.texts.splice(i,1);
  }
  for(let i=G.bolts.length-1;i>=0;i--){ G.bolts[i].t+=dt; if(G.bolts[i].t>0.3) G.bolts.splice(i,1); }
  for(let i=G.reaps.length-1;i>=0;i--){ G.reaps[i].t+=dt; if(G.reaps[i].t>0.45) G.reaps.splice(i,1); }

  const alive=aliveEnemies();
  /* ⚑ T61 — 보스가 죽으면(`G.cleared`) 그 순간 전투를 멈춘다. sim.js 는 `while(!G.dead&&!G.cleared&&…)`
     (sim.js:1003) 라 보스 사망 즉시 챕터가 끝나는데, 게임만 클리어 화면이 뜨는 700ms 동안 전투를 더 굴렸다.
     보스가 잡몹보다 먼저 죽는 상황(관통 창·번개 등 원거리 소환)에서 그 창에 플레이어가 맞아 죽으면
     «💀 쓰러졌다» 가 떴다가 0.7초 뒤 «🏆 클리어» 로 덮였다 — 실측 재현.
     보스가 마지막 1마리인 흔한 경우는 원래 `!alive.length` 로 여기서 멈추고 있었으므로,
     이 한 조건이 두 경우를 같게 만든다(연출·파티클·텍스트는 이 위에서 계속 흐른다). */
  if(!alive.length || G.cleared) return;

  /* 이벤트 노드 */
  for(const n of G.nodes){
    if(!n.done && (n.type==='rest'||n.type==='devil'||n.type==='angel') && p.worldX>n.x-95){
      n.done=true;
      if(n.type==='rest') openRest();
      else if(n.type==='devil') openDevil();
      else openAngel();
      return;
    }
  }

  /* 플레이어 */
  alive.sort((a,b)=>a.worldX-b.worldX);
  const tgt=alive[0];
  if(tgt.isBoss && !G.bossWarned && tgt.worldX-p.worldX<420){
    G.bossWarned=true; AU.play('boss'); shake(8);
    addText('⚠️ BOSS ⚠️','#FF5252',tgt.worldX,-150,true);
  }
  const dist=tgt.worldX-p.worldX;
  /* ⚑ T121 2차 «처치 시 대시» — 사거리(74px)에 닿을 때까지만 이동 속도 ×DASH_MUL. 데미지·무적 없고
     원거리 화살은 그대로 맞는다(주인 «대시 데미지 없음»). 닿으면 플래그가 꺼진다. sim.js 와 1:1. */
  if(dist>74){
    p.worldX+=132*p.walkMul*(p.dash?DASH_MUL:1)*dt; p.walking=true;
    p.atkTimer=Math.min(p.atkTimer,0.35);
  }else{
    p.dash=false;
    p.walking=false;
    p.atkTimer-=dt*effAspd(p);
    if(p.atkTimer<=0){ p.atkTimer+=1; playerStrike(tgt); }
  }

  /* 뇌신 */
  if(p.px.autoBolt){
    G.autoBoltT-=dt;
    if(G.autoBoltT<=0){
      G.autoBoltT=3;   /* sim.js 와 동일 */
      volley(p.px.autoBolt,()=>{ const t2=randTarget(); if(t2) castBolt(t2); });
    }
  }
  /* ⚑ T96 — 주기형 자동 소환(⏰ 3종)·공속 램프(🎻)는 특전과 함께 폐지됐다.
     주기형 «공격» 축에 남는 것은 장비 옵션 `autoBolt`(위 3초) 하나뿐이다. */

  /* 적 (제자리 고정) */
  for(const e of alive){
    if(e.hp<=0) continue;
    e.hitT=Math.max(0,e.hitT-dt); e.strikeT=Math.max(0,e.strikeT-dt);
    /* ⚑ 스턴 (T48) — sim.js 와 같이 남은 시간만 줄이고 이번 틱 공격을 통째로 건너뛴다.
       공격 타이머는 흐르지 않는다(풀리자마자 밀린 공격이 몰아치지 않게 — 위임 기본값). */
    if(e.stun>0){
      e.stun-=dt; e.aggro=false;
      continue;
    }
    if(e.slow>0) e.slow-=dt;
    const d=e.worldX-p.worldX;
    const ivm=(e.slow>0?2:1);                    /* 둔화 — 적 상태 축만 남는다 */
    if(!e.ranged){
      e.aggro = d<290;
      if(d<105){
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer+=(e.isBoss?1.6:1.3)*ivm;
          e.strikeT=0.16;
          let dm=e.dmg;
          if(e.isBoss){ e.hits=(e.hits||0)+1; if(e.hits%3===0){ dm*=2.2; shake(8); addText('강타!','#FF5252',e.worldX,-130,true);} }
          hitPlayer(dm,true,e);
          if(G.over||G.paused) return;
        }
      }
    }else{
      if(d<440 && d>40){
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer+=2.1*ivm; e.strikeT=0.16;
          AU.play('arrow');
          const friendly = p.misfire>0 && Math.random()<p.misfire;
          G.arrows.push({x:e.worldX-18,dmg:e.dmg,friendly,src:e});
        }
      }
    }
  }

  /* 적 화살 */
  for(let i=G.arrows.length-1;i>=0;i--){
    const a=G.arrows[i];
    a.x-=330*dt;
    let hit=false;
    if(a.friendly){
      for(const e of alive){
        if(e!==a.src && e.hp>0 && Math.abs(e.worldX-a.x)<16 && e.worldX<a.src.worldX){
          e.hp-=a.dmg*2; e.hitT=0.15;
          addText('오사! '+fmt(a.dmg*2),'#FFD54F',e.worldX,-92);
          sparks(e.worldX,-40,'#FFD54F',5,130);
          if(e.hp<=0) onKill(e,-e.hp);
          hit=true; break;
        }
      }
    }
    if(!hit && a.x<=p.worldX+8){ hitPlayer(a.dmg,false,a.src); hit=true; }
    if(hit || a.x<p.worldX-60) G.arrows.splice(i,1);
  }

  /* 플레이어 투사체 (도끼/화살/검기/창) */
  for(let i=G.pprojs.length-1;i>=0;i--){
    const pr=G.pprojs[i];
    pr.x+=pr.spd*dt;
    if(pr.type==='axe') pr.spin+=dt*16;
    let done=false;
    if(pr.type==='spear'||pr.type==='wave'){
      for(const e of aliveEnemies()){
        if(pr.node&&e.wave!==pr.node) continue;   /* 미스폰·대기 웨이브 피격 금지 (주인 15:2X) */
        if(!pr.hit.has(e)&&Math.abs(e.worldX-pr.x)<16){
          pr.hit.add(e);
          projHit(pr,e);
          if(pr.hit.size>=pr.pierce){ done=true; break; }
        }
      }
      if(pr.x>pr.maxX) done=true;
    }else{
      if(!pr.tgt||pr.tgt.hp<=0) done=true;
      else if(pr.x>=pr.tgt.worldX-10){ projHit(pr,pr.tgt); done=true; }
    }
    if(done) G.pprojs.splice(i,1);
  }

  $('progIn').style.width=(G.killed/G.totalEnemies*100)+'%';
  updateBars();
}

/* 장비 옵션발 버프(= 특전이 아니라 어느 특전 아이콘도 못 쓰는 경우)의 폴백 아이콘 —

const BUFF_STAT_IC={atk:'dmg',aspd:'aspd',critR:'critR',critF:'critF',def:'def',evade:'evade'};
function renderBuffBar(){
  const box=$('buffBar'); if(!box) return;
  if(!G||!G.player){ box.innerHTML=''; return; }
  const p=G.player, groups=new Map();
  for(const k in p.buffs) for(const b of p.buffs[k]){
    const id=b.src||('#'+k);
    const g=groups.get(id);
    if(g){ g.n++; if(b.q<g.q) g.q=b.q; }
    else groups.set(id,{n:1, q:b.q||0, k, perk:b.src?G.pxPerk[b.src]:null});
  }
  let html=[...groups.values()].sort((a,b)=>a.q-b.q).map(g=>{
    const cc = g.perk ? perkColor(g.perk) : '#9EA3AC';   /* ⚑ T119 — 등급색 부활: 버프 아이콘도 출처 특전의 등급색을 쓴다 */
    const ic = g.perk ? g.perk.ic : uiIcon(BUFF_STAT_IC[g.k]||'spark');
    return `<div class="buff-ic" style="--bc:${cc};--bg:${cc}55">${ic}`+
      (g.n>1?`<span class="cnt">${g.n}</span>`:'')+`</div>`;
  }).join('');
  /* ⚑ 횟수형 방어막 (T48) — 시간제 버프가 아니라 «장수» 라 buffs 에 안 들어간다.
     주인 지시(17:2X)대로 버프 아이콘 줄 맨 앞에 남은 장수 뱃지를 달아 따로 보여준다. */
  if(p.ward>0){
    const cc='#4FA3E8';   /* 방어막은 장비 옵션 축이라 특전색과 구분되는 파란색 */
    html=`<div class="buff-ic ward-ic" style="--bc:${cc};--bg:${cc}55">🛡️<span class="cnt">${p.ward}</span></div>`+html;
  }
  if(box.innerHTML!==html) box.innerHTML=html;
}
function renderPerkStrip(){
  const box=$('perkStrip'); if(!box) return;
  if(!G){ box.innerHTML=''; return; }
  const order=[], cnt=new Map();
  for(const pk of G.perksTaken){
    const id=pk.id||pk.tx;
    if(!cnt.has(id)){ cnt.set(id,0); order.push({pk,id}); }
    cnt.set(id,cnt.get(id)+1);
  }
  /* 칩 28px + 간격 4px. 폭을 못 재는 상황(화면 비표시)에서는 7칸으로 잡는다. */
  const w=box.clientWidth||224;
  const cap=Math.max(1,Math.floor((w+4)/32));
  let list=order, more=0;
  if(order.length>cap){
    /* «+N» 칩(.pv-more)은 28px 칩보다 넓다(글자 + 좌우 여백 7px) — 접을 때는 그 자리를 44px 로 잡는다.
       ⚑ T116 U01 에서 Info 버튼이 «작은 정사각» 이 되며 줄이 69% → 82% 로 넓어지자, 종전의
       «+N 도 28px» 가정이 1px 넘침으로 드러났다(T3 battle «줄이 자기 폭을 넘지 않는다» 실측). */
    const capF=Math.max(1,Math.floor((w+4-44)/32));
    more=order.length-capF; list=order.slice(order.length-capF);
  }
  const html=(more?`<div class="pv-more">+${more}</div>`:'')+list.map(o=>{
    const c=cnt.get(o.id), cc=perkColor(o.pk);   /* ⚑ T119 — 미리보기 줄 칩도 등급색 */
    return `<div class="pv-ic" style="--bc:${cc}">${o.pk.ic}`+(c>1?`<span class="cnt">${c}</span>`:'')+`</div>`;
  }).join('');
  if(box.innerHTML!==html) box.innerHTML=html;
}
