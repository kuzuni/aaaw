<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>꼬마기사 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    --grass:#7FBF52; --lobby-bg:#3E7B33; --lobby-bg-d:#2E5F26;
    --panel:#232327; --panel2:#2E2E34; --panel3:#3A3A42;
    --gold:#FFB92E; --hp:#E8483F; --shield:#38A6E8; --exp:#8BC93F;
    --ink:#FFFFFF; --ink-dim:#B9BDC4;
    --rare:#4FA3E8; --legend:#FFB92E; --common:#9EA3AC; --myth:#FF5E6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  body{
    margin:0; background:#141418; color:var(--ink);
    font-family:'Jua','Malgun Gothic',sans-serif;
    display:flex; justify-content:center; align-items:center; min-height:100vh;
    min-height:100dvh; /* 모바일 주소창 표시/숨김에 따라 실제 보이는 높이로 (T40) */
  }
  #frame{
    position:relative; aspect-ratio:9/19;
    height:100vh; max-height:100vh; max-width:100vw;
    width:min(100vw, calc(100vh * 9 / 19));
    /* T40 — dvh 지원 브라우저(모바일 크롬 108+)에서는 주소창을 뺀 실제 높이 기준.
       100vh 는 «주소창 숨김» 높이라 하단 5탭이 화면 밖으로 잘린다. */
    height:100dvh; max-height:100dvh;
    width:min(100vw, calc(100dvh * 9 / 19));
    background:var(--panel); overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  .screen.on{display:flex;}
  button{font-family:inherit; border:none; cursor:pointer; color:var(--ink); background:none;}
  button:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .pill{background:rgba(20,20,24,.72); border-radius:999px; padding:5px 13px; font-size:15px; display:flex; gap:7px; align-items:center;}

  /* ---------- LOBBY ---------- */
  #lobby{
    background:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><text x="18" y="70" font-size="44" opacity="0.05" transform="rotate(-20 60 60)">⚔</text></svg>'),
      radial-gradient(120% 80% at 50% 0%, #4A8C3D, var(--lobby-bg) 55%, var(--lobby-bg-d));
    align-items:center;
  }
  /* T54 — 축약 표기(최대 8자)를 담도록 상단 줄을 좁혔다. 구 값(gap 8 · padding 12 · pill 15px/13px · 전투력 18px)은
     골드가 «8.26M» 만 돼도 줄이 417px 로 부풀어 390/360 프레임 밖으로 나갔다(🔊 가 화면 밖). 여백·서체만 줄인 것으로는
     360px 를 못 맞춰서, 🔊 는 참고 스크린샷(메인로비.jpg)이 ☰ 를 놓은 자리 그대로 pill 줄 아래 오른쪽으로 뺐다.
     min-width:0 + 말줄임은 마지막 안전망이다 — 실제 도달 최대(챕터 300 «1.96No» · 10년 무과금 «9.13M»)에서는 걸리지 않는다. */
  /* ⚑ T64 — `--tf` 는 상단 줄 «전체» 배율이다(글자·여백·아바타·버튼을 한꺼번에 줄인다).
     T54 의 프레임 연동 글자는 clamp 하한 11px 에서 축소가 멈추는데 아바타 52px·여백은 처음부터 고정이라,
     프레임이 316px 아래로 내려가면(SE 375×667 + 주소창 = 278px · 320×568 = 269px) 줄이 넘쳐
     말줄임 안전망이 «수치» 를 갉아먹었다 — 전투력 «338» 이 «…» 로 떴다. 숫자는 잘리면 거짓이 되므로
     그 앞단에서 줄 전체를 비율로 줄인다. 값은 JS `fitTopRow()` 가 실측으로 정하고,
     ≥390px 프레임·평범한 값에서는 1 이라 종전과 픽셀 단위로 같다. */
  .lobby-top{--tf:1; width:100%; display:flex; align-items:center;
    gap:calc(6px * var(--tf)); padding:12px calc(10px * var(--tf)) 0;}
  /* 프레임 폭은 min(100vw, 100vh*9/19) 라 기기마다 다르다(390 · 360 · SE 는 316px — T40 이 «9:19 를 16:9 에
     넣을 수 없어 정상» 으로 판정한 값). 고정 14px 는 316px 프레임에서 세 수치를 못 담아 글자가 잘렸다 —
     프레임과 같은 식으로 글자를 함께 줄인다(316 → 11.4px · 360 → 13.0px · 390 이상 → 14px 로 고정). */
  .lobby-top .pill{font-size:calc(clamp(11px, calc(min(100vw, 100vh * 9 / 19) * .036), 14px) * var(--tf));
    padding:calc(5px * var(--tf)) calc(9px * var(--tf)); gap:calc(5px * var(--tf)); min-width:0;}
  .lobby-top .pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #avatar{width:calc(52px * var(--tf)); height:calc(52px * var(--tf));
    border-radius:14px; background:#5B87C7; border:3px solid #F2D34B; flex:none;}
  #powerPill{font-size:calc(clamp(12px, calc(min(100vw, 100vh * 9 / 19) * .041), 16px) * var(--tf)); color:var(--gold);}
  #sndBtnL,#sndBtnG{width:42px; height:42px; border-radius:12px; background:rgba(20,20,24,.72); font-size:17px; flex:none;}
  #sndBtnL{position:absolute; right:10px; top:72px; z-index:5;}   /* T54 — 상단 줄에서 빼 참고 스크린샷의 ☰ 자리로 */
  /* 챕터 300 대응(T36): 제목을 눌러 «챕터 이동» 팝업. 로비 구도(메인로비.jpg)는 그대로 — 크기·위치·서체 동일. */
  #lobbyChapName{margin-top:4vh; font-size:36px; letter-spacing:3px; text-shadow:0 3px 0 rgba(0,0,0,.35);
    padding:0; background:none; color:var(--ink); font-family:inherit;}
  .jump-row{display:flex; gap:8px; width:100%; margin-top:10px;}
  .jump-row button{flex:1; padding:12px 4px; border-radius:14px; background:var(--panel3); font-size:15px;}
  .jump-row button.gold{background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00;}
  .jump-row button:disabled{opacity:.4;}
  #jumpVal{width:100%; margin-top:12px; padding:12px; border-radius:14px; border:2px solid #3E3E48;
    background:#141418; color:var(--ink); font-family:inherit; font-size:26px; text-align:center;
    user-select:text; -webkit-user-select:text;}
  .chap-underline{width:190px; height:3px; margin:6px 0 2vh; background:rgba(255,255,255,.35); border-radius:9px; position:relative;}
  .chap-underline::after{content:''; position:absolute; left:50%; top:0; transform:translateX(-50%) rotate(45deg); width:10px; height:10px; border-right:3px solid rgba(255,255,255,.35); border-bottom:3px solid rgba(255,255,255,.35); background:transparent; margin-top:2px;}
  .dio-row{display:flex; align-items:center; gap:6px; width:100%; justify-content:center;}
  .dio-arrow{width:52px; height:64px; font-size:30px; color:rgba(255,255,255,.85); text-shadow:0 2px 2px rgba(0,0,0,.3);}
  .dio-arrow:disabled{opacity:.22; cursor:default;}
  #dioCard{
    width:62%; aspect-ratio:1.05; border-radius:22px; position:relative;
    background:#57964A; border:5px solid #7FB964; border-bottom:14px solid #4A3B2E;
    box-shadow:0 10px 24px rgba(0,0,0,.35); overflow:hidden;
  }
  #dioCv{position:absolute; inset:0; width:100%; height:100%;}
  #startBtn{
    margin-top:auto; margin-bottom:14px; padding:17px 0; width:74%; border-radius:20px; font-size:30px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00;
    box-shadow:0 6px 0 #C77E12, 0 10px 18px rgba(0,0,0,.3); letter-spacing:4px;
  }
  #startBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #C77E12;}
  .bottomNav{width:100%; display:flex; background:var(--panel); padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px; flex:none;}
  .nav-tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 7px; border-radius:14px; font-size:12px; color:var(--ink-dim); background:var(--panel2);}
  .nav-tab .nic{font-size:23px; line-height:0; display:block;}   /* 인라인 SVG(UI_SVG) — T2 7단계 */
  .nav-tab.mid{background:linear-gradient(#4A4A54,#3A3A42); color:var(--ink); transform:translateY(-6px); border:2px solid #5A5A66;}
  .nav-tab.locked{opacity:.5;}
  .nav-tab.sel{background:linear-gradient(#4A4A54,#3A3A42); color:var(--ink); border:2px solid #6A6A78;}

  /* ---------- 장비 / 상점 (참고: docs/ref 캐릭터 장비.jpg · 장비 세부팝업.jpg · 상점 (1)(2).jpg) ---------- */
  #gear,#shop{background:radial-gradient(120% 70% at 50% 0%, #35353E, #1E1E24 60%, #17171B);}
  /* ⚑ T64 — 장비·대장간·상점 상단 줄도 로비·인게임과 같은 병이다. `flex:1` 인데 min-width 가 무제한이라
     칸이 못 줄고, `justify-content:center` 라 넘친 만큼 «좌우로 반씩» 삐져나갔다(실측 269px 프레임에서 ±14.9px).
     같은 --tf 배율로 줄 전체를 줄인다 — 값은 JS `renderTopBars()` 가 실측으로 정한다. */
  .top-bar{--tf:1; display:flex; gap:calc(6px * var(--tf)); padding:10px calc(10px * var(--tf)) 6px;
    flex:none; justify-content:center;}
  .top-bar .pill{font-size:calc(14px * var(--tf)); flex:1; justify-content:center; min-width:0;
    padding:calc(5px * var(--tf)) calc(13px * var(--tf)); gap:calc(7px * var(--tf));}
  .top-bar .pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #gearHero{flex:none; display:flex; align-items:center; gap:6px; padding:8px 8px 4px;
    background:linear-gradient(#4A8C3D,#3E7B33); border-bottom:3px solid #2A5520;}
  .hero-col{display:flex; flex-direction:column; gap:6px; width:29%;}
  #gearAvatar{flex:1; height:150px; min-width:0; border-radius:14px; background:rgba(0,0,0,.12);}
  .slot-card{position:relative; height:46px; border-radius:11px; background:rgba(20,20,24,.55);
    border:2.5px solid #6A6A78; display:flex; align-items:center; justify-content:center; font-size:22px; padding:0;}
  .slot-card .lv{position:absolute; top:-6px; right:-2px; font-size:9.5px; background:#1C1C22; border-radius:99px; padding:1px 5px; color:var(--gold);}
  .slot-card .plus{position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); font-size:9.5px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; border-radius:99px; padding:0 5px;}
  .slot-card .pt{position:absolute; top:2px; left:4px; font-size:8.5px; color:var(--ink-dim);}
  .slot-card.empty{opacity:.6; border-style:dashed;}
  #gearStats{flex:none; display:flex; gap:6px; padding:7px 10px; justify-content:center;}
  #gearStats .gs{flex:1; background:rgba(20,20,24,.6); border-radius:12px; padding:6px 4px; text-align:center; font-size:14px;}
  #gearStats .gs small{display:block; font-size:10px; color:var(--ink-dim);}
  .gear-actionbar{flex:none; display:flex; align-items:center; gap:8px; padding:4px 10px 6px;}
  .even-note{flex:1; font-size:11px; color:var(--ink-dim); line-height:1.25;}
  /* T60 — `position:relative` 필수. `.bang`(!) 뱃지가 absolute 라 이게 없으면 버튼이 아니라
     조상 `#gear` 에 걸려 화면 우상단(top:-6·right:-4)으로 날아가 프레임 밖으로 잘린다. */
  #fuseBtn{position:relative; padding:9px 16px; border-radius:12px; font-size:15px; background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; box-shadow:0 3px 0 #C77E12;}
  #fuseBtn:disabled{filter:grayscale(.8); opacity:.55; box-shadow:none;}
  #invGrid{flex:1 1 auto; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(5,1fr);
    gap:6px; padding:8px 10px 10px; align-content:start;}
  /* 인벤 칸 — `docs/ref/캐릭터 장비.jpg`·`장비 합성 업글창.jpg` 구도: 등급색 타일 + 좌상단 부위 태그 + 하단 «장착» 띠 + 금색 +N */
  .inv-cell{position:relative; aspect-ratio:1; border-radius:11px; overflow:visible;
    border:2.5px solid #55555F; display:flex; align-items:center; justify-content:center; font-size:22px; padding:0;
    background:linear-gradient(#4A4A56,#2C2C34);}
  .inv-cell .plus{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); font-size:9px; z-index:2;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; border-radius:99px; padding:0 4px;}
  .inv-cell .eqm{position:absolute; inset:auto 0 0 0; font-size:8.5px; background:rgba(10,10,14,.72); border-radius:0 0 8px 8px;}
  .inv-cell .fus{position:absolute; top:-5px; right:-4px; font-size:9px; background:#E8483F; border-radius:99px; padding:0 4px; z-index:2;}
  /* 부위 태그 — 스크린샷의 좌상단 마름모 라벨 */
  .inv-cell .ptag,.fg-cell .ptag{position:absolute; top:-6px; left:-5px; font-size:8px; line-height:1.35; z-index:2;
    padding:1px 4px; border-radius:5px 5px 5px 0; color:#12121A; font-family:inherit;
    box-shadow:0 1px 0 rgba(0,0,0,.35);}
  /* 장비 아이콘(인라인 SVG) — 크기는 담는 칸의 font-size 를 그대로 따른다(1em). T2 6단계 */
  .gicon{display:inline-block; width:1em; height:1em; vertical-align:-.14em; flex:none;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));}
  .inv-empty{grid-column:1/-1; text-align:center; color:var(--ink-dim); font-size:13px; padding:26px 10px; line-height:1.5;}
  /* ---------- 합성(대장간) 화면 — 참고: docs/ref/장비 합성 업글창.jpg ---------- */
  #forge{background:radial-gradient(120% 70% at 50% 0%, #35353E, #1E1E24 60%, #17171B);}
  #forgeStage{flex:none; position:relative; display:flex; align-items:center; gap:10px; padding:10px 12px 12px;
    background:linear-gradient(#5B4636,#3E2F24); border-bottom:3px solid #241A13;}
  /* T62 — 재료 줄(`#fgMats`)은 «칸 3개 + 간격 2개» 로 폭이 고정이라 33% 열보다 넓어질 수 있다.
     `align-items:center` 라 넘치는 폭이 좌우로 반씩 삐져나가고, 왼쪽 초과분이 스테이지 패딩(12px)을
     넘기면 `#frame`(overflow:hidden) 에 잘렸다 — 좁은 폰(프레임 <382px)에서만 보이던 결함.
     세 값을 변수 한 곳에 묶어 두면 칸 크기를 바꿔도 하한이 따라 움직인다(㉚ 이 상시 감시). */
  :root{--fgCell:44px; --fgGap:5px;}
  #forgeCol{display:flex; flex-direction:column; align-items:center; gap:2px; width:33%;
    min-width:calc(var(--fgCell)*3 + var(--fgGap)*2);}
  .fg-slot{position:relative; width:74px; height:74px; border-radius:13px; display:flex; align-items:center;
    justify-content:center; font-size:30px; background:rgba(16,16,20,.55); border:3px solid #6A6A78;}
  .fg-slot.empty{border-style:dashed; color:#8A8A96;}
  .fg-slot .plus{position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); font-size:10px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; border-radius:99px; padding:0 5px;}
  .fg-up{font-size:19px; color:#5CD65C; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.4);}
  #fgMats{display:flex; gap:var(--fgGap);}
  .fg-cell{position:relative; width:var(--fgCell); height:var(--fgCell); border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:19px; background:rgba(16,16,20,.5); border:2.5px solid #6A6A78; padding:0;}
  .fg-cell.empty{border-style:dashed; color:#8A8A96; font-size:17px;}
  #fgBanner{flex:1; align-self:stretch; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:14px; line-height:1.5; background:rgba(10,10,14,.55); border-radius:12px; padding:8px 6px;}
  #fgBanner b{color:var(--gold);}
  .forge-actionbar{flex:none; display:flex; align-items:center; gap:8px; padding:7px 10px;
    background:linear-gradient(#4A3A2C,#3A2C21); border-bottom:2px solid #241A13;}
  .forge-actionbar button{position:relative; flex:1; padding:10px 4px; border-radius:12px; font-size:15px;}
  #fgAuto{background:linear-gradient(#5AA8E8,#3B7FC4); color:#08243D; box-shadow:0 3px 0 #285C93;}
  #fgFuse{background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; box-shadow:0 3px 0 #C77E12;}
  .forge-actionbar button:disabled{filter:grayscale(.8); opacity:.55; box-shadow:none;}
  .bang{position:absolute; top:-6px; right:-4px; width:16px; height:16px; border-radius:99px; background:#E8483F;
    font-size:11px; line-height:16px; color:#fff;}
  #fgGrid{flex:1 1 auto; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(5,1fr);
    gap:6px; padding:8px 10px 10px; align-content:start;}
  #fgGrid .inv-cell.sel{border-color:#5CD65C; box-shadow:0 0 12px rgba(92,214,92,.55);}
  #fgGrid .inv-cell.off{opacity:.32; filter:grayscale(.7);}
  .forge-back{flex:none; padding:7px 10px calc(7px + env(safe-area-inset-bottom)); background:var(--panel);}
  #fgBack{width:100%; padding:10px 4px; border-radius:12px; font-size:15px; background:var(--panel3);}
  #shopBody{flex:1 1 auto; min-height:0; overflow-y:auto; padding:4px 10px 12px;}
  .shop-sec{font-size:15px; color:var(--ink-dim); margin:12px 0 7px; text-align:center;}
  .gacha-card{border-radius:18px; padding:12px; background:linear-gradient(150deg,#5A3E8C,#8A4FA8 60%,#C05C9E);
    box-shadow:0 5px 0 rgba(0,0,0,.28);}
  .gacha-card .ttl{font-size:20px; text-shadow:0 2px 0 rgba(0,0,0,.35);}
  .gacha-card .pity{font-size:12px; background:rgba(10,10,14,.42); border-radius:10px; padding:5px 8px; margin:6px 0; line-height:1.45;}
  .gacha-btns{display:flex; gap:8px;}
  .gacha-btns button{flex:1; padding:11px 4px; border-radius:13px; font-size:15px;
    background:linear-gradient(#FFCB4D,#F5A623); color:#4A2E00; box-shadow:0 3px 0 #C77E12;}
  .gacha-btns button:disabled{filter:grayscale(.85); opacity:.6; box-shadow:none;}
  .gem-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .gem-card{border-radius:15px; padding:11px 8px; text-align:center; background:linear-gradient(#6E3B8E,#4A2A66); font-size:13px;}
  .gem-card .amt{font-size:19px; color:#FFD9F0;}
  .gem-card button{margin-top:7px; width:100%; padding:8px 4px; border-radius:11px; font-size:13.5px; background:var(--panel3);}
  .gem-card button:disabled{opacity:.5;}
  .pull-list{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%; margin:6px 0 12px;}
  .pull-list .inv-cell{font-size:20px;}
  .gd-opt{display:flex; gap:7px; align-items:flex-start; font-size:12.5px; text-align:left; padding:5px 7px;
    background:rgba(20,20,24,.5); border-radius:9px; margin-bottom:4px; line-height:1.3;}
  .gd-opt.lock{opacity:.42;}
  .gd-stat{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 7px; background:rgba(20,20,24,.5); border-radius:9px; margin-bottom:4px;}
  .gd-row{display:flex; gap:8px; width:100%; margin-top:8px;}

     칸이 줄지 못하고 «넘친 만큼 오른쪽으로 밀려» ☰ 가 프레임(overflow:hidden) 밖으로 나갔다 —

     일시정지·포기가 아예 눌리지 않았다. 로비와 같은 `--tf` 배율 + min-width:0 안전망으로 맞춘다. */

  .bar .txt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; text-shadow:0 1px 2px rgba(0,0,0,.6); font-variant-numeric:tabular-nums;}
  /* ⚑ 경험치 바 (주인 지시 2026-09-03 — 캡은 «레벨» 이 아니라 «EXP»). 캡이 ❤️·🛡️ 한 글자보다 넓어서
     «절대배치 캡 + 바 전체 가운데 숫자» 로는 둘이 겹친다 — 이 바만 가로 flex(캡 → 남은 폭 가운데 숫자)로 깐다.
     글자는 T54 선례대로 프레임 폭에 연동해 좁은 기기에서 줄이고, 캡·숫자에 z-index 를 줘

const $ = id => document.getElementById(id);
/* ── T54: 대형 수치 표기 (docs/ref 스크린샷 기준) ──────────────────────────────
   구 구현은 `toLocaleString('ko-KR')` 콤마 전체 표기였다. 골드는 챕터당 1.22 배로 자라
   챕터 300 에서 41자(«1,790,412,642,764,378,700,000,000,000,000»)가 되는데, 로비 상단
   줄은 그 폭을 감당하지 못해 골드 1,000,000(≈챕터 30~39) 부터 화면 밖으로 밀려났다.
   주인이 넣은 참고 스크린샷 4장이 표기 규약을 그대로 못박아 준다:
     ① 보유 골드   «10.54K» «11.54K»          → 1만 이상은 축약 (메인로비·캐릭터 장비·상점)
     ② 원화 가격   «₩1,700» «₩170,000»        → 콤마 전체 표기 (상점 (1))
     ③ 상품 수량   «12000» «25000» «1800»     → 콤마 없는 정수 (상점 (1))
     ④ 그 외 수치  «6122» «1055» «2258» «543» → 콤마 없는 정수 (전투력·스탯·보유 젬·적 HP)
   ①과 ④는 «1만» 을 경계로 갈리는 같은 함수다 — 관측 표본 9개가 전부 일치한다
   (10540·11540 은 축약 / 6122·1055·2258·543·4801·7845 은 평문).
   접미사 사다리는 1e36(Dc)까지 두고 그 밖은 지수 표기로 떨어뜨린다 — 슬롯 강화 비용이
   Lv150 에서 2.45e84 라 사다리만으로는 못 덮는다(위임 판단). 어느 쪽이든 최대 9자로 묶인다. */
const NUM_SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
const FMT_MIN = 1e4;                       /* 이 값 미만은 평문 정수 (스크린샷 ③④) */
const fmt = n => {
  n = Math.round(n);
  if(!Number.isFinite(n)) return n>0?'∞':'-∞';
  const a = Math.abs(n);
  if(a < FMT_MIN) return String(n);
  let i = Math.floor(Math.log10(a)/3), v = n/Math.pow(1000,i);
  if(Math.abs(v) >= 999.995){ i++; v = n/Math.pow(1000,i); }   /* 999,999 → «1000.00K» 이 아니라 «1.00M» */
  if(i >= NUM_SUF.length) return n.toExponential(2).replace('e+','e');
  return v.toFixed(2) + NUM_SUF[i];
};
const fmtWon = n => Math.round(n).toLocaleString('ko-KR');     /* ② 원화 가격 전용 — 축약 금지 */
const fmtQty = n => String(Math.round(n));                     /* ③ 상품 수량·횟수 — 콤마도 축약도 없음 */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}

/* ---- 뽑기 (PLAN §11.2) ---- */
function newGacha(){ return {p50:0,p10:0,pulls:0}; }
function gachaPull(st){
  st.pulls++; st.p50++; st.p10++;
  const pityM=st.p50>=GT.pityMyth, pityL=st.p10>=GT.pityLegend;
  let rar;
  if(pityM) rar=4;
  else{
    const r=grand()*100;
    rar = GT.rarRoll(r);            /* 임계는 GT.gachaRate 에서 파생 — 리터럴로 되돌리지 말 것 (T65) */
    if(pityL&&rar<3) rar=3;
  }
  if(rar===4){
    st.p50=0;
    /* 50천장과 10피티가 겹치면 신화 우선 · 전설 확정은 다음 뽑기로 이월(p10 유지) */
    if(!(pityM&&pityL)) st.p10=0;
  }else if(rar===3) st.p10=0;
  const t=GT.allTypes[Math.floor(grand()*GT.allTypes.length)];   /* 뽑기 스트림 (R11) */
  return {part:t.part,type:t.type,rar,plus:0};
}

/* ---- 합성 (PLAN §11.3) ---- */
const gearKey=g=>`${g.part}|${g.type}|${g.rar}|${g.plus}`;
/* 합성 산출물 규칙 — 자동(fuseAll)·수동(합성 화면) 둘 다 **이 함수 하나만** 쓴다.
   규칙을 두 곳에 적으면 T8·T9·T11·T12 계열(«같은 수치를 손으로 두 번 옮기다 어긋남») 이 재발한다.
   base = 재료 3개 중 최고 강화품(호출부가 정렬해서 넘긴다). */
function fuseMake(base){
  if(base.rar<3) return {part:base.part,type:base.type,rar:base.rar+1,plus:0};
  if(base.rar===3){
    const np=base.plus+1;
    return np>=GT.legendToMythPlus
      ? {part:base.part,type:base.type,rar:4,plus:0}            /* +10강 도달 → 신화 0강 변환 */
      : {part:base.part,type:base.type,rar:3,plus:np};
  }
  return {part:base.part,type:base.type,rar:4,plus:base.plus+1};   /* 신화 무한 강화 */
}
/* inv: 배열. equipped: Set(장착 중인 객체) — 재료에서 제외 */
function fuseAll(inv,equipped){
  let did=true,count=0;
  while(did){
    did=false;
    const groups=new Map();
    for(const g of inv){
      if(equipped.has(g))continue;
      const k=`${g.part}|${g.type}|${g.rar}`;
      if(!groups.has(k))groups.set(k,[]);
      groups.get(k).push(g);
    }
    for(const [k,arr] of groups){
      if(arr.length<3)continue;
      arr.sort((a,b)=>b.plus-a.plus);          /* 재료 중 최고 강화 기준 */
      const mats=arr.slice(0,3), base=mats[0];
      const made=fuseMake(base);
      for(const m of mats){const i=inv.indexOf(m);inv.splice(i,1);}
      inv.push(made);count++;did=true;
      break;                                    /* 인벤이 바뀌었으니 재그룹화 */
    }
  }
  return count;
}
const gearScore=g=>g.rar*1000+g.plus;           /* 등급 우선, 같은 등급이면 강화 (신화0>전설9 제약과 일관) */
function autoEquip(inv){
  const eq={};
  for(const g of inv){ const b=eq[g.part]; if(!b||gearScore(g)>gearScore(b))eq[g.part]=g; }
  return eq;                                    /* {part: gear|undefined} */
}

const evenBonus=b=>1+GT.evenStep*Math.floor(Math.min(...GT.parts.map(pt=>b.slots[pt]||0))/GT.evenPer);
function buildPower(b){
  if(b.flat)return b.flat;
  let atk=0,hp=0,sh=0;
  for(const pt of GT.parts){
    const g=b.eq[pt]; if(!g)continue;
    const m=GT.slotMul(b.slots[pt]||0)*(1+GT.plusStep*g.plus);
    atk+=GT.atk[g.rar]*m; hp+=GT.hp[g.rar]*m; sh+=GT.sh[g.rar]*m;
  }
  const ev=evenBonus(b);
  return {atk:(TUNE.pAtk0+atk)*ev, hp:(TUNE.pHp0+hp)*ev, sh:(TUNE.pSh0+sh)*ev};
}

/* ================= SAVE (v2 — 장비 포맷. 영구강화 up{} 폐지) ================= */
const SAVE_KEY='kkoma-knight-v2';
const SAVE_KEY_V1='kkoma-knight-v1';
function newSave(){
  const slots={}; for(const pt of GT.parts) slots[pt]=0;
  return {gold:0, gem:0, maxChapter:1, selChapter:1, muted:false,
    inv:[], eq:{}, slots, gacha:newGacha(), pulls:0, fuses:0, uid:1, freeDay:''};
}
let save=newSave();
try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    const s=JSON.parse(raw);
    if(s&&typeof s==='object') save=Object.assign(save,s);
  }else{
    /* v1(영구강화) 세이브 이월 — 강화 레벨은 폐지된 시스템이라 버리고 골드·진행도만 가져온다 */
    const old=localStorage.getItem(SAVE_KEY_V1);
    if(old){ const s=JSON.parse(old);
      if(s&&typeof s==='object'){ save.gold=s.gold|0; save.maxChapter=s.maxChapter|0; save.selChapter=s.selChapter|0; save.muted=!!s.muted; } }
  }
}catch(e){}
/* 정규화 — 손상·구버전 세이브를 여기서 한 번에 바로잡는다 */
save.maxChapter=Math.max(1,Math.min(save.maxChapter|0||1,300));   /* 챕터 상한 300 (PLAN §2.4) */
save.selChapter=Math.max(1,Math.min(save.selChapter|0||1,save.maxChapter));
save.gold=Math.max(0,+save.gold||0); save.gem=Math.max(0,+save.gem||0);
if(!Array.isArray(save.inv)) save.inv=[];
save.inv=save.inv.filter(g=>g&&GT.parts.includes(g.part)&&GOPT[g.type]&&g.rar>=0&&g.rar<=4)
  .map(g=>({u:Math.max(0,g.u|0), part:g.part, type:g.type, rar:g.rar|0, plus:Math.max(0,g.plus|0)}));
/* ⚑ T68 — uid «유일성» 보정. 종전엔 «uid 가 없는 항목»(`if(!g.u)`)만 봤다. 그래서 ① 같은 uid 가 둘인 세이브와
   ② `save.uid` 가 인벤 최대 uid 보다 뒤처진 세이브(구버전·부분 손상)가 그대로 통과했고, 그 다음 뽑기·합성이
   만든 신품이 **장착 중인 장비의 uid 를 그대로 재사용**했다. uid 는 인벤의 유일 키라(`invById`·`save.eq`·
   대장간 `FG` 가 전부 이걸로 장비를 집는다) 겹치는 순간 세부 팝업·해제·합성이 엉뚱한 장비를 집는다.
   순서: ① 중복은 나중 것을 0 으로 떨궈 새 번호를 받게 한다(먼저 나온 쪽이 `save.eq` 와의 연결을 유지).
        ② `save.uid` 를 남아 있는 최대 uid 위로 올린다. ③ 그제서야 번호 없는 항목에 배분한다.
   ②를 ③보다 먼저 해야 배분값이 다시 겹치지 않는다. */
save.uid=Math.max(1,save.uid|0);
{
  const seen=new Set();
  for(const g of save.inv){ if(!g.u) continue; if(seen.has(g.u)) g.u=0; else seen.add(g.u); }
  for(const u of seen) if(u>=save.uid) save.uid=u+1;
  for(const g of save.inv) if(!g.u) g.u=save.uid++;        /* uid 없는 항목(구버전·손상·중복 강등분) 보정 */
}
if(!save.slots||typeof save.slots!=='object') save.slots={};
for(const pt of GT.parts) save.slots[pt]=Math.max(0,Math.min(save.slots[pt]|0,GT.slotLvMax));
if(!save.eq||typeof save.eq!=='object') save.eq={};
for(const pt of GT.parts){ const u=save.eq[pt]; const g=save.inv.find(x=>x.u===u); if(!g||g.part!==pt) delete save.eq[pt]; }
if(!save.gacha||typeof save.gacha!=='object') save.gacha=newGacha();
save.gacha.p50=Math.max(0,save.gacha.p50|0); save.gacha.p10=Math.max(0,save.gacha.p10|0); save.gacha.pulls=Math.max(0,save.gacha.pulls|0);
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---- 인벤토리·장착 헬퍼 ---- */
const invById=u=>save.inv.find(g=>g.u===u)||null;
const equippedGear=pt=>invById(save.eq[pt]);
const isEquipped=g=>save.eq[g.part]===g.u;
/* 전투 스탯 계산용 빌드 (sim.js 의 build = {eq,slots} 와 같은 모양) */
function curBuild(){ const eq={}; for(const pt of GT.parts) eq[pt]=equippedGear(pt); return {eq,slots:save.slots}; }
function newGear(part,type,rar,plus){ return {u:save.uid++, part, type, rar, plus:plus||0}; }

/* ================= AUDIO (효과음만 — Web Audio 합성) ================= */
const AU={
  ctx:null, sfxG:null,
  init(){
    if(this.ctx) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.sfxG=this.ctx.createGain(); this.sfxG.gain.value=save.muted?0:0.5; this.sfxG.connect(this.ctx.destination);
    }catch(e){}
  },
  setMuted(m){
    save.muted=m; persist();
    if(this.ctx) this.sfxG.gain.value=m?0:0.5;
    document.querySelectorAll('#sndBtnL,#sndBtnG').forEach(b=>b.textContent=m?'🔇':'🔊');
  },
  midi(m){ return 440*Math.pow(2,(m-69)/12); },
  note(dest,m,t,dur,type,vol){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=this.midi(m);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.02);
  },
  play(name){
    if(!this.ctx||save.muted) return;
    const c=this.ctx, t=c.currentTime, S=this.sfxG;
    const blip=(f0,f1,dur,type,vol)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(S); o.start(t); o.stop(t+dur+0.02);
    };
    const nz=(dur,vol,fq)=>{
      const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=c.createBufferSource(); src.buffer=buf;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fq;
      const g=c.createGain(); g.gain.value=vol;
      src.connect(f); f.connect(g); g.connect(S); src.start(t);
    };
    switch(name){
      case 'click': blip(700,900,0.06,'square',0.12); break;
      case 'hit': nz(0.08,0.25,2400); blip(300,160,0.08,'square',0.16); break;
      case 'crit': nz(0.12,0.3,3600); blip(660,220,0.14,'sawtooth',0.2); blip(990,330,0.14,'square',0.12); break;
      case 'hurt': blip(220,90,0.16,'sawtooth',0.2); break;
      case 'arrow': nz(0.14,0.14,5000); blip(1400,400,0.12,'sine',0.08); break;
      case 'bolt': nz(0.15,0.3,4000); blip(1800,200,0.18,'sawtooth',0.18); break;
      case 'throw': nz(0.12,0.18,3000); blip(900,500,0.1,'triangle',0.08); break;
      case 'boom': nz(0.35,0.45,700); blip(160,40,0.35,'sawtooth',0.25); break;
      case 'coin': blip(1568,1568,0.06,'square',0.14); setTimeout(()=>{ if(!save.muted&&this.ctx){const tt=this.ctx.currentTime; this.note(S,93,tt,0.16,'square',0.14);} },60); break;
      case 'poof': nz(0.2,0.3,900); break;
      case 'shield': blip(2200,900,0.14,'triangle',0.2); break;
      case 'evade': blip(500,1500,0.1,'sine',0.1); break;
      case 'levelup': [72,76,79,84].forEach((m,i)=>this.note(S,m,t+i*0.09,0.22,'square',0.16)); break;
      case 'perk': [79,84,88].forEach((m,i)=>this.note(S,m,t+i*0.07,0.2,'triangle',0.18)); break;
      case 'heal': [72,76,79].forEach((m,i)=>this.note(S,m,t+i*0.1,0.3,'sine',0.15)); break;
      case 'devil': blip(140,50,0.5,'sawtooth',0.25); nz(0.4,0.15,500); break;
      case 'angel': [84,88,91,96].forEach((m,i)=>this.note(S,m,t+i*0.11,0.4,'sine',0.12)); break;
      case 'boss': blip(100,40,0.7,'sawtooth',0.3); nz(0.5,0.2,300); break;
      case 'win': [72,72,72,76,79,84].forEach((m,i)=>this.note(S,m,t+i*0.13,0.3,'square',0.16)); break;
      case 'lose': [64,62,60,55].forEach((m,i)=>this.note(S,m,t+i*0.22,0.4,'triangle',0.16)); break;
    }
  },
};

/* ================= 전투력 표시 (영구강화 4종은 PLAN §11.4 로 폐지 — 성장은 장비·슬롯 전담) ================= */
/* 표시 전용 지표(위임) — 밸런스에 쓰이지 않는다. 장비/슬롯을 올리면 오르는 단조 함수면 충분. */
function power(){
  const pw=buildPower(curBuild());
  /* ⚑ 주인 확정(2026-09-03) — 전투력 표시식 = 공×8 + (체+실)×1.5.
     종전 `공×8 + 체/2 + 실/4` 는 방어 축을 3~4배 저평가했다: 장비 표가 매기는 값(부위당 희귀 = 공 12.5 /
     체 58.3 / 실 91.7)으로 보면 공격력 1 = 체력 4.7 어치인데, 옛 가중치는 체력을 1/16 로 쳐서
     방어형 장비를 껴도 숫자가 거의 안 올랐다. 표시값 전용이라 전투 계산에는 한 글자도 안 들어간다. */
  return Math.round(pw.atk*8 + (pw.hp + pw.sh)*1.5);
}

/* ⚑ T64 — 상단 줄 자동 맞춤. 줄이 프레임 안에 못 들면 `--tf` 로 줄 «전체» 를 비율로 줄인다.
   말줄임(min-width:0)은 마지막 안전망인데 그게 «수치» 에 걸리면 숫자가 통째로 거짓이 되므로
   (전투력 «338» → «…» · 골드 «59.68Oc» → «59.…») 그 앞단에서 막는 것이 이 함수다.
   판정 2종: ① 수치 span 이 말줄임에 걸렸나 ② 줄이 자기 상자보다 넓나(인게임 ☰ 가 프레임 밖으로 밀린 축).
   1 부터 한 칸씩 내려가며 «안 걸리는 첫 배율» 을 쓴다 — 넉넉한 프레임에서는 첫 판에 1 로 끝난다. */
const TF_STEPS=[1,.94,.88,.82,.76,.70,.64,.58];
function fitTopRow(row,spans){
  if(!row||!row.offsetParent) return 1;                       /* 안 보이는 줄은 잴 수 없다(폭 0) */
  const el=[...spans].map(s=>typeof s==='string'?$(s):s).filter(Boolean);
  const over=()=>row.scrollWidth>row.clientWidth+1 || el.some(e=>e.scrollWidth>e.clientWidth+1);
  for(const t of TF_STEPS){ row.style.setProperty('--tf',t); if(!over()) return t; }
  return TF_STEPS[TF_STEPS.length-1];                         /* 하한까지 가도 남으면 말줄임이 받는다 */
}
const lobbyTopRow=()=>document.querySelector('.lobby-top');
const fitLobbyTop=()=>fitTopRow(lobbyTopRow(),['lbPower','lbGold','lbGem']);
/* 인게임 상단 줄(처치·골드) 갱신 한 곳. 처치 1건마다 불리므로 «글자 수가 바뀐 순간만» 다시 맞춘다 —
   fitTopRow 은 강제 레이아웃을 일으켜서, 매 처치마다 돌리면 후반 웨이브에서 프레임을 갉아먹는다. */
let gameTopKey='';
function syncGameTop(kills,gold){
  const ks=String(kills!==undefined?kills:(G?G.kills:0));
  const gs=fmt(gold!==undefined?gold:(G?G.gold:0));
  $('gKills').textContent=ks; $('gGold').textContent=gs;
  const key=ks.length+'/'+gs.length;
  if(key!==gameTopKey){
    gameTopKey=key;
    /* 같은 «자릿수» 라도 글자 폭은 다르다(실측 14px: «888.88» 42.83px vs «111.11» 39.7px). 자릿수로만 다시 맞추면
       그 3px 차이에서 다음 처치가 잘린다 — 그래서 잴 때만 숫자를 전부 8 로 바꿔 «그 자릿수의 최대 폭» 으로 맞춘다. */
    const k8=ks.replace(/\d/g,'8'), g8=gs.replace(/\d/g,'8');
    $('gKills').textContent=k8; $('gGold').textContent=g8;
    fitTopRow($('topbar'),['gKills','gGold']);
    $('gKills').textContent=ks; $('gGold').textContent=gs;
  }
}

/* ---- T36: 챕터 300 대응 이동 UI (게임 로직·밸런스 무관, 순수 UI) ----
   ① ◀▶ 를 누르고 있으면 연속 이동(가속) ② 제목 탭 → 챕터 이동 팝업(숫자 입력·±10·최신 해금) */
function chapStep(d){
  const v=clamp(save.selChapter+d,1,save.maxChapter);
  if(v===save.selChapter) return false;
  save.selChapter=v; renderLobby(); persist(); return true;
}
function holdRepeat(btn,d){
  let tmr=null, iv=300, moved=0;
  const stop=()=>{ if(tmr){ clearTimeout(tmr); tmr=null; } iv=300; moved=0; };
  const tick=()=>{
    if(!chapStep(d)){ stop(); return; }
    if(moved++%3===0) AU.play('click');
    iv=Math.max(45,iv*0.72);
    tmr=setTimeout(tick,iv);
  };
  btn.addEventListener('pointerdown',e=>{ e.preventDefault(); AU.play('click'); chapStep(d); tmr=setTimeout(tick,420); });
  for(const ev of ['pointerup','pointercancel','pointerleave']) btn.addEventListener(ev,stop);
}

/* ================= 합성 / 대장간 화면 (PLAN §11.3 · 참고: docs/ref/장비 합성 업글창.jpg) =================
   스크린샷의 «수동 3칸 선택» 구도: 재료 3칸 → ▲ → 결과 미리보기, 아래에 자동/합성 버튼과 인벤 그리드.
   ⚠ 산출물은 `fuseMake()` 하나만 쓴다 — 자동(fuseAll)과 규칙이 갈라질 수 없다.
   ⚠ 재료 제한은 엔진(sim.js accRefresh)과 같은 «장착분도 재료» 다. PLAN §11.3 의 «장착 제외(위임)» 와
      어긋나는 건 T41(승인 28번)로 등재돼 있고, 주인이 답하기 전에 게임만 바꾸면 sim 과 다시 벌어진다. */
let FG=[];                                   /* 선택된 재료 uid 배열 (최대 3) */
const fgMatsGear=()=>FG.map(invById).filter(Boolean);
function fgKey(g){ return `${g.part}|${g.type}|${g.rar}`; }
function openForge(){ FG=[]; showScreen('forge'); }
function renderForge(){
  renderTopBars();
  const mats=fgMatsGear();
  if(mats.length!==FG.length) FG=mats.map(g=>g.u);          /* 사라진 uid 정리 */
  const lock=mats.length?fgKey(mats[0]):null;
  /* 재료 3칸 */
  $('fgMats').innerHTML=[0,1,2].map(i=>{
    const g=mats[i];

      `<span class="ptag" style="background:${GT.rarColor[g.rar]}">${GT.partName[g.part]}</span>${gearIcon(g.type)}</button>`;
  }).join('');
  $('fgMats').querySelectorAll('.fg-cell').forEach(b=>b.onclick=()=>{
    const g=mats[+b.dataset.i]; if(!g) return;
    AU.play('click'); FG=FG.filter(u=>u!==g.u); renderForge();       /* 재료 칸을 누르면 해제 */
  });
  /* 결과 미리보기 — 3개가 다 찼을 때만 실제 산출물을 보여준다 */
  const res=$('fgResult');

function doPull(n){
  const cost=GT.pullCost*n;
  if(save.gem<cost){ toast('💎 다이아가 부족합니다'); return; }

    save.inv.push(g); got.push(g); save.pulls++;
  }
  autoEquipBest(); persist(); renderShop();
  const best=got.reduce((a,b)=>gearScore(b)>gearScore(a)?b:a);
  AU.play(best.rar>=3?'levelup':'perk');

}

function hash(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function drawDiorama(){
  const cvd=$('dioCv'), d=window.devicePixelRatio||1;
  const w=cvd.clientWidth,h=cvd.clientHeight;
  if(w===0) return;
  cvd.width=w*d; cvd.height=h*d;
  const c=cvd.getContext('2d'); c.setTransform(d,0,0,d,0,0);
  const ch=save.selChapter;
  const hues=[[87,150,74],[74,140,120],[100,120,60],[60,110,140]];
  const base=hues[(ch-1)%hues.length];
  c.fillStyle=`rgb(${base[0]},${base[1]},${base[2]})`; c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<5;i++){ c.beginPath(); c.arc(hash(ch*10+i)*w,hash(ch*20+i)*h,18+hash(ch*3+i)*20,0,7); c.fill(); }
  for(let i=0;i<3;i++){
    const x=w*(0.2+hash(ch*7+i)*0.6), y=h*(0.28+hash(ch*11+i)*0.34);
    c.fillStyle='#6B4A2B'; c.fillRect(x-4,y,8,22);
    c.fillStyle='#4E8C3B';
    c.beginPath(); c.arc(x,y-8,20,0,7); c.arc(x-13,y+2,13,0,7); c.arc(x+13,y+2,13,0,7); c.fill();
    c.fillStyle='rgba(255,255,255,.12)'; c.beginPath(); c.arc(x-6,y-14,7,0,7); c.fill();
  }
  for(let i=0;i<2;i++){
    const x=w*(0.15+hash(ch*13+i)*0.7), y=h*(0.62+hash(ch*17+i)*0.2);
    c.fillStyle='#B9C2CA'; c.beginPath(); c.ellipse(x,y,17,12,0,0,7); c.fill();
    c.fillStyle='#98A2AB'; c.beginPath(); c.ellipse(x-4,y+2,10,7,0,0,7); c.fill();
  }
  for(let i=0;i<3;i++){
    const x=w*(0.1+hash(ch*23+i)*0.8), y=h*(0.75+hash(ch*29+i)*0.15);
    c.fillStyle='#5E9C3B'; c.beginPath(); c.arc(x,y,11,0,7); c.arc(x+10,y+2,8,0,7); c.fill();
  }
  if(ch>=3){ c.font='22px serif'; c.fillText('💀', w*0.78, h*0.4); }
}

/* ================= 버프/스탯 엔진 (sim.js 와 1:1) ================= */
/* 발동 확률 (🌪️ 폭풍의 힘이면 1.22배 — sim.js pkk()) */
function pkk(p,ch){ return Math.random() < ch*(p.px.procX2?1.22:1); }
/* src = 이 버프를 준 px 키(주인 지시 07:0X «발동 중 버프 아이콘» 전용 표시 정보).
   sim.js 는 표시가 없어 5인자 그대로다 — 6번째 인자는 수치·판정에 일절 관여하지 않는다. */
let buffSeq=0;   /* q = 발동 순번 — 버프 아이콘을 «오래된 것이 위» 로 쌓는 기준 */
/* ⚑ 주인 확정(2026-09-03) — 시간제 버프의 중첩 상한 전부 삭제(무한 중첩). sim.js addBuff 와 1:1. */
function addBuff(p,k,amt,dur,src){
  p.buffs[k].push({t:dur,amt,src,q:++buffSeq});
  renderStatsGrid(); renderBuffBar();
}
function bsum(p,k){ let s=0; for(const b of p.buffs[k]) s+=b.amt; return s; }
/* 🃏 수집가 4종 — «보유한 특전 1개당». 실효 스탯에서 매번 세므로 나중에 얻는 특전까지 소급된다. */
function effDmg(p){
  const px=p.px; let m=1+bsum(p,'atk');
  if(px.rage&&p.sh<=0) m*=1.5;                       /* 장비 옵션 */
  return p.dmg*m;
}
function effAspd(p){ return p.aspd*(1+bsum(p,'aspd')); }
function effCritR(p){ return p.critR+bsum(p,'critR'); }
function effCritF(p){ return p.critF+bsum(p,'critF'); }
function effDef(p){ return Math.min(80,p.def+bsum(p,'def')); }
function effEvade(p){
  const px=p.px; let e=p.evade+bsum(p,'evade');
  if(px.lastStand&&p.hp<=p.maxHp*0.10) e+=40;        /* 장비 옵션 */
  return Math.min(90,e);
}
function effCounter(p){ return p.counter; }
/* ⚑ 실드 수리 한 곳 — 🔧 «실드 수리 효과 +100%» 가 여기서만 걸린다 (sim.js repair 와 1:1) */
function repair(p,amt){ if(amt<=0) return; p.sh=Math.min(p.maxSh,p.sh+amt*(1+p.repairAmp)); }
/* sim.js heal(p,amt,noBoost) 와 1:1 */
function heal(p,amt,noBoost){
  const px=p.px;
  if(!noBoost){
    amt*=1+p.healAmp;
    if(px.healBoost2&&pkk(p,0.20*px.healBoost2)) amt+=p.maxHp*0.02;
  }
  const over=Math.max(0,p.hp+amt-p.maxHp);
  p.hp=Math.min(p.maxHp,p.hp+amt);
  if(!noBoost){
    if(px.healDefBuff&&pkk(p,0.30*px.healDefBuff)) addBuff(p,'def',5*px.healDefBuff,3,'healDefBuff');
    if(px.healShield3&&pkk(p,0.20*px.healShield3)){ repair(p,p.maxSh*0.03); addText('💦','#6CC0F0'); }

function segGrow(seg,cache,c){
  if(cache[c]!==undefined) return cache[c];
  let v=1; for(let k=1;k<c;k++) v*=segRate(seg,k);
  cache[c]=v; return v;
}
const _hpGrow={}, _dmgGrow={};
function enemyStats(c,w){
  let hp=TUNE.eBaseHp*segGrow(TUNE.eHpSeg,_hpGrow,c)*(1+TUNE.waveHp*w);
  let dmg=TUNE.eBaseDmg*segGrow(TUNE.eDmgSeg,_dmgGrow,c)*(1+TUNE.waveDmg*w);
  if(c>=10){hp*=TUNE.wallHp; dmg*=TUNE.wallDmg;}
  if(c>=15){hp*=TUNE.wall2Hp; dmg*=TUNE.wall2Dmg;}
  if(c>=90){hp*=TUNE.wall3Hp; dmg*=TUNE.wall3Dmg;}     /* 90 대형 벽 (PLAN §11.7) */
  if(c>=300){hp*=TUNE.wall4Hp; dmg*=TUNE.wall4Dmg;}    /* 300 최종 벽 (PLAN §11.7) */
  return {hp:Math.round(hp), dmg:Math.round(dmg)};
}

/* ================= 챕터 레이아웃 (결정적 · sim.js 와 1:1) ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* ⚑ 악마의 거래 비용 (PLAN §2.4 · 주인 확정 2026-09-03 · T90) — «최대체력의 30% 를 **최대치에서** 깎는다».
   현재체력에서 깎던 종전 구현은 폐기 — 그 판 동안 최대체력 자체가 줄어든 채 진행한다.
   현재체력이 새 최대치를 넘으면 최대치로 클램프(위임 — 풀충전이 아니라 내림 클램프다).
   sim.js 와 같은 이름·같은 값이어야 한다
   (게이트 tools/verifyDevilPolicy.js 가 두 엔진을 대조하고 실측으로도 단언한다). */
const DEVIL_COST=0.30;
function payDevilCost(p){
  p.maxHp=Math.max(1,p.maxHp-p.maxHp*DEVIL_COST);
  p.hp=Math.min(p.hp,p.maxHp);
  return p.maxHp;
}
/* ⚑ 주인 확정 제약 (PLAN §2.4, 2026-09-02 14:2X) — 전 300 챕터 공통:
   ① 적 총 수 ≤ LAYOUT_MAXENEMY ② 쉼터 고정 ③ 악마 정확히 1 ④ 천사 정확히 1.

   적용: 기본공격 · 소환 5종 · 반격. 제외(위임): 가시 반사·오발 화살 — PROGRESS T43 근거. */

/* ⚑ T96 — 주기 소환·공속 램프·오버킬 회복·반격 연쇄·등급 확률 상수는 특전 132종과 함께 폐지됐다.
   장비 옵션이 쓰는 `autoBolt`(3초 주기)만 남는다. sim.js 와 1:1. */
/* ⚑ 방어막(ward)은 장수 상한이 없다(주인 확정 «무한»). */
function chapterLayout(c){
  /* ⚑⚑⚑ T100 (주인 확정 2026-09-03) — 새 경험치 곡선(5·Lv+1) 위에서 «완주 = 특전 10개» 를 다시 맞춘 구성.
     **전 챕터 동일 고정 구성**이고 제비뽑기는 «순서» 에만 남는다 (sim.js chapterLayout 과 1:1):
       웨이브 5 × 15마리 = 75 · 보스 1 → 적 **76마리**(상한 LAYOUT_MAXENEMY 80 이내)
       쉼터 2 (고정) · 악마 1 · 천사 1
     공급 = 75×3 + 9(보스) + 2×26(쉼터) = **286** ≥ 필요 Σ(5·L+1), L=1..10 = **285**
     → 완주하면 정확히 특전 10개(보스 전 공급 277 로 레벨업 9번 + 악마의 «다음 순번 앞당김» 1장).
     ⚑ 적 «수» 는 더 이상 난이도 노브가 아니다 — 난이도는 적 스탯(구간 성장률·벽 배수)으로만 만든다. */
  const rnd=mulberry(c*1013904223+77);
  const waveCount=LAYOUT_WAVES, size=LAYOUT_WAVE_SIZE;
  const evs=['devil','angel'];                                  /* 악마 1 · 천사 1 */
  for(let i=0;i<LAYOUT_RESTS;i++) evs.push('rest');             /* 쉼터 2 고정 */
  for(let i=evs.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=evs[i]; evs[i]=evs[j]; evs[j]=t; }
  const out=[];
  /* 웨이브 5 · 이벤트 4 — «웨이브 뒤 이벤트» 를 이벤트가 떨어질 때까지 반복하면 마지막 웨이브가 보스 앞에 붙는다 */
  for(let i=0;i<waveCount;i++){ out.push({t:'wave',size}); if(i<evs.length) out.push({t:evs[i]}); }
  out.push({t:'boss'});
  return out;
}
const ENEMY_SKINS=[
  {body:'#8A6B4F', hat:'cone',  weapon:'sword'},

function startChapter(c){
  const nodes=[]; let x=560, wi=0, totalEnemies=0;
  chapterLayout(c).forEach(nl=>{
    const type=nl.t;
    const node={type, x, done:false, enemies:[]};
    if(type==='wave'){
      const st=enemyStats(c,wi);
      for(let j=0;j<nl.size;j++){
        const ranged=Math.random()<0.4 && j>0;
        node.enemies.push({
          worldX:x+j*88, hp:st.hp, maxHp:st.hp, dmg:st.dmg,
          ranged, atkTimer:rand(0.4,1.2), stun:0, slow:0, aggro:false, wave:node, dead:false,
          skin: ranged?pick(RANGED_SKINS):pick(ENEMY_SKINS),
          exp:TUNE.expKill, isBoss:false, bob:Math.random()*7, hitT:0, strikeT:0,
        });
      }
      totalEnemies+=nl.size; wi++; x+=(nl.size-1)*88+560;
    }else if(type==='boss'){
      const st=enemyStats(c,wi);
      const bh=Math.round(st.hp*TUNE.bossHp), bd=Math.round(st.dmg*TUNE.bossDmg);
      node.enemies.push({
        worldX:x+60, hp:bh, maxHp:bh, dmg:bd,
        ranged:false, atkTimer:1.2, stun:0, slow:0, aggro:false, wave:node, dead:false,
        skin:{body:'#5A3247', hat:'horns', weapon:'axe'},
        exp:TUNE.expBoss, isBoss:true, hits:0, bob:0, hitT:0, strikeT:0,
      });
      totalEnemies+=1;
    }else{ x+=470; }
    nodes.push(node);
  });
  G={
    chapter:c, t:0, kills:0, gold:0, killed:0, totalEnemies,
    player:playerBase(), nodes, arrows:[], texts:[], parts:[], reaps:[],
    pprojs:[], bolts:[], procN:0,
    paused:false, over:false, cleared:false, pendingLevels:0, perksTaken:[], shake:0, bossWarned:false,
    perkChances:0, overBoltCd:0, autoBoltT:3,
    miss:0,   /* 적 회피 10% 로 빗나간 횟수 (PLAN §2.3) */
    pxPerk:{},   /* px 키 → 그 키를 올린 특전 (발동 중 버프 아이콘이 «해당 특전» 을 찾는 용도) */
  };
  G.player.G=G;   /* sim.js 의 p.G 와 동일 — 특전 ap 본문이 p.G.perkChances 를 쓴다 */
  $('chapHudName').textContent='CHAPTER '+c;
  $('progIn').style.width='0%';
  lastBars='';
  showScreen('game'); closeOverlay();
  gameTopKey=''; syncGameTop(0,0);      /* 줄이 화면에 뜬 «뒤» 에 맞춘다 — 숨은 줄은 폭이 0 이라 못 잰다 */
  renderStatsGrid(); updateBars(); renderBuffBar(); renderPerkStrip();
}

/* ================= COMBAT ================= */
function aliveEnemies(){
  const out=[];
  for(const n of G.nodes) for(const e of n.enemies) if(e.hp>0) out.push(e);
  return out;
}
/* 지금 «필드 위에» 있는 적이 속한 노드 = 플레이어가 상대하고 있는 최전방 노드. sim.js frontNode() 와 1:1.
   주인 확정 보강(15:2X): 관통형(창·검기)은 이 노드의 적만 맞는다 — 다음 웨이브 대기분은 절대 맞지 않는다.
   챕터의 적을 시작할 때 한꺼번에 만들어 두므로(노드 간격 560px, 창 사거리 88×8=704px) 필터가 없으면 꿰뚫린다. */
function frontNode(){ let b=null; for(const n of G.nodes) for(const e of n.enemies) if(e.hp>0&&(!b||e.worldX<b.worldX)) b=e; return b?b.wave:null; }
function randTarget(){
  const p=G.player;
  const pool=aliveEnemies().filter(e=>{const d=e.worldX-p.worldX; return d>-30&&d<540;});
  return pool.length?pick(pool):null;
}
/* ⚑ 주인 확정(2026-09-02 15:3X) — 소환 적중도 «공격» 이다: 소환(창/도끼/화살/번개/검기)이 적을 맞히면
   «공격 시 n%» 트리거를 굴린다(창이 창을 부르는 연쇄 허용). «치명타 시» 트리거는 `dealPlayerDamage` 안에 있어
   기본공격 전용이 아니었으므로 소환 적중에도 이미 걸린다 — 새로 붙는 것은 «공격 시» 쪽이다.
   **기본공격 전용으로 남는 것은 `nextCrit`/`nextAtk` 소모 · 분신 · 추가타 셋뿐**(PLAN §4, 주인 위임).
   소환 적중은 항상 아이콘 인자를 넘기므로 `nextCrit` 을 소모하지 않는다(sim.js 의 `fromBasic=false` 와 같다).
   성능 가드(주인 명시 허용) — `PROJ_CAP` 동시 활성 투사체 상한(초과분은 즉발 판정으로 대체) ·
   `PROC_TICK_CAP` 한 프레임에 굴리는 소환 적중 트리거 수 상한. 확률·연쇄 자체는 제한하지 않는다.
   sim.js:667~679 와 1:1 (게이트가 두 파일을 대조한다). */
const PROJ_CAP=200, PROC_TICK_CAP=200;
function summonHit(e,ratio,icon){
  dealPlayerDamage(e,ratio,icon);
  if(G.procN<PROC_TICK_CAP){ G.procN++; procOnAttack(e); }
}
function pushProj(pr){
  if(G.pprojs.length<PROJ_CAP){ G.pprojs.push(pr); return; }
  if(pr.hit){                                   /* 관통형(창·검기): 사거리 안 적을 앞에서부터 pierce 마리 */
    const list=aliveEnemies().filter(e=>(!pr.node||e.wave===pr.node)&&e.worldX>=pr.x-16&&e.worldX<=pr.maxX)
                              .sort((a,b)=>a.worldX-b.worldX);   /* pr.node = 미스폰·대기 웨이브 피격 금지 (주인 15:2X · T44) */
    for(const e of list.slice(0,pr.pierce)) projHit(pr,e);
  }else if(pr.tgt&&pr.tgt.hp>0) projHit(pr,pr.tgt);
}
/* 소환 적중 한 곳 — sim.js projHit 과 1:1 (투사체 해석 지점이 여러 곳이라 동사를 하나로 모았다).
   ⚑ T96 — 소환 개조 특전(회전·튕김·관통 기절)은 새 10종 체제에 없다. 도끼·화살·창 모두 «1개 = 1발». */
function projHit(pr,e){
  summonHit(e,pr.type==='axe'?R_AXE:pr.ratio,pr.type==='spear'?'🔱':(pr.type==='wave'?'🌊':(pr.type==='axe'?'🪓':'🏹')));
}
function castBolt(t){
  const p=G.player, px=p.px;
  G.bolts.push({x:t.worldX,t:0,seed:Math.random()*10});
  AU.play('bolt');
  summonHit(t,R_BOLT,'⚡');
}
/* «가장 가까운 적» — 💫👟·💫👑·연쇄 번개가 쓴다 (sim.js nearestTo 와 1:1) */
function nearestTo(ref,except){
  let b=null,bd=1e9;
  for(const e of aliveEnemies()){ if(e===except) continue; const d=Math.abs(e.worldX-ref); if(d<bd){ bd=d; b=e; } }
  return b;
}
/* ---------- 소환 5종 (sim.js fireAxe/fireArrows/fireBolts/fireWave/fireSpear 와 1:1) ----------
   주인 지시(2026-09-02 08:3X): 다연발은 동시 스폰 금지 — 50~70ms 간격 순차 연사, 발마다 판정·사운드. */
function volley(n,shot){
  shot(0);
  /* ⚑ T3-1 수리 — 간격을 «누적» 으로 쌓는다.
     종전 `k*(50+Math.random()*20)` 는 k 마다 난수를 새로 뽑아 «k번째 발의 절대 시각» 을 정했다.
     그래서 이웃한 두 발의 간격이 난수 차이만큼 벌어지거나 겹쳤다 — 24발 실측 0.6~171ms(평균 62),
     심하면 뒤 발이 앞 발보다 먼저 나간다. 주인 지시(08:3X)는 «발마다 50~70ms 간격의 순차 연사,
     낱발이 구별돼 보일 것» 이므로 간격 자체를 50~70ms 로 못박는다. 총 길이는 종전과 같다(평균 60ms×n). */
  let d=0;
  for(let k=1;k<n;k++){ d+=50+Math.random()*20; setTimeout(()=>{ if(G&&!G.over) shot(k); }, d); }
}
/* ⚑ 소환 발사 5종 — 발수 n 을 인자로 받는다(특전 텍스트의 «도끼 2개 / 화살 2발 / 번개 2회» 가 그대로 인자다).
   데미지 계수는 주인 확정 상수(R_AXE …). sim.js 의 같은 이름 함수와 1:1이고, 여기에만 순차 연사·사운드가 붙는다. */
function fireAxe(p,n){
  n=(n||1)*(p.px.axeCount?3:1);
  volley(n,()=>{ const t=randTarget(); if(!t)return; AU.play('throw');
    pushProj({type:'axe',x:p.worldX+14,tgt:t,ratio:R_AXE,spd:430,spin:0}); });
}
function fireArrows(p,n){
  const px=p.px; n=n||2;
  if(px.arrowCount) n=Math.round(n*1.5);            /* 장비 «화살 3발로 증가» (기본 2발 → 3발) */
  volley(n,()=>{ const t=randTarget(); if(!t)return; AU.play('arrow');
    pushProj({type:'parrow',x:p.worldX+14,tgt:t,ratio:R_ARROW,spd:560}); });
}
function fireBolts(p,n){
  n=(n||1)*(p.px.boltCount?2:1);
  volley(n,()=>{ const t=randTarget(); if(t) castBolt(t); });
}
function fireWave(p,n){
  const px=p.px; n=n||1;
  const big=false;                                  /* 거대 검기 개조 특전은 새 10종에 없다 */
  const pierce=big?WAVE_PIERCE_BIG:(px.waveKing?20:WAVE_PIERCE);
  const reach=big?88*SPEAR_PIERCE:(px.waveKing?1400:340);
  volley(n,()=>{ AU.play('throw');
    pushProj({type:'wave',x:p.worldX+14,ratio:R_WAVE,spd:470,maxX:p.worldX+reach,hit:new Set(),pierce,node:frontNode()}); });
}
function fireSpear(p,n){
  n=n||1;
  /* 창 관통 상한 8마리 — PLAN §3.0 «일직선 최대 8마리». 장비 «창 데미지» 옵션은 계수만 올린다. */
  volley(n,()=>{ AU.play('throw');
    pushProj({type:'spear',x:p.worldX+14,ratio:p.px.spearMaster?13.5:R_SPEAR,spd:520,maxX:p.worldX+88*SPEAR_PIERCE,hit:new Set(),pierce:SPEAR_PIERCE,node:frontNode()}); });
}
function gainExp(n){
  const p=G.player;
  p.exp+=n;
  let lev=0;
  while(p.exp>=expNeed(p.level)){ p.exp-=expNeed(p.level); p.level++; lev++; }
  /* 주인 지시(2026-09-02 06:3X): 챕터를 끝내는 보스 처치로 레벨업해도 특전 선택지·레벨업 팝업 없이 클리어로 */
  if(lev>0 && !G.over && !G.cleared){
    G.pendingLevels+=lev-1;
    openLevelUp();
  }
}
/* over = 이 처치에서 «초과된 데미지»(오버킬). 🩸 오버킬 힐 · 🔧⚡ 오버킬 수리가 이 값을 쓴다. */
function onKill(e,over){
  if(e.dead) return; e.dead=true;
  const p=G.player, px=p.px;
  G.kills++; G.killed++;
  const drop=Math.round(TUNE.goldKill(G.chapter)*p.goldMul);
  G.gold+=drop;
  syncGameTop();
  AU.play('poof'); AU.play('coin');
  poof(e.worldX,0);
  /* ⚑ T57 — 전투 중 유일하게 fmt 를 안 거치던 표기였다. 데미지·회복·반격은 전부 fmt 를 쓰는데
     이 한 줄만 raw number 라, 골드가 챕터당 1.22 배로 자라면서 챕터 150 에서 19자,
     챕터 240 부터는 JS 지수표기(«+9.25e+22 🪙»)가 캔버스에 그대로 떴다 — 게임 표기 규약(T54) 밖이다. */
  addText('+'+fmt(drop)+' 🪙','#FFD54F',e.worldX,-100);
  if(p.killHeal>0) heal(p,p.maxHp*p.killHeal);
  if(px.killShield3) repair(p,p.maxSh*0.05*px.killShield3);      /* 장비 옵션 */
  if(px.killShield10) repair(p,p.maxSh*0.10*px.killShield10);    /* 장비 옵션 */
  if(px.aspdKill) addBuff(p,'aspd',0.20*px.aspdKill,4,'aspdKill');
  if(px.killCritBuff&&pkk(p,0.30*px.killCritBuff)) addBuff(p,'critR',14,4,'killCritBuff');
  if(px.killDefBuff) addBuff(p,'def',10*px.killDefBuff,3,'killDefBuff');
  if(px.killAspd){ p.aspd*=1.01; renderStatsGrid(); }
  if(e.wave.enemies.every(x=>x.hp<=0)){
    e.wave.done=true;
    /* 웨이브 전멸 실드 무료충전 폐지 (주인 지시 2026-09-02 06:5X·08:5X) — 실드 충전은 특전으로만 */
  }
  /* 클리어 확정을 먼저 — 보스 경험치로 레벨업해도 특전 3택 없음 (PLAN §2.4 주인 지시) */
  if(e.isBoss){
    G.cleared=true; shake(10);
    gainExp(e.exp+(px.sage?1:0));
    /* ⚑ T61 — 클리어 화면을 700ms 미루는 동안 «이 전투» 를 고정한다. 종전 `if(G)` 는 그 사이에
       포기·재시작으로 G 가 다른 전투로 바뀌어도 통과해서, 한 대도 안 때린 챕터가 클리어 처리됐다
       (실측: 챕터 40 을 처치 0 으로 클리어 + 보너스 280.04K 지급). */
    const g=G;
    setTimeout(()=>{ if(G===g) openClear(); },700);
  }else gainExp(e.exp+(px.sage?1:0));
}
/* ⚑ T48 1단계 — 스턴 메커니즘 (주인 15:5X · PLAN §3.0). sim.js applyStun 과 같은 규칙:
   더 긴 쪽만 남기고(합산 금지) 보스는 STUN_BOSS_MUL 배. 게임 쪽은 여기에 «기절» 연출이 붙는다. */
function applyStun(e,sec){
  if(!e||e.hp<=0) return;
  const p=G.player;
  let s=sec;
  if(e.isBoss) s*=STUN_BOSS_MUL;
  const wasStunned = (e.stun||0)>0;
  e.stun=Math.max(e.stun||0,s);
  if(!wasStunned){
    AU.play('shield');
    addText('💫 기절!','#FFD54F',e.worldX,-104,true);
    sparks(e.worldX,-60,'#FFE9A0',7,150);
  }
}
/* ⚑ T48 1단계 — 빗맞음(onMiss) 트리거. sim.js procOnMiss 와 1:1. 호출 지점은 빗맞음이 실제로
   일어나는 두 곳(dealPlayerDamage · doCounter)뿐 — «MISS» 팝이 뜨는 자리와 같다. */
function procOnMiss(e){
  const p=G.player, px=p.px;
  if(px.missAtk) addBuff(p,'atk',0.10*px.missAtk,3,'missAtk');   /* ⚑ T1 R01 등급 내 재분배: +6% → +10% */
  if(px.missDef) addBuff(p,'def',10*px.missDef,3,'missDef');
  if(px.missAspd) addBuff(p,'aspd',0.12*px.missAspd,2,'missAspd');
  if(px.missReset&&pkk(p,0.30*px.missReset)) p.atkTimer=0;
  if(px.missRush){ p.atkTimer=0; p.nextAtk=Math.min(1.5,Math.max(p.nextAtk,1.0)); addText('💨 즉시 재공격!','#9CD2FF'); }
  if(px.missSpear&&pkk(p,0.20*px.missSpear)) fireSpear(p,1);
}
/* ⚑ T48 3단계 — 횟수형 방어막 (주인 17:2X). sim.js wardCap/gainWard 와 1:1.
   막을 때의 전용 이펙트와 남은 장수 뱃지는 아래 hitPlayer·renderBuffBar 가 맡는다. */
/* 상한 없음 — 주인 확정 «무한» (sim.js gainWard 와 1:1) */
function gainWard(p,ch){
  if(!ch||!pkk(p,ch)) return;
  p.ward++;
  addText('🛡️✨ x'+p.ward,'#9CD2FF');
  renderBuffBar();
}
/* ⚑ T48 2단계 — 원거리 피격 트리거 (주인 16:1X). sim.js procOnRanged 와 1:1.
   일반 «피격 시» 트리거와 별개 축이라 원거리 피격은 둘 다 굴린다. 회피에 성공하면 굴리지 않는다. */
/* dmg = 그 화살로 실제로 «받은 피해». 🏹🌵 는 이 값의 100% 를 되돌린다. */
function procOnRanged(src,dmg){
  const p=G.player, px=p.px;
  if(px.rangeShield&&pkk(p,0.10*px.rangeShield)){ repair(p,p.maxSh*0.04); addText('🏹🔋','#6CC0F0'); }
  if(px.rangeThorns&&src&&src.hp>0&&pkk(p,0.30*px.rangeThorns)) reflect(src,effDmg(p)*0.8,'🏹🌵');
  if(px.rangeBolt&&pkk(p,0.30*px.rangeBolt)) fireBolts(p,1);
  if(px.rangeSpear&&pkk(p,0.10*px.rangeSpear)) fireSpear(p,1);
}
/* 반사 한 곳 (sim.js reflect 와 1:1) — 반사는 «플레이어가 겨눈 타격» 이 아니라 적 회피를 타지 않는다. */
function reflect(src,amt,icon){
  if(!src||src.hp<=0||amt<=0) return;
  src.hp-=amt; src.hitT=0.15;
  addText((icon||'')+' '+fmt(amt),'#A5D6A7',src.worldX,-92);
  if(src.hp<=0) onKill(src,-src.hp);
}
function dealPlayerDamage(e,ratio,icon){
  if(e.hp<=0) return false;
  const p=G.player, px=p.px;
  const basic=(icon===undefined);
  const full=e.hp>=e.maxHp-0.5, stunned=e.stun>0;
  let cr=effCritR(p);
  if(px.fullHpCrit&&full) cr=Math.max(cr,62);                 /* 장비 옵션 */
  if(basic&&p.nextCrit) cr=100;
  const crit=Math.random()*100<cr;
  if(basic&&p.nextCrit) p.nextCrit=false;
  /* ⚑ 적 회피 10% (PLAN §2.3 주인 확정) — sim.js dealDmg 와 같은 자리(치명타 굴림 뒤).
     빗맞아도 nextCrit·nextAtk 는 소모된다(위임 기본값). «MISS» 팝 표시. */
  if(Math.random()<ENEMY_EVADE){
    G.miss++;
    AU.play('evade');
    addText('MISS','#9FB0C0',e.worldX,-84);
    procOnMiss(e);
    return false;
  }
  let d=effDmg(p)*ratio*(crit?effCritF(p)/100:1)*rand(0.92,1.08);
  /* 가산 보너스 풀 — sim.js dealDmg 와 같은 식 (주인 정정 16:3X: 배수 아님, 가산 +100%).
     빗맞음 스택은 적중 1타당 1개 소모하고, 몇 장이 쌓여 있든 한 타에는 +100% 한 번만. */
  let addBonus=0;
  if(full&&px.firstHit) addBonus+=0.20*px.firstHit;            /* 장비 옵션 */
  if(px.backDmg){                                             /* 장비 옵션 (순수 배수) */
    let front=null;
    for(const en of aliveEnemies()) if(!front||en.worldX<front.worldX) front=en;
    if(front&&e!==front) d*=3.2;
  }
  if(addBonus) d*=1+addBonus;
  if(px.execute&&e.hp<=e.maxHp*0.5) d*=2.2;                    /* 장비 옵션 */
  e.hp-=d; e.hitT=0.15;
  AU.play(crit?'crit':'hit');
  sparks(e.worldX-10,-40,crit?'#FFB92E':'#FFF3CF',crit?9:5,crit?190:130);
  if(crit) shake(3);
  addText((icon||'')+(crit?'💥':'')+fmt(d), crit?'#FFB92E':(icon?'#BFE3FF':'#FFFFFF'), e.worldX,-84,crit);
  /* ⑦ 생명 흡수 — «준 피해의 10% 회복». noBoost=true (sim.js 와 1:1):
     주인 문면이 «준 피해의 10%» 라 회복 증폭을 안 타고, «실드는 안 채움» 조항대로 오버킬 수리도 안 탄다. */
  if(p.steal>0) heal(p,d*p.steal/100,true);
  if(crit){
    if(px.critChain) addBuff(p,'critR',5*px.critChain,3,'critChain');
    if(px.critFsmall) addBuff(p,'critF',20*px.critFsmall,3,'critFsmall');   /* ⚑ T1 R01 등급 내 재분배: +10 → +20 */
    if(px.critFBuff) addBuff(p,'critF',34*px.critFBuff,4,'critFBuff');
    if(px.critAtkBuff) addBuff(p,'atk',0.15*px.critAtkBuff,4,'critAtkBuff');
    if(px.critAspdBuff) addBuff(p,'aspd',0.25*px.critAspdBuff,3,'critAspdBuff');
    if(px.critHealS&&pkk(p,0.20*px.critHealS)){ heal(p,p.maxHp*0.05); addText('❣️','#7ED957'); }
    if(px.critHeal3&&pkk(p,0.30*px.critHeal3)){ heal(p,p.maxHp*0.04); addText('❣️','#7ED957'); }
    if(px.critReset&&pkk(p,0.45*px.critReset)) p.atkTimer=0;
    if(px.stunCritM&&pkk(p,0.15*px.stunCritM)) applyStun(e,3);
    if(px.stunCritL&&pkk(p,0.35*px.stunCritL)) applyStun(e,3);
    gainWard(p,0.12*px.wardCrit);
  }
  if(px.execKill&&!e.isBoss&&e.hp>0&&e.hp<=e.maxHp*0.25){       /* 장비 옵션 */
    e.hp=0;
    addText('🧨 처형!','#FF6B6B',e.worldX,-104,true);
  }
  if(e.hp<=0) onKill(e,-e.hp);
  return crit;
}
/* e = 이번 «공격» 이 맞힌 적 (기절 축이 대상을 알아야 한다). 소환 적중에서도 불린다. */
function procOnAttack(e){
  const p=G.player, px=p.px;
  if(px.atkPerm&&pkk(p,0.10*px.atkPerm)){ p.dmg*=1.01; addText('🌱 공격력 UP','#7ED957',p.worldX,-104); renderStatsGrid(); }
  if(px.c_atkBuff&&pkk(p,0.30*px.c_atkBuff)) addBuff(p,'atk',0.05,3,'c_atkBuff');
  if(px.c_aspdBuff&&pkk(p,0.30*px.c_aspdBuff)) addBuff(p,'aspd',0.05,3,'c_aspdBuff');
  if(px.aspdStack10&&pkk(p,0.25*px.aspdStack10)) addBuff(p,'aspd',0.05,4,'aspdStack10');   /* 주인 예시 — 고중첩 상위 변형 */
  if(px.atkBuffM&&pkk(p,0.30*px.atkBuffM)) addBuff(p,'atk',0.14,4,'atkBuffM');
  if(px.atkBuffL&&pkk(p,0.25*px.atkBuffL)) addBuff(p,'atk',0.35,5,'atkBuffL');
  if(px.axe&&pkk(p,0.05*px.axe)) fireAxe(p,1);
  if(px.arrow2&&pkk(p,0.05*px.arrow2)) fireArrows(p,2);
  if(px.wave&&pkk(p,0.05*px.wave)) fireWave(p,1);
  if(px.spear&&pkk(p,0.05*px.spear)) fireSpear(p,1);
  if(px.bolt&&pkk(p,0.05*px.bolt)) fireBolts(p,1);
  if(px.arsenal&&pkk(p,0.05*px.arsenal)) pick([fireAxe,fireArrows,fireBolts,fireWave,fireSpear])(p,1);
  gainWard(p,0.10*px.wardAtk);
}
function doCounter(src,depth){
  const p=G.player, px=p.px;
  if(!src||src.hp<=0) return;
  /* 반격도 «플레이어의 타격» 이라 적 회피 10% 를 탄다 (PLAN §2.3). 빗맞으면 counterChain 도 끊긴다. */
  if(Math.random()<ENEMY_EVADE){
    G.miss++;
    AU.play('evade');
    addText('MISS','#9FB0C0',src.worldX,-80);
    procOnMiss(src);
    return;
  }
  const cd=effDmg(p)*0.7*(1+px.counterX);                        /* counterX = 장비 옵션 */
  src.hp-=cd; src.hitT=0.15;
  addText('반격 '+fmt(cd),'#FFD54F',src.worldX,-80);
  sparks(src.worldX,-40,'#FFD54F',5,130);
  if(px.counterAtkS) addBuff(p,'atk',0.05*px.counterAtkS,3,'counterAtkS');
  if(px.counterDefS) addBuff(p,'def',10*px.counterDefS,3,'counterDefS');
  if(px.counterAtkM) addBuff(p,'atk',0.14*px.counterAtkM,4,'counterAtkM');
  if(px.counterCrit) addBuff(p,'critR',14,3,'counterCrit');
  if(px.counterHeal) heal(p,p.maxHp*0.04*px.counterHeal);
  if(px.counterWave&&pkk(p,1.0*px.counterWave)) fireWave(p,1);
  /* ⑩ 반격 시 창 — 반격 1회당 50% 확률로 창 1개 (sim.js doCounter 와 1:1) */
  if(px.p_spearCt&&pkk(p,PERK_SUMMON_CH)) fireSpear(p,1);
  if(src.hp<=0) onKill(src,-src.hp);
  /* 🔂 반격하면 반드시 두 번 더 반격 — 연쇄 상한 3회 (무한 연쇄 금지는 유지) */
  else if(px.counterChain&&!depth) doCounter(src,1);
}
function playerStrike(e){
  const p=G.player, px=p.px;
  p.strikeT=0.16;
  let ratio=1;
  if(p.nextAtk>0){ ratio*=1+p.nextAtk; p.nextAtk=0; }
  const crit=dealPlayerDamage(e,ratio);
  if(px.clone&&e.hp>0) dealPlayerDamage(e,0.25,'👻');                  /* 장비 옵션 */
  if(crit&&px.extraHit&&pkk(p,0.75*px.extraHit)&&e.hp>0) dealPlayerDamage(e,2.3,'🗡️');   /* 장비 옵션 */
  procOnAttack(e);
}
function hitPlayer(dmg,isMelee,src){
  const p=G.player, px=p.px;
  if(Math.random()*100<effEvade(p)){
    AU.play('evade'); addText('회피!','#CFCFD8');
    if(px.evadeEvBuff) addBuff(p,'evade',8*px.evadeEvBuff,3,'evadeEvBuff');
    if(px.evadeAspd) addBuff(p,'aspd',0.10,2,'evadeAspd');   /* ⚑ T1 R01 등급 내 재분배: +5% → +10% */
    if(px.evadeDef) addBuff(p,'def',10*px.evadeDef,3,'evadeDef');
    if(px.evadeAtkBuff) addBuff(p,'atk',0.28*px.evadeAtkBuff,5,'evadeAtkBuff');
    if(px.evadeRush&&p.nextAtk<1.5){ p.nextAtk=Math.min(1.5,p.nextAtk+0.5*px.evadeRush); addText('🌀 공격 강화!','#9CD2FF'); }
    if(px.evadeCrit) p.nextCrit=true;
    if(px.evadeHeal&&pkk(p,0.15*px.evadeHeal)){ heal(p,p.maxHp*0.07); addText('🍀 +'+fmt(p.maxHp*0.07),'#7ED957'); }
    if(px.evadeShield&&pkk(p,0.15*px.evadeShield)){ repair(p,p.maxSh*0.10); addText('🔶 실드 수리','#6CC0F0'); }
    if(px.evadeCounter&&pkk(p,1.0*px.evadeCounter)) doCounter(src);
    if(px.evadeAxe&&pkk(p,0.10*px.evadeAxe)) fireAxe(p,1);
    gainWard(p,0.10*px.wardEvade);
    /* ⑨ 회피 시 화살 — 회피 1회당 50% 확률로 화살 1발 (sim.js 와 1:1) */
    if(px.p_arrowEv&&pkk(p,PERK_SUMMON_CH)) fireArrows(p,1);
    return;
  }
  /* ===== 맞았다 ===== */
  /* 횟수형 방어막 — 이 타격 «1회» 를 통째로 무효화하고 1장 소모한다 (수치형 실드보다 먼저).
     데미지만 완전 무효이고 «맞은 사건» 은 일어난 것이라 아래 피격 트리거들은 그대로 굴린다.
     sim.js hitPlayer 와 같은 순서·같은 조건. */
  const warded=p.ward>0;
  if(warded){
    p.ward--;
    wardFx();
    /* ===== 방어막 방어 트리거 ===== */
    renderBuffBar();
  }
  const nulled=warded;
  let d=nulled?0:dmg*(1-effDef(p)/100);
  if(!nulled&&px.guardCrystal&&p.sh>0) d*=0.80;
  p.hitT=0.15;
  if(!nulled&&p.sh>0){
    const ab=Math.min(p.sh,d); p.sh-=ab; d-=ab;
    sparks(p.worldX,-40,'#6CC0F0',5,120);
    if(d<=0) AU.play('shield');
  }
  if(d>0){
    p.hp-=d;
    AU.play('hurt');
    sparks(p.worldX,-40,'#FF8A80',6,140);
    addText('-'+fmt(d),'#FF8A80');
    if(p.hp<=0){
      if(px.revive>0){
        px.revive--;
        p.hp=p.maxHp*0.05; p.sh=p.maxSh*0.05;
        AU.play('angel'); shake(8);
        addText('♻️ 부활!','#FFD54F',p.worldX,-120,true);
        sparks(p.worldX,-50,'#FFD54F',14,220);
      }else{
        p.hp=0; updateBars(); openDead(); return;
      }
    }
  }
  if(px.defHitBuff) addBuff(p,'def',3*px.defHitBuff,3,'defHitBuff');
  if(px.defBuff2&&pkk(p,0.30*px.defBuff2)) addBuff(p,'def',14,4,'defBuff2');
  if(px.defBuffL&&pkk(p,0.20*px.defBuffL)) addBuff(p,'def',15,4,'defBuffL');
  if(px.wallBuff) addBuff(p,'def',5,4,'wallBuff');
  if(px.hitEvadeBuff&&pkk(p,0.22*px.hitEvadeBuff)) addBuff(p,'evade',14,3,'hitEvadeBuff');
  if(px.evadeHitBuff&&pkk(p,0.30*px.evadeHitBuff)) addBuff(p,'evade',15,3,'evadeHitBuff');
  /* 🚑 체력이 30% 아래로 떨어지면 실드 30% 즉시 충전 (판당 1번) */
  if(px.shieldOnHit&&pkk(p,0.05*px.shieldOnHit)){ repair(p,p.maxSh*0.05); addText('🔋','#6CC0F0'); }
  if(px.hitHeal&&pkk(p,0.15*px.hitHeal)){ heal(p,p.maxHp*0.02); addText('🩹','#7ED957'); }
  /* 피격 시 스턴 — 주인 필수 예시 «피격 시 (n% 확률로) 공격한 적 3초 스턴» (전설 l_stunHit3) */
  gainWard(p,0.08*px.wardHit);
  if(px.stunHitS&&src&&pkk(p,0.20*px.stunHitS)) applyStun(src,3);
  if(px.stunHitL&&src&&pkk(p,0.55*px.stunHitL)) applyStun(src,3);
  if(px.thornsS&&pkk(p,0.30*px.thornsS)) reflect(src,dmg*0.70,'🌿');
  if(px.thorns&&pkk(p,0.60*px.thorns)) reflect(src,dmg*1.5,'🌵');
  if(px.thornsKing) reflect(src,dmg*1.5,'🌵👑');
  /* ⑧ 피격 시 도끼 — 피격 1회당 50% 확률로 도끼 1개 (sim.js 와 1:1) */
  if(px.p_axeHit&&pkk(p,PERK_SUMMON_CH)) fireAxe(p,1);
  /* 원거리 피격 축 — 위 «피격 시» 트리거를 전부 굴린 «뒤» 에 추가로 굴린다 (별개 축, 주인 16:1X) */
  if(!isMelee) procOnRanged(src,dmg);
  if(isMelee&&src&&src.hp>0){
    const cc=Math.random()*100<effCounter(p);
    const pc=(px.hitCounter&&pkk(p,0.30*px.hitCounter))||(px.hitCounterS&&pkk(p,0.20*px.hitCounterS));
    if(cc||pc) doCounter(src);
  }
}

function update(dt){
  const p=G.player;
  G.t+=dt;
  G.procN=0;   /* 성능 가드: 소환 적중 트리거 예산은 프레임마다 리셋 (PROC_TICK_CAP) */
  G.shake=Math.max(0,G.shake-dt*40);
  p.strikeT=Math.max(0,p.strikeT-dt); p.hitT=Math.max(0,p.hitT-dt);
  if(G.overBoltCd>0) G.overBoltCd-=dt;

  /* 버프 타이머 */
  let bc=false;
  for(const k in p.buffs){
    const arr=p.buffs[k];
    for(let i=arr.length-1;i>=0;i--){ arr[i].t-=dt; if(arr[i].t<=0){ arr.splice(i,1); bc=true; } }
  }
  if(bc){ renderStatsGrid(); renderBuffBar(); }   /* 버프가 끝나면 아이콘 제거 (주인 지시 07:0X) */

  /* 파티클/텍스트 */
  for(let i=G.parts.length-1;i>=0;i--){
    const pt=G.parts[i]; pt.t+=dt;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=(pt.puff?-30:340)*dt;
    if(pt.t>pt.life) G.parts.splice(i,1);
  }
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i]; t.t+=dt;
    if(t.t>1.05) G.texts.splice(i,1);
  }
  for(let i=G.bolts.length-1;i>=0;i--){ G.bolts[i].t+=dt; if(G.bolts[i].t>0.3) G.bolts.splice(i,1); }
  for(let i=G.reaps.length-1;i>=0;i--){ G.reaps[i].t+=dt; if(G.reaps[i].t>0.45) G.reaps.splice(i,1); }

  const alive=aliveEnemies();
  /* ⚑ T61 — 보스가 죽으면(`G.cleared`) 그 순간 전투를 멈춘다. sim.js 는 `while(!G.dead&&!G.cleared&&…)`
     (sim.js:1003) 라 보스 사망 즉시 챕터가 끝나는데, 게임만 클리어 화면이 뜨는 700ms 동안 전투를 더 굴렸다.
     보스가 잡몹보다 먼저 죽는 상황(관통 창·번개 등 원거리 소환)에서 그 창에 플레이어가 맞아 죽으면
     «💀 쓰러졌다» 가 떴다가 0.7초 뒤 «🏆 클리어» 로 덮였다 — 실측 재현.
     보스가 마지막 1마리인 흔한 경우는 원래 `!alive.length` 로 여기서 멈추고 있었으므로,
     이 한 조건이 두 경우를 같게 만든다(연출·파티클·텍스트는 이 위에서 계속 흐른다). */
  if(!alive.length || G.cleared) return;

  /* 이벤트 노드 */
  for(const n of G.nodes){
    if(!n.done && (n.type==='rest'||n.type==='devil'||n.type==='angel') && p.worldX>n.x-95){
      n.done=true;
      if(n.type==='rest') openRest();
      else if(n.type==='devil') openDevil();
      else openAngel();
      return;
    }
  }

  /* 플레이어 */
  alive.sort((a,b)=>a.worldX-b.worldX);
  const tgt=alive[0];
  if(tgt.isBoss && !G.bossWarned && tgt.worldX-p.worldX<420){
    G.bossWarned=true; AU.play('boss'); shake(8);
    addText('⚠️ BOSS ⚠️','#FF5252',tgt.worldX,-150,true);
  }
  const dist=tgt.worldX-p.worldX;
  if(dist>74){
    p.worldX+=132*p.walkMul*dt; p.walking=true;
    p.atkTimer=Math.min(p.atkTimer,0.35);
  }else{
    p.walking=false;
    p.atkTimer-=dt*effAspd(p);
    if(p.atkTimer<=0){ p.atkTimer+=1; playerStrike(tgt); }
  }

  /* 뇌신 */
  if(p.px.autoBolt){
    G.autoBoltT-=dt;
    if(G.autoBoltT<=0){
      G.autoBoltT=3;   /* sim.js 와 동일 */
      volley(p.px.autoBolt,()=>{ const t2=randTarget(); if(t2) castBolt(t2); });
    }
  }
  /* ⚑ T96 — 주기형 자동 소환(⏰ 3종)·공속 램프(🎻)는 특전과 함께 폐지됐다.
     주기형 «공격» 축에 남는 것은 장비 옵션 `autoBolt`(위 3초) 하나뿐이다. */

  /* 적 (제자리 고정) */
  for(const e of alive){
    if(e.hp<=0) continue;
    e.hitT=Math.max(0,e.hitT-dt); e.strikeT=Math.max(0,e.strikeT-dt);
    /* ⚑ 스턴 (T48) — sim.js 와 같이 남은 시간만 줄이고 이번 틱 공격을 통째로 건너뛴다.
       공격 타이머는 흐르지 않는다(풀리자마자 밀린 공격이 몰아치지 않게 — 위임 기본값). */
    if(e.stun>0){
      e.stun-=dt; e.aggro=false;
      continue;
    }
    if(e.slow>0) e.slow-=dt;
    const d=e.worldX-p.worldX;
    const ivm=(e.slow>0?2:1);                    /* 둔화 — 적 상태 축만 남는다 */
    if(!e.ranged){
      e.aggro = d<290;
      if(d<105){
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer+=(e.isBoss?1.6:1.3)*ivm;
          e.strikeT=0.16;
          let dm=e.dmg;
          if(e.isBoss){ e.hits=(e.hits||0)+1; if(e.hits%3===0){ dm*=2.2; shake(8); addText('강타!','#FF5252',e.worldX,-130,true);} }
          hitPlayer(dm,true,e);
          if(G.over||G.paused) return;
        }
      }
    }else{
      if(d<440 && d>40){
        e.atkTimer-=dt;
        if(e.atkTimer<=0){
          e.atkTimer+=2.1*ivm; e.strikeT=0.16;
          AU.play('arrow');
          const friendly = p.misfire>0 && Math.random()<p.misfire;
          G.arrows.push({x:e.worldX-18,dmg:e.dmg,friendly,src:e});
        }
      }
    }
  }

  /* 적 화살 */
  for(let i=G.arrows.length-1;i>=0;i--){
    const a=G.arrows[i];
    a.x-=330*dt;
    let hit=false;
    if(a.friendly){
      for(const e of alive){
        if(e!==a.src && e.hp>0 && Math.abs(e.worldX-a.x)<16 && e.worldX<a.src.worldX){
          e.hp-=a.dmg*2; e.hitT=0.15;
          addText('오사! '+fmt(a.dmg*2),'#FFD54F',e.worldX,-92);
          sparks(e.worldX,-40,'#FFD54F',5,130);
          if(e.hp<=0) onKill(e,-e.hp);
          hit=true; break;
        }
      }
    }
    if(!hit && a.x<=p.worldX+8){ hitPlayer(a.dmg,false,a.src); hit=true; }
    if(hit || a.x<p.worldX-60) G.arrows.splice(i,1);
  }

  /* 플레이어 투사체 (도끼/화살/검기/창) */
  for(let i=G.pprojs.length-1;i>=0;i--){
    const pr=G.pprojs[i];
    pr.x+=pr.spd*dt;
    if(pr.type==='axe') pr.spin+=dt*16;
    let done=false;
    if(pr.type==='spear'||pr.type==='wave'){
      for(const e of aliveEnemies()){
        if(pr.node&&e.wave!==pr.node) continue;   /* 미스폰·대기 웨이브 피격 금지 (주인 15:2X) */
        if(!pr.hit.has(e)&&Math.abs(e.worldX-pr.x)<16){
          pr.hit.add(e);
          projHit(pr,e);
          if(pr.hit.size>=pr.pierce){ done=true; break; }
        }
      }
      if(pr.x>pr.maxX) done=true;
    }else{
      if(!pr.tgt||pr.tgt.hp<=0) done=true;
      else if(pr.x>=pr.tgt.worldX-10){ projHit(pr,pr.tgt); done=true; }
    }
    if(done) G.pprojs.splice(i,1);
  }

  $('progIn').style.width=(G.killed/G.totalEnemies*100)+'%';
  updateBars();
}

     는 effCounter 안에서만 더해지므로 반격 굴림은 제대로 올라가는데 HUD 숫자만 20.0% 에 얼어 있었다

  {k:'counter',lb:'반격 확률',  v:p=>effCounter(p).toFixed(1)+'%', cur:p=>effCounter(p), base:()=>statBase().counter},

];
/* 현재 장비 구성의 전투 시작 스탯 (특전 획득 전) — 전투마다 한 번만 계산해 캐시 */
let _statBase=null, _statBaseKey='';
function statBase(){
  const key=GT.parts.map(pt=>{const g=equippedGear(pt);return (g?g.type+g.rar+'+'+g.plus:'-')+':'+(save.slots[pt]|0);}).join(',');
  if(_statBase&&_statBaseKey===key) return _statBase;
  const p=playerBase();
  _statBaseKey=key;
  return _statBase={dmg:p.dmg, def:p.def, aspd:p.aspd, counter:p.counter, critR:p.critR, evade:p.evade, critF:p.critF};
}
function renderStatsGrid(){

/* ===== ⚑ 주인 지시(2026-09-02 07:0X) 인게임 UI 2건 (PLAN §2.3) =====
   ① 발동 중 버프 아이콘 — 화면 왼쪽 위·챕터 표시보다 아래, 등급색 테두리 + 중첩 수 뱃지, 오래된 것이 위.
   ② 얻은 특전 미리보기 줄 — Info 버튼 행 왼쪽 끝부터 획득 순서대로, 중복은 개수 뱃지, 넘치면 «+N».
   둘 다 표시 전용이라 전투 수치·판정에 관여하지 않는다 (sim.js 무관). */
/* 장비 옵션발 버프(= 특전이 아니라 어느 특전 아이콘도 못 쓰는 경우)의 폴백 아이콘 —
   스탯 그리드와 **같은 UI_SVG 표**를 쓴다(같은 스탯이 두 화면에서 다른 그림이 되지 않게). T2 7단계 */
const BUFF_STAT_IC={atk:'dmg',aspd:'aspd',critR:'critR',critF:'critF',def:'def',evade:'evade'};
function renderBuffBar(){
  const box=$('buffBar'); if(!box) return;
  if(!G||!G.player){ box.innerHTML=''; return; }
  const p=G.player, groups=new Map();
  for(const k in p.buffs) for(const b of p.buffs[k]){
    const id=b.src||('#'+k);
    const g=groups.get(id);
    if(g){ g.n++; if(b.q<g.q) g.q=b.q; }
    else groups.set(id,{n:1, q:b.q||0, k, perk:b.src?G.pxPerk[b.src]:null});
  }
  let html=[...groups.values()].sort((a,b)=>a.q-b.q).map(g=>{
    const cc = g.perk ? PERK_COLOR : '#9EA3AC';   /* ⚑ T96 — 등급이 없어 특전 버프는 한 색이다 */
    const ic = g.perk ? g.perk.ic : uiIcon(BUFF_STAT_IC[g.k]||'spark');
    return `<div class="buff-ic" style="--bc:${cc};--bg:${cc}55">${ic}`+
      (g.n>1?`<span class="cnt">${g.n}</span>`:'')+`</div>`;
  }).join('');
  /* ⚑ 횟수형 방어막 (T48) — 시간제 버프가 아니라 «장수» 라 buffs 에 안 들어간다.
     주인 지시(17:2X)대로 버프 아이콘 줄 맨 앞에 남은 장수 뱃지를 달아 따로 보여준다. */
  if(p.ward>0){
    const cc='#4FA3E8';   /* 방어막은 장비 옵션 축이라 특전색과 구분되는 파란색 */
    html=`<div class="buff-ic ward-ic" style="--bc:${cc};--bg:${cc}55">🛡️<span class="cnt">${p.ward}</span></div>`+html;
  }
  if(box.innerHTML!==html) box.innerHTML=html;
}
function renderPerkStrip(){
  const box=$('perkStrip'); if(!box) return;
  if(!G){ box.innerHTML=''; return; }
  const order=[], cnt=new Map();
  for(const pk of G.perksTaken){
    const id=pk.id||pk.tx;
    if(!cnt.has(id)){ cnt.set(id,0); order.push({pk,id}); }
    cnt.set(id,cnt.get(id)+1);
  }
  /* 칩 28px + 간격 4px. 폭을 못 재는 상황(화면 비표시)에서는 7칸으로 잡는다. */
  const w=box.clientWidth||224;
  const cap=Math.max(1,Math.floor((w+4)/32));
  let list=order, more=0;
  if(order.length>cap){ more=order.length-(cap-1); list=order.slice(order.length-(cap-1)); }
  const html=(more?`<div class="pv-more">+${more}</div>`:'')+list.map(o=>{
    const c=cnt.get(o.id), cc=PERK_COLOR;
    return `<div class="pv-ic" style="--bc:${cc}">${o.pk.ic}`+(c>1?`<span class="cnt">${c}</span>`:'')+`</div>`;
  }).join('');
  if(box.innerHTML!==html) box.innerHTML=html;
}
let lastBars='';
function updateBars(){
  if(!G) return;
  const p=G.player;
  const key=[p.exp,p.level,Math.round(p.hp),Math.round(p.sh),Math.round(p.maxHp),Math.round(p.maxSh)].join(',');
  if(key===lastBars) return;
  lastBars=key;
  $('expTxt').textContent=`${p.exp}/${expNeed(p.level)}`;
  document.querySelector('#expBar .fill').style.width=(p.exp/expNeed(p.level)*100)+'%';
  $('hpTxt').textContent=`${fmt(p.hp)}/${fmt(p.maxHp)}`;
  document.querySelector('#hpBar .fill').style.width=(p.hp/p.maxHp*100)+'%';
  $('shTxt').textContent=`${fmt(p.sh)}/${fmt(p.maxSh)}`;
  document.querySelector('#shBar .fill').style.width=(p.maxSh?p.sh/p.maxSh*100:0)+'%';
}

/* ================= RENDER ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
const LW=540; let LH=900, cam=0;

function drawCharOn(c,x,y,o){
  const s=o.s||1, f=o.f||1, bob=o.bob||0;
  const punch=(o.hitT? 1+o.hitT*1.4 : 1);
  const lunge=(o.strikeT? Math.sin(o.strikeT/0.16*Math.PI)*10*f : 0);
  c.save(); c.translate(x+lunge,y+bob); c.scale(s*punch,s*(1/punch));
  c.fillStyle='rgba(0,0,0,.15)';
  c.beginPath(); c.ellipse(0,2,15,4.5,0,0,7); c.fill();
  if(o.weapon==='bow'){
    c.strokeStyle='#7A5230'; c.lineWidth=2.6;
    c.beginPath(); c.arc(f*13,-22,10,f>0?-1.2:Math.PI-1.9, f>0?1.2:Math.PI+1.9); c.stroke();
    c.strokeStyle='#EEE'; c.lineWidth=1;
    c.beginPath(); c.moveTo(f*13+f*4,-31); c.lineTo(f*13+f*4,-13); c.stroke();
  }
  c.fillStyle=o.body||'#777';
  c.beginPath(); c.roundRect(-11,-27,22,27,9); c.fill();
  c.fillStyle=o.skin||'#F6D7A7';
  c.beginPath(); c.arc(0,-40,15,0,7); c.fill();
  c.fillStyle='#26262B';
  c.beginPath(); c.arc(f*4-4.5,-41,2.3,0,7); c.arc(f*4+4.5,-41,2.3,0,7); c.fill();
  if(o.hat==='helmet'){
    c.fillStyle='#AEB6BE';
    c.beginPath(); c.arc(0,-44,15.5,Math.PI,0); c.fill();
    c.beginPath(); c.roundRect(-17,-46,34,5,2); c.fill();
    c.fillStyle='#3E6FD8'; c.beginPath(); c.arc(0,-60,4.5,0,7); c.fill();
  }else if(o.hat==='cone'){
    c.fillStyle='#8A6B4F';
    c.beginPath(); c.moveTo(-14,-47); c.lineTo(14,-47); c.lineTo(0,-64); c.closePath(); c.fill();
    c.beginPath(); c.roundRect(-16,-49,32,4,2); c.fill();
  }else if(o.hat==='hood'){
    c.fillStyle='#5C6068';
    c.beginPath(); c.arc(0,-42,16,Math.PI*0.95,Math.PI*0.05); c.fill();
  }else if(o.hat==='horns'){
    c.fillStyle='#D84343';
    c.beginPath(); c.moveTo(-9,-50); c.lineTo(-16,-64); c.lineTo(-3,-53); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(9,-50); c.lineTo(16,-64); c.lineTo(3,-53); c.closePath(); c.fill();
  }else if(o.hat==='halo'){
    c.strokeStyle='#FFD54F'; c.lineWidth=3;
    c.beginPath(); c.ellipse(0,-62,10,3.5,0,0,7); c.stroke();
  }
  if(o.wings){
    c.fillStyle='rgba(255,255,255,.92)';
    c.beginPath(); c.ellipse(-16,-26,7,13,0.5,0,7); c.fill();
    c.beginPath(); c.ellipse(16,-26,7,13,-0.5,0,7); c.fill();
  }
  if(o.weapon==='sword'){
    c.save(); c.translate(f*13,-16); c.rotate(f*(0.5-(o.strikeT?o.strikeT*3:0)));
    c.fillStyle='#E8ECF0';
    c.beginPath(); c.moveTo(-3.5,-2); c.lineTo(f*24,-5); c.lineTo(f*27,0); c.lineTo(f*24,4); c.lineTo(-3.5,3); c.closePath(); c.fill();
    c.fillStyle='#C9A03B'; c.beginPath(); c.roundRect(f>0?-4:-2,-6,4,12,2); c.fill();
    c.fillStyle='#7A5230'; c.beginPath(); c.roundRect(f>0?-9:3,-2.5,6,5,2); c.fill();
    c.restore();
  }else if(o.weapon==='axe'){
    c.save(); c.translate(f*13,-15); c.rotate(f*(0.35-(o.strikeT?o.strikeT*3:0)));
    c.fillStyle='#7A5230'; c.beginPath(); c.roundRect(-1.8,-16,3.6,20,2); c.fill();
    c.fillStyle='#D2691E';
    c.beginPath(); c.moveTo(0,-16); c.quadraticCurveTo(f*14,-16,f*13,-4); c.quadraticCurveTo(f*5,-8,0,-6); c.closePath(); c.fill();
    c.restore();
  }
  c.restore();
}
