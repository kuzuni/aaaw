/* ================= RENDER ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
const LW=540; let LH=900, cam=0;

function drawCharOn(c,x,y,o){
  const s=o.s||1, f=o.f||1, bob=o.bob||0;
  const punch=(o.hitT? 1+o.hitT*1.4 : 1);
  const lunge=(o.strikeT? Math.sin(o.strikeT/0.16*Math.PI)*10*f : 0);
  c.save(); c.translate(x+lunge,y+bob); c.scale(s*punch,s*(1/punch));
  c.fillStyle='rgba(0,0,0,.15)';
  c.beginPath(); c.ellipse(0,2,15,4.5,0,0,7); c.fill();
  if(o.weapon==='bow'){
    c.strokeStyle='#7A5230'; c.lineWidth=2.6;
    c.beginPath(); c.arc(f*13,-22,10,f>0?-1.2:Math.PI-1.9, f>0?1.2:Math.PI+1.9); c.stroke();
    c.strokeStyle='#EEE'; c.lineWidth=1;
    c.beginPath(); c.moveTo(f*13+f*4,-31); c.lineTo(f*13+f*4,-13); c.stroke();
  }
  c.fillStyle=o.body||'#777';
  c.beginPath(); c.roundRect(-11,-27,22,27,9); c.fill();
  c.fillStyle=o.skin||'#F6D7A7';
  c.beginPath(); c.arc(0,-40,15,0,7); c.fill();
  c.fillStyle='#26262B';
  c.beginPath(); c.arc(f*4-4.5,-41,2.3,0,7); c.arc(f*4+4.5,-41,2.3,0,7); c.fill();
  if(o.hat==='helmet'){
    c.fillStyle='#AEB6BE';
    c.beginPath(); c.arc(0,-44,15.5,Math.PI,0); c.fill();
    c.beginPath(); c.roundRect(-17,-46,34,5,2); c.fill();
    c.fillStyle='#3E6FD8'; c.beginPath(); c.arc(0,-60,4.5,0,7); c.fill();
  }else if(o.hat==='cone'){
    c.fillStyle='#8A6B4F';
    c.beginPath(); c.moveTo(-14,-47); c.lineTo(14,-47); c.lineTo(0,-64); c.closePath(); c.fill();
    c.beginPath(); c.roundRect(-16,-49,32,4,2); c.fill();
  }else if(o.hat==='hood'){
    c.fillStyle='#5C6068';
    c.beginPath(); c.arc(0,-42,16,Math.PI*0.95,Math.PI*0.05); c.fill();
  }else if(o.hat==='horns'){
    c.fillStyle='#D84343';
    c.beginPath(); c.moveTo(-9,-50); c.lineTo(-16,-64); c.lineTo(-3,-53); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(9,-50); c.lineTo(16,-64); c.lineTo(3,-53); c.closePath(); c.fill();
  }else if(o.hat==='halo'){
    c.strokeStyle='#FFD54F'; c.lineWidth=3;
    c.beginPath(); c.ellipse(0,-62,10,3.5,0,0,7); c.stroke();
  }
  if(o.wings){
    c.fillStyle='rgba(255,255,255,.92)';
    c.beginPath(); c.ellipse(-16,-26,7,13,0.5,0,7); c.fill();
    c.beginPath(); c.ellipse(16,-26,7,13,-0.5,0,7); c.fill();
  }
  if(o.weapon==='sword'){
    c.save(); c.translate(f*13,-16); c.rotate(f*(0.5-(o.strikeT?o.strikeT*3:0)));
    c.fillStyle='#E8ECF0';
    c.beginPath(); c.moveTo(-3.5,-2); c.lineTo(f*24,-5); c.lineTo(f*27,0); c.lineTo(f*24,4); c.lineTo(-3.5,3); c.closePath(); c.fill();
    c.fillStyle='#C9A03B'; c.beginPath(); c.roundRect(f>0?-4:-2,-6,4,12,2); c.fill();
    c.fillStyle='#7A5230'; c.beginPath(); c.roundRect(f>0?-9:3,-2.5,6,5,2); c.fill();
    c.restore();
  }else if(o.weapon==='axe'){
    c.save(); c.translate(f*13,-15); c.rotate(f*(0.35-(o.strikeT?o.strikeT*3:0)));
    c.fillStyle='#7A5230'; c.beginPath(); c.roundRect(-1.8,-16,3.6,20,2); c.fill();
    c.fillStyle='#D2691E';
    c.beginPath(); c.moveTo(0,-16); c.quadraticCurveTo(f*14,-16,f*13,-4); c.quadraticCurveTo(f*5,-8,0,-6); c.closePath(); c.fill();
    c.restore();
  }
  c.restore();
}

function drawHpBar(x,y,w,frac,txt,color){
  ctx.fillStyle='#141418';
  ctx.beginPath(); ctx.roundRect(x-w/2-1.5,y-1.5,w+3,15,5); ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.roundRect(x-w/2,y,Math.max(3,w*clamp(frac,0,1)),12,4); ctx.fill();
  ctx.fillStyle='#FFF'; ctx.font='10.5px Jua'; ctx.textAlign='center';
  ctx.fillText(txt,x,y+10);
}

function drawFire(x,y,t){
  ctx.fillStyle='#7A5230';
  ctx.save(); ctx.translate(x,y);
  ctx.rotate(0.5); ctx.fillRect(-16,-3,32,6); ctx.rotate(-1); ctx.fillRect(-16,-3,32,6);
  ctx.restore();
  const fl=Math.sin(t*9)*3;
  ctx.fillStyle='#F5A623';
  ctx.beginPath(); ctx.ellipse(x,y-16+fl*0.3,10,16+fl,0,0,7); ctx.fill();
  ctx.fillStyle='#FFD54F';
  ctx.beginPath(); ctx.ellipse(x,y-12+fl*0.3,5.5,9+fl*0.6,0,0,7); ctx.fill();
}

function drawScene(){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(w===0) return;
  if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  const sc=cv.width/LW; LH=cv.height/sc;
  ctx.setTransform(sc,0,0,sc,0,0);

  const p=G?G.player:null;
  cam=p?Math.max(0,p.worldX-150):0;
  const t=G?G.t:0;
  if(G&&G.shake>0){ ctx.translate(rand(-G.shake,G.shake)*0.5,rand(-G.shake,G.shake)*0.5); }
  /* ⚑ T116 U03 — 레퍼런스(`ref-layout.md` ②)는 지면 띠가 프레임 y30.0 h21.0, 캐릭터 발밑이 y40.0 이다.
     캔버스는 프레임의 위 69.4% 를 차지하므로 프레임 % ÷ 69.4 가 여기 쓰는 LH 배율이다:
       지면 위 30.0 → .432 · 지면 아래 51.0 → .735 · 발밑 40.0 → .576.
     종전 값(.47/.78/.615)은 각각 32.6 / 54.1 / 42.7 이라 띠와 캐릭터가 통째로 2.6%p 내려와 있었다.
     발밑이 올라가면 체력 라벨 줄(`drawHpBar(x, gy+12)`)도 같이 따라 올라간다 — 두 행이 한 번에 맞는다.
     ⚠ 이 세 값은 **그리기 전용**이다(`sim.js` 에 없다 · 게이트가 읽지 않는다) — 밸런스와 무관하다. */
  const gy=LH*0.576;
  const pathTop=LH*0.432, pathBot=LH*0.735;

  ctx.fillStyle='#8CC85E'; ctx.fillRect(-20,-20,LW+40,pathTop+20);
  ctx.fillStyle='#C9A470'; ctx.fillRect(-20,pathTop,LW+40,pathBot-pathTop);
  ctx.fillStyle='#7FBF52'; ctx.fillRect(-20,pathBot,LW+40,LH-pathBot+40);
  ctx.fillStyle='#6FAE47';
  for(let x=-((cam)%36)-36;x<LW+36;x+=36){
    ctx.beginPath(); ctx.arc(x,pathTop,9,0,Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(x+18,pathBot,9,Math.PI,0); ctx.fill();
  }
  for(let i=Math.floor(cam/90)-1;i<Math.floor((cam+LW)/90)+2;i++){
    const hx=hash(i), x=i*90+hx*50-cam;
    if(hx<0.28){
      const ty=pathTop*(0.28+hash(i+9)*0.5);
      ctx.fillStyle='#7A5230'; ctx.fillRect(x-5,ty,10,26);
      ctx.fillStyle='#5E9C3B';
      ctx.beginPath(); ctx.arc(x,ty-8,22,0,7); ctx.arc(x-15,ty+2,14,0,7); ctx.arc(x+15,ty+2,14,0,7); ctx.fill();
    }else if(hx<0.5){
      const by=pathBot+18+hash(i+3)*(LH-pathBot-40);
      ctx.fillStyle='#5E9C3B';
      ctx.beginPath(); ctx.arc(x,by,13,0,7); ctx.arc(x+12,by+3,9,0,7); ctx.fill();
    }else if(hx<0.68){
      const fy=hash(i+5)<0.5? pathTop*0.6 : pathBot+20+hash(i+7)*(LH-pathBot-45);
      ctx.fillStyle=hash(i+2)<0.5?'#F2D34B':'#F2F2F2';
      for(let k=0;k<5;k++){ const a=k/5*Math.PI*2; ctx.beginPath(); ctx.arc(x+Math.cos(a)*4.4,fy+Math.sin(a)*4.4,3,0,7); ctx.fill(); }
      ctx.fillStyle='#F5A623'; ctx.beginPath(); ctx.arc(x,fy,2.8,0,7); ctx.fill();
    }else if(hx<0.78){
      ctx.fillStyle='#C4CDD4';
      ctx.beginPath(); ctx.ellipse(x,pathTop*0.7,15,10,0,0,7); ctx.fill();
      ctx.fillStyle='#AEB6BE';
      ctx.beginPath(); ctx.ellipse(x-4,pathTop*0.7+2,9,6,0,0,7); ctx.fill();
    }
  }

  if(!G) return;

  for(const n of G.nodes){
    const x=n.x-cam;
    if(x<-80||x>LW+80) continue;
    if(n.type==='rest'&&!n.done) drawFire(x,gy,t);
    else if(n.type==='devil'&&!n.done) drawCharOn(ctx,x,gy,{s:1.15,f:-1,body:'#5A3247',skin:'#C77E9E',hat:'horns',bob:Math.sin(t*3)*2});
    else if(n.type==='angel'&&!n.done) drawCharOn(ctx,x,gy,{s:1.15,f:-1,body:'#F2F2F6',skin:'#F6D7A7',hat:'halo',wings:true,bob:Math.sin(t*2.2)*4-4});
  }

  for(const n of G.nodes) for(const e of n.enemies){
    if(e.hp<=0) continue;
    const x=e.worldX-cam;
    if(x<-90||x>LW+90) continue;
    const s=e.isBoss?1.7:1;
    drawCharOn(ctx,x,gy,{s,f:-1,body:e.skin.body,hat:e.skin.hat,weapon:e.skin.weapon,
      bob:Math.sin(t*7+e.bob)*(e.aggro?2.5:1), hitT:e.hitT, strikeT:e.strikeT});
    drawHpBar(x,gy+12,e.isBoss?88:56,e.hp/e.maxHp,fmt(e.hp),'#E8483F');
    /* ⚑ 스턴 표시 (T48) — 머리 위 💫 가 돌고 남은 시간을 같이 보여준다 (주인 15:5X «스턴 표시 + 남은 시간») */
    if(e.stun>0){
      const hy=gy-(e.isBoss?96:66);
      ctx.save();
      ctx.translate(x,hy);
      ctx.rotate(Math.sin(t*7)*0.5);
      ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💫',0,0);
      ctx.restore();
      ctx.fillStyle='#FFE9A0'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
      ctx.fillText(e.stun.toFixed(1)+'s',x,hy+15);
    }
  }

  /* ⚑ 사신의 낫 연출 (T48) — 적 위를 큰 낫이 호를 그리며 훑고 붉은 참격선이 남는다 */
  for(const rp of G.reaps){
    const x=rp.x-cam, k=Math.min(1,rp.t/0.45);
    ctx.save();
    ctx.globalAlpha=1-k;
    /* 낫 자루 + 날 — 위에서 아래로 훑는 회전 */
    ctx.translate(x,gy-58);
    ctx.rotate(-1.15+k*2.3);
    ctx.strokeStyle='#4A4458'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(0,30); ctx.stroke();
    ctx.strokeStyle='#E7E2F5'; ctx.lineWidth=7;
    ctx.beginPath(); ctx.arc(0,-34,30,Math.PI*0.05,Math.PI*0.85); ctx.stroke();
    ctx.restore();
    /* 참격선 */
    ctx.save();
    ctx.globalAlpha=(1-k)*0.9;
    ctx.strokeStyle='#FF5E6C'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-30,gy-74+k*24); ctx.lineTo(x+30,gy-38+k*24); ctx.stroke();
    ctx.restore();
  }

  /* 적 화살 */
  ctx.strokeStyle='#6B4A2B'; ctx.lineWidth=3;
  for(const a of G.arrows){
    const x=a.x-cam;
    ctx.beginPath(); ctx.moveTo(x,gy-38); ctx.lineTo(x+16,gy-38); ctx.stroke();
    ctx.fillStyle='#D8DDE2';
    ctx.beginPath(); ctx.moveTo(x,gy-41); ctx.lineTo(x-6,gy-38); ctx.lineTo(x,gy-35); ctx.closePath(); ctx.fill();
  }

  /* 플레이어 투사체 */
  for(const pr of G.pprojs){
    const x=pr.x-cam;
    if(pr.type==='axe'){
      ctx.save(); ctx.translate(x,gy-46); ctx.rotate(pr.spin);
      ctx.fillStyle='#7A5230'; ctx.fillRect(-2,-12,4,22);
      ctx.fillStyle='#D2691E';
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.quadraticCurveTo(13,-12,12,-1); ctx.quadraticCurveTo(5,-6,0,-4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }else if(pr.type==='parrow'){
      ctx.strokeStyle='#8A6B4F'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x-14,gy-46); ctx.lineTo(x,gy-46); ctx.stroke();
      ctx.fillStyle='#E8ECF0';
      ctx.beginPath(); ctx.moveTo(x,gy-49); ctx.lineTo(x+7,gy-46); ctx.lineTo(x,gy-43); ctx.closePath(); ctx.fill();
    }else if(pr.type==='spear'){
      ctx.strokeStyle='#C9A03B'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(x-30,gy-44); ctx.lineTo(x,gy-44); ctx.stroke();
      ctx.fillStyle='#E8ECF0';
      ctx.beginPath(); ctx.moveTo(x,gy-49); ctx.lineTo(x+12,gy-44); ctx.lineTo(x,gy-39); ctx.closePath(); ctx.fill();
    }else if(pr.type==='wave'){
      ctx.strokeStyle='rgba(120,220,255,.9)'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(x-10,gy-40,22,-1.1,1.1); ctx.stroke();
      ctx.strokeStyle='rgba(200,240,255,.7)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(x-14,gy-40,16,-1.0,1.0); ctx.stroke();
    }
  }

  /* 번개 */
  for(const b of G.bolts){
    const x=b.x-cam, a=clamp(1-b.t/0.3,0,1);
    ctx.strokeStyle=`rgba(255,228,92,${a})`; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.moveTo(x+Math.sin(b.seed)*10,30);
    for(let s2=1;s2<=6;s2++){
      const ny=30+(gy-100)*s2/6;
      ctx.lineTo(x+Math.sin(b.seed+s2*3.7)*14,ny);
    }
    ctx.lineTo(x,gy-40); ctx.stroke();
    ctx.fillStyle=`rgba(255,240,150,${a*0.8})`;
    ctx.beginPath(); ctx.arc(x,gy-40,14*(1.4-a),0,7); ctx.fill();
  }



  /* 플레이어 */
  const px2=G.player.worldX-cam;
  drawCharOn(ctx,px2,gy,{s:1.05,f:1,body:'#5E6A75',hat:'helmet',weapon:'sword',
    bob:G.player.walking?Math.sin(t*13)*3:Math.sin(t*3)*1.5,
    hitT:G.player.hitT, strikeT:G.player.strikeT});
  drawHpBar(px2,gy+12,62,G.player.hp/G.player.maxHp,fmt(G.player.hp),'#E8483F');
  drawHpBar(px2,gy+29,62,G.player.maxSh?G.player.sh/G.player.maxSh:0,fmt(G.player.sh),'#38A6E8');

  /* 파티클 */
  for(const pt of G.parts){
    const x=pt.x-cam, frac=1-pt.t/pt.life;
    if(pt.puff){
      ctx.fillStyle=pt.color+(frac*0.7)+')';
      ctx.beginPath(); ctx.arc(x,gy+pt.y,pt.size*(1+pt.t*2),0,7); ctx.fill();
    }else{
      ctx.globalAlpha=frac;
      ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(x,gy+pt.y,pt.size,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  /* 플로팅 텍스트 */
  ctx.textAlign='center';
  for(const ft of G.texts){
    const x=ft.x-cam;
    const pop=ft.t<0.12? 1+(0.12-ft.t)*4 : 1;
    ctx.font=(ft.big?26:17)*pop+'px Jua';
    ctx.globalAlpha=clamp(1.3-ft.t,0,1);
    ctx.fillStyle='rgba(0,0,0,.45)';
    ctx.fillText(ft.txt,x+1.5,gy+ft.y-ft.t*46+1.5);
    ctx.fillStyle=ft.color;
    ctx.fillText(ft.txt,x,gy+ft.y-ft.t*46);
  }
  ctx.globalAlpha=1;
}

/* ================= MAIN LOOP ================= */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  if(screenName==='game'&&G){
    if(!G.paused&&!G.over) update(dt*SPEEDS[speedIdx]);
    drawScene();
  }
  requestAnimationFrame(loop);
}
/* ⚑ T64 — 주소창이 뜨고 지면 프레임 폭이 바뀌므로(9:19 고정 = 높이가 폭을 정한다) 상단 줄 배율도 다시 잡는다.
   로비는 renderLobby 안에서, 인게임은 여기서 직접 — 폭이 넓어졌을 때 원래 크기로 되돌아오는 경로이기도 하다. */
window.addEventListener('resize',()=>{
  if(screenName==='lobby') renderLobby();
  if(screenName==='game'){ gameTopKey=''; syncGameTop(); }
});
renderLobby();
requestAnimationFrame(loop);
</script>
